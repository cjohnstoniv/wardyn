# Wardyn compose demo. Two CI-tested deployment paths exist (anti-Gitpod
# constraint): this one and deploy/helm/wardyn. This stack stands up Postgres,
# Dex (human SSO IdP), and wardynd built WITH the docker runner so it can launch
# real governed sandboxes on the host Docker daemon.
#
# ─────────────────────────────────────────────────────────────────────────────
# DAEMON-TRUST TRADEOFF (loud, on purpose):
#   The wardynd service bind-mounts /var/run/docker.sock. That grants wardynd
#   root-equivalent control of the host Docker daemon — it can create, inspect,
#   and destroy ANY container on the host, not just Wardyn's. This is acceptable
#   ONLY for a machine you trust, run by ONE trusted operator. Do NOT expose this
#   stack to untrusted networks or share the host between MUTUALLY-UNTRUSTED users
#   (any job holding the socket controls the whole daemon). True multi-TENANT
#   isolation (untrusted users, scoped RBAC, no shared host socket) is the
#   Kubernetes runner (deploy/helm/wardyn, k8s.enabled=true — see that chart's
#   README.md), a completely separate substrate (internal/runner/k8s) from
#   this compose stack's shared-daemon one; this compose stack stays the
#   single-trusted-operator local/CI path.
# ─────────────────────────────────────────────────────────────────────────────
#
# CONCURRENT JOBS on a shared host (one trusted operator, e.g. a CI fleet under one
# service account) ARE supported: scripts/ci-run.sh scopes every object to a unique
# COMPOSE_PROJECT_NAME + WARDYN_NS (container names, the control-plane network, the
# recordings volume) and binds host ports ephemerally, so parallel invocations don't
# collide and one job's `down --volumes` never tears down another's. The single-user
# interactive default (WARDYN_NS unset => wardyn-*) is unchanged.
#
# Defaults below are demo-grade secrets. Override via a sibling .env file or the
# shell environment for anything beyond a laptop demo.

services:
  # Local OCI registry backing devcontainer builds: envbuilder is daemonless
  # and can only PUSH its result, so the recommended per-workspace build needs
  # a registry to round-trip through. TWO reach paths on purpose, for two
  # different callers (PLATREST-2): the loopback publish below is for the HOST
  # DAEMON's own pull at FINALIZE time only (Docker exempts 127.0.0.1
  # registries from TLS, zero daemon config needed) — the untrusted BUILD
  # CONTAINER never touches it, because it no longer shares the host network
  # namespace (see WARDYN_ENVBUILD_BUILD_NETWORK on wardynd below). Instead the
  # build container reaches this registry by compose service name over the
  # DEDICATED wardyn-envbuild bridge (registry:5000,
  # WARDYN_ENVBUILD_REGISTRY_INSECURE standing in for the TLS exemption a
  # bridge address doesn't get for free) — NOT the wardyn-internal bridge, so
  # this untrusted build container is never a network peer of postgres or the
  # admin API (see the `networks:` block at the bottom of this file). Still
  # not reachable off-host either way.
  registry:
    image: registry:3@sha256:3725021071ec9383eb3d87ddbdff9ed602439b3f7c958c9c2fb941049ea6531d
    container_name: ${WARDYN_NS:-wardyn}-registry
    restart: unless-stopped
    ports:
      # Host-port parameterized like WARDYN_PG_PORT above so concurrent stacks
      # on a shared host don't collide on 5010; set WARDYN_REGISTRY_PORT=0 for
      # an OS-assigned ephemeral port (scripts/ci-run.sh does this by default,
      # and its runs are BYOA-only — they never pull from this registry).
      # NOTE: PORT=0 makes WARDYN_ENVBUILD_PUSHED_REF (below) interpolate to the
      # unresolvable 127.0.0.1:0/… — a run doing a devcontainer build must then
      # set WARDYN_ENVBUILD_PUSHED_REF explicitly (the real ephemeral port is
      # unknowable at interpolation time).
      - "127.0.0.1:${WARDYN_REGISTRY_PORT:-5010}:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - wardyn
      # Also on the build-only network: the untrusted build container (see
      # WARDYN_ENVBUILD_BUILD_NETWORK below) is NOT on `wardyn` — it must
      # still reach `registry:5000` to push, so registry is multi-homed
      # rather than the build container joining the control-plane bridge.
      - wardyn-envbuild

  postgres:
    # Digest-pinned (tag kept for readability). postgres:17 is a FLOATING major,
    # so the digest freezes the exact image; bump both together on a version move.
    image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    container_name: ${WARDYN_NS:-wardyn}-postgres
    # Survive a host reboot (e.g. a MacBook's weekly MDM window) — otherwise only
    # the registry came back and the stack was down until a manual `up` (D18).
    restart: unless-stopped
    # Loopback-only publish so a HOST-MODE wardynd (run outside compose, e.g. to use
    # the resident `claude` CLI composer backend) can reach the same database.
    # Host port parameterized (WARDYN_PG_PORT) so concurrent stacks on a shared host
    # don't collide on 5432; set WARDYN_PG_PORT=0 for an OS-assigned ephemeral port
    # (CI, which reaches postgres only in-network by service name).
    ports:
      - "127.0.0.1:${WARDYN_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: wardyn
      POSTGRES_DB: wardyn
      POSTGRES_PASSWORD: wardyn-dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardyn -d wardyn"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wardyn

  dex:
    # Digest-pinned (tag kept for readability); bump both together on a version move.
    image: ghcr.io/dexidp/dex:v2.40.0@sha256:3e35d5d0f7dbd33fbadc36a71ff58cf4097ab98d73d22f6cb9a6471a32e028af
    container_name: ${WARDYN_NS:-wardyn}-dex
    # Opt-in: human SSO is OFF by default (`make setup` / `scripts/up.sh up`
    # starts only postgres+wardynd with WARDYN_LOCAL_MODE=true and an empty
    # OIDC issuer). Bring dex up explicitly with `docker compose --profile sso
    # up` (or name it: `docker compose up dex` — explicit names always start
    # regardless of active profiles).
    profiles: ["sso"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    # NOTE: dex config env-expansion is NOT used here. Both the client secret and
    # the demo password hash are LITERALS in dex.yaml. Enabling DEX_EXPAND_ENV
    # would corrupt the bcrypt hash ($2a$/$10$ segments read as undefined vars),
    # and leaving it off (the observed default) means an injected ${DEX_CLIENT_SECRET}
    # is never substituted and every token exchange fails with "invalid client_secret".
    # To rotate the secret, edit dex.yaml AND WARDYN_OIDC_CLIENT_SECRET below together.
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
    ports:
      # Loopback-only (was 0.0.0.0 — a hardening gap: dex must never be reachable
      # off-host) and host-port parameterized so concurrent sso-profile stacks
      # don't collide. Dex only runs under the `sso` profile; set WARDYN_DEX_PORT=0
      # for an ephemeral port.
      - "127.0.0.1:${WARDYN_DEX_PORT:-5556}:5556"
    healthcheck:
      # Dex serves an OIDC discovery doc once ready.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5556/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wardyn

  wardynd:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.wardynd
      # Corporate-build pass-through (empty by default; OSS builds ignore them).
      # UI_STAGE=ui-prebuilt consumes a host-built ui/dist when the corp mirror
      # can't fetch pnpm; NPM_REGISTRY/proxy feed the in-container pnpm install
      # for a transparent-cache mirror. Stage the corp CA at deploy/images/corp-ca.pem.
      args:
        UI_STAGE: "${WARDYN_UI_STAGE:-ui-build}"
        NPM_REGISTRY: "${NPM_REGISTRY:-}"
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
        # Target for the host-native `wardyn` the image also builds (see
        # Dockerfile.wardynd) — scripts/up.sh sets these from the host's uname so
        # it can extract and run that binary for host-side proxy detection.
        HOST_GOOS: "${WARDYN_HOST_GOOS:-linux}"
        HOST_GOARCH: "${WARDYN_HOST_GOARCH:-amd64}"
    # Overridable so a job that must NOT share the mutable :local tag with a
    # concurrent build on the same daemon can build+run its own (scripts/
    # run-e2e-ssh.sh, run-e2e-ui-sandbox.sh). Default unchanged for every
    # other caller.
    image: ${WARDYN_WARDYND_IMAGE:-wardyn/wardynd:local}
    container_name: ${WARDYN_NS:-wardyn}-api
    # Survive a host reboot alongside postgres/registry (D18); a per-run proxy
    # sidecar is launched by the docker runner (not a compose service), so its
    # restart posture is set container-side, not here.
    restart: unless-stopped
    # The docker runner needs to reach the host daemon to create sandboxes.
    # Run as root inside the container so it can open the bind-mounted socket
    # (demo only; see the DAEMON-TRUST note above).
    user: root
    environment:
      # Groundtruth token rotator target: wardynd mints + rewrites a fresh
      # host-sensor token here (a shared volume) so the tetragon-ingest sidecar
      # recovers when its ~1h token expires instead of going blind. Off when unset.
      WARDYN_GROUNDTRUTH_TOKEN_FILE: "/var/run/wardyn-gt/token"
      WARDYN_PG_DSN: "postgres://wardyn:wardyn-dev@postgres:5432/wardyn?sslmode=disable"
      WARDYN_LISTEN: ":8080"
      # Host-side proxy detection, captured by scripts/up.sh (base64 JSON, already
      # credential-masked). DIAGNOSTICS ONLY. Deliberately NOT named HTTP_PROXY/
      # HTTPS_PROXY: Go's net/http honors those process-wide, so the standard names
      # here would silently reroute wardynd's OWN outbound calls — OIDC discovery to
      # dex (Go exempts only loopback, never a bare service name), the audit webhook
      # sink, GitHub App token minting, the AWS credential chain — through the corp
      # proxy. A run's egress is unaffected either way: the sandbox env is built from
      # scratch in runs_dispatch.go and always points at wardyn-proxy.
      WARDYN_HOST_PROXY_B64: "${WARDYN_HOST_PROXY_B64:-}"
      # The control-plane bridge the docker runner connects the proxy sidecar to.
      # MUST equal the `wardyn` network's name (both derive from WARDYN_NS) — a
      # shared multi-job host sets WARDYN_NS per project so concurrent stacks each
      # get their own network. Default wardyn-internal (single-tenant, unchanged).
      WARDYN_INTERNAL_NETWORK: "${WARDYN_NS:-wardyn}-internal"
      # Transport security (TLS). The demo serves PLAIN HTTP on localhost; wardynd
      # logs a loud WARNING at boot. For any non-localhost deployment, add TLS via
      # ONE of the two options below (see this directory's README "Transport
      # security"). Leave BOTH unset for the plain-HTTP demo — Secure cookies are
      # never sent over plain HTTP and would break the demo login.
      #
      # (a) Built-in TLS: bind-mount your cert+key and point wardynd at them
      #     (both must be set together; one alone fails closed at boot). Cookies
      #     are then marked Secure automatically.
      # WARDYN_TLS_CERT: "/certs/tls.crt"
      # WARDYN_TLS_KEY: "/certs/tls.key"
      #
      # (b) TLS terminates at an upstream reverse proxy that forwards plain HTTP
      #     to wardynd: set this so cookies are marked Secure even though wardynd
      #     itself speaks plain HTTP.
      # WARDYN_TLS_TERMINATED: "true"
      WARDYN_ADMIN_TOKEN: "${WARDYN_ADMIN_TOKEN:-demo-admin-token}"
      # LOCAL HOST MODE (single-developer machine): set WARDYN_LOCAL_MODE=true to
      # bypass the public-API login entirely — open http://localhost:8080 and spawn
      # agents with NO SSO/Dex and NO token. Actions are attributed to
      # WARDYN_LOCAL_OPERATOR (default: the container OS user). Run-token auth for
      # the sidecars is UNAFFECTED. wardynd logs a WARNING because the bind is not
      # loopback (the published port is reachable on your host); fine for a single
      # dev machine behind a firewall. Leave false to keep the token/SSO demo.
      WARDYN_LOCAL_MODE: "${WARDYN_LOCAL_MODE:-false}"
      WARDYN_LOCAL_OPERATOR: "${WARDYN_LOCAL_OPERATOR:-}"
      # LOCAL-MODE no-auth requires a loopback request PEER. In compose wardynd binds
      # 0.0.0.0 inside the container but the port is published loopback-only
      # (127.0.0.1:PORT below), so a host UI/CLI request arrives from the docker
      # bridge gateway, not loopback — trust the forwarder here. This is safe ONLY
      # because of that 127.0.0.1 publish (a LAN peer cannot reach the port at all);
      # the DNS-rebinding Host guard still applies. Never set this on a directly-bound
      # host-mode wardynd. Residual (defense-in-depth): with this on, other containers
      # ON wardyn-internal (postgres, dex, a run's proxy sidecar) can also reach the
      # no-auth API — agents are NOT on this network, so this needs an already-
      # compromised in-network container. Follow-up hardening: accept only a trusted
      # gateway CIDR instead of any non-loopback peer.
      WARDYN_LOCAL_TRUST_FORWARDER: "${WARDYN_LOCAL_TRUST_FORWARDER:-true}"
      WARDYN_RUNNER: "docker"
      # Mirrors the volumes-side WARDYN_WORKSPACES_ROOT mapping below, so wardynd
      # can NAME the configured root when a local-directory scan misses — "not
      # found" from a sealed daemon otherwise reads as a lie to an operator whose
      # directory plainly exists on the host. Empty = no root mounted (the
      # default), which the error message also states rather than implies.
      WARDYN_WORKSPACES_ROOT: "${WARDYN_WORKSPACES_ROOT:-}"
      WARDYN_PROXY_IMAGE: "${WARDYN_PROXY_IMAGE:-wardyn/wardyn-proxy:local}"
      WARDYN_CONTROL_PLANE_URL: "http://wardynd:8080"
      # Devcontainer image builds — ON by default on the compose stack: the
      # wizard's DEFAULT card is "Recommended — built for this workspace", and a
      # default the deployment can't honor reads as "command not found" inside
      # the first verify session. The registry sidecar above supplies the
      # round-trip envbuilder needs (daemonless: push-then-finalize; the old
      # docker.sock commit knob stays retired). The build container runs on the
      # DEDICATED wardyn-envbuild bridge by default HERE, NOT host (PLATREST-2)
      # and NOT wardyn-internal either: "host" would hand the untrusted build
      # (Dockerfile RUN, feature installs, onCreate/updateContent — see
      # internal/envbuild's package doc) the operator's whole loopback, and
      # wardyn-internal would still make it an in-network PEER of the
      # control-plane Postgres and admin API (well-known demo credentials) even
      # without loopback — a bridge-scoped peer can still dial their compose
      # service names/ports directly. wardyn-envbuild carries neither.
      # docs/ENVBUILD.md "Build sandbox" spells out what that residual would be.
      # The recommended recipe is Wardyn-generated (not repo content); a repo's
      # OWN devcontainer build carries the usual build-step network caveat
      # (docs/ENVBUILD.md "Residual"). Opt out with WARDYN_ENVBUILD=false;
      # host-mode setups keep the explicit knobs.
      WARDYN_ENVBUILD: "${WARDYN_ENVBUILD:-true}"
      # Reachable from the build container by the registry's OWN compose
      # service name + container port over wardyn-envbuild (registry is
      # multi-homed onto both networks — see its service block above) — see
      # the registry service's comment above for why this is a DIFFERENT
      # address than the finalize pull below uses.
      WARDYN_ENVBUILD_CACHE_REPO: "${WARDYN_ENVBUILD_CACHE_REPO:-registry:5000/wardyn/devcontainers}"
      # Dedicated build-only bridge (no postgres/dex/wardynd on it) — see the
      # registry service comment above and the `networks:` block below.
      WARDYN_ENVBUILD_BUILD_NETWORK: "${WARDYN_ENVBUILD_BUILD_NETWORK:-${WARDYN_NS:-wardyn}-envbuild}"
      # The FINALIZE stage's pull runs on the HOST DAEMON (FROM + COPY, outside
      # the build container entirely), so it is unaffected by
      # WARDYN_ENVBUILD_BUILD_NETWORK above; it keeps resolving the image
      # envbuilder just pushed at the loopback address, unchanged from before
      # this range, which Docker exempts from TLS with zero daemon config.
      WARDYN_ENVBUILD_PUSHED_REF: "${WARDYN_ENVBUILD_PUSHED_REF:-127.0.0.1:${WARDYN_REGISTRY_PORT:-5010}/wardyn/devcontainers}"
      # registry:5000 (unlike 127.0.0.1) gets no free TLS exemption, and this
      # registry has never spoken TLS either way — tell envbuilder so directly
      # rather than silently failing every push. Never set this against a real
      # external CacheRepo (docs/ENVBUILD.md "Build sandbox").
      WARDYN_ENVBUILD_REGISTRY_INSECURE: "${WARDYN_ENVBUILD_REGISTRY_INSECURE:-true}"
      # Runner tools the finalize stage layers onto built images — shipped IN
      # the wardynd image (Dockerfile.wardynd), so this is zero-config too.
      WARDYN_ENVBUILD_TOOLS_DIR: "${WARDYN_ENVBUILD_TOOLS_DIR:-/wardyn-tools}"
      # CC1 (runc) demo policy: plain Docker hosts without gVisor (CC2) can still
      # launch runs. Override with WARDYN_DEFAULT_POLICY=/examples/policies/default.json
      # on a CC2-capable host (the default.json policy demands CC2).
      WARDYN_DEFAULT_POLICY: "${WARDYN_DEFAULT_POLICY:-/examples/policies/demo.json}"
      WARDYN_RECORDING_DIR: "/data/recordings"
      # Recording delivery: wardyn-rec uploads finished casts through the
      # proxy's brokered route (run-token injected proxy-side; cross-run
      # uploads 403 at the control plane). No shared volume is mounted into
      # agent containers — a shared mount would have no cross-run isolation
      # since all agent images run the same uid. WARDYN_RECORDING_MOUNT remains
      # available as an opt-in single-host fallback with that documented caveat.
      # Secret-store age identity. Left EMPTY by default: wardynd generates an
      # ephemeral key on boot (secrets do NOT persist across restarts — fine for
      # a demo). For persistence set WARDYN_AGE_KEY to your OWN key from
      # `age-keygen`. wardynd fails closed if given the old publicly-known demo
      # key. Never bake a real key into a committed file.
      WARDYN_AGE_KEY: "${WARDYN_AGE_KEY:-}"
      WARDYN_AUDIT_SINKS: '${WARDYN_AUDIT_SINKS:-{"file":{"path":"/data/audit/audit.log","max_bytes":10485760,"keep":3}}}'
      # Audit fallback spool (C1): a Postgres write that fails is fsync'd here
      # instead of silently lost (internal/api/auditspool.go). Lands in the
      # same `audit` volume the file sink above uses (mounted at /data/audit
      # below), so it survives a container restart same as that sink does.
      WARDYN_AUDIT_SPOOL: "/data/audit/audit-spool.jsonl"
      # Human SSO via Dex. PUBLIC issuer (browser-facing, published on the host)
      # is localhost:5556; wardynd reaches Dex server-side at the internal docker
      # hostname dex:5556 and rewrites localhost:5556 -> dex:5556 for
      # discovery/token/JWKS. SSO therefore works in the browser with NO
      # /etc/hosts edit. (Dex's issuer in dex.yaml must match the public URL.)
      # Empty by default (SSO opt-in, see the `dex` service's `profiles: [sso]`
      # note above) — wardynd only configures OIDC when this is non-empty, and
      # fails closed on discovery failure once it IS set, so the default path
      # must never point at an issuer that isn't running. Set it (and start
      # dex) via `docker compose --profile sso up` for the SSO/Dex demo.
      WARDYN_OIDC_ISSUER: "${WARDYN_OIDC_ISSUER:-}"
      WARDYN_OIDC_INTERNAL_ISSUER: "${WARDYN_OIDC_INTERNAL_ISSUER:-http://dex:5556}"
      WARDYN_OIDC_CLIENT_ID: "wardyn"
      WARDYN_OIDC_CLIENT_SECRET: "${WARDYN_OIDC_CLIENT_SECRET:-wardyn-oidc-secret}"
      WARDYN_OIDC_REDIRECT_URL: "http://localhost:8080/auth/callback"
      WARDYN_OIDC_EMAIL_DOMAINS: "${WARDYN_OIDC_EMAIL_DOMAINS:-wardyn.local}"
      # Operator allowlist of the minimal viewer/operator gate. EMPTY by default
      # = every authenticated human is an operator (unchanged). Set it to a
      # comma-separated list of full addresses and every other signed-in human
      # becomes a read-only member on the harness-credential, policy, workspace
      # and site-config writes. See docs/OPERATIONS.md "Who can change what".
      WARDYN_OIDC_OPERATOR_EMAILS: "${WARDYN_OIDC_OPERATOR_EMAILS:-}"
      # Leaving the list empty WITH OIDC configured refuses to boot
      # (validateOperatorPosture) — every signed-in human would be
      # admin-equivalent. The demo `sso` profile needs one or the other, so this
      # override is plumbed: set it true to keep the old all-operators demo, or
      # (preferred) set WARDYN_OIDC_OPERATOR_EMAILS above.
      WARDYN_ALLOW_OIDC_NO_OPERATOR_LIST: "${WARDYN_ALLOW_OIDC_NO_OPERATOR_LIST:-}"
      # Admin/member RBAC (docs/ENV.md): role map takes precedence over the
      # operator allowlist; default role catches unmatched signers-in.
      WARDYN_OIDC_ROLE_MAP: "${WARDYN_OIDC_ROLE_MAP:-}"
      WARDYN_OIDC_DEFAULT_ROLE: "${WARDYN_OIDC_DEFAULT_ROLE:-}"
      # SSH gateway (docs/SSH.md). Empty WARDYN_SSH_LISTEN (the default) means
      # off — no listener, not even a generated host key — regardless of
      # whether the WARDYN_SSH_PORT mapping above is published. Set both to
      # turn it on: WARDYN_SSH_LISTEN=:2222 (matching the published container
      # port) and WARDYN_SSH_ADVERTISE to whatever host operators actually
      # reach this compose stack on (e.g. localhost:2222) — the gateway binds
      # the former, the run-detail "Connect via SSH" card only ever shows the
      # latter.
      WARDYN_SSH_LISTEN: "${WARDYN_SSH_LISTEN:-}"
      WARDYN_SSH_ADVERTISE: "${WARDYN_SSH_ADVERTISE:-}"
      # UI-sandbox gateway (docs/UI-SANDBOXES.md), same off-by-default shape:
      # empty WARDYN_UI_SANDBOX_LISTEN means no listener and no relay cookie
      # key, whatever the port mapping above publishes. Turn it on with
      # WARDYN_UI_SANDBOX_LISTEN=:8081 (matching that mapping) and
      # WARDYN_UI_SANDBOX_ADVERTISE=http://localhost:8081 — the second value is
      # what the console's Open button uses, and it must NOT be the console's
      # own origin: the relay serves the sandbox's own pages. The per-run
      # origin template is not usable here (it needs wildcard DNS), so a
      # compose stack runs the shared-origin mode this documents as a residual
      # (threatmodel/THREAT-MODEL.md §5 #18).
      WARDYN_UI_SANDBOX_LISTEN: "${WARDYN_UI_SANDBOX_LISTEN:-}"
      WARDYN_UI_SANDBOX_ADVERTISE: "${WARDYN_UI_SANDBOX_ADVERTISE:-}"
      # Agent image overrides: map agent-name -> OCI image ref. The demo tags
      # are produced by `make agent-images` or `docker compose --profile build-only build`.
      WARDYN_AGENT_IMAGES: "${WARDYN_AGENT_IMAGES:-{\"claude-code\":\"wardyn/agent-claude-code:local\",\"codex-cli\":\"wardyn/agent-codex-cli:local\",\"aws-sso\":\"wardyn/agent-aws-sso:local\"}}"
      # Subscription auth mode. Proxy-side OAuth injection needs wardynd to run
      # where the operator's ~/.claude + `claude` binary live (host mode) so it
      # can mint/refresh the live token. The COMPOSE wardynd is distroless and
      # has neither, so injection can only fail-lazily and crash the per-run
      # proxy when it tries to resolve the subscription-oauth secret. `off`
      # selects RESIDENT-COPY: a run that mounts ~/.claude uses those creds
      # directly (stage them fresh with `WARDYN_SUBSCRIPTION_INJECT=off
      # scripts/stage-claude-creds.sh`). This is the correct default for compose.
      WARDYN_SUBSCRIPTION_INJECT: "${WARDYN_SUBSCRIPTION_INJECT:-off}"
      # AWS Bedrock as a third Claude transport (enterprise: no direct Anthropic
      # egress, billed via AWS). Set region + a cross-region INFERENCE-PROFILE id
      # (NOT a bare model id) to enable; Claude runs then use Bedrock automatically
      # (precedence: subscription > bedrock > api-key). Credentials come from the
      # SECRET STORE (add via the Setup UI or the secrets API), not env:
      #   - PREFERRED (never-resident): a `bedrock-api-key` bearer token — proxy-
      #     injected as Authorization: Bearer into bedrock-runtime, like an api key.
      #   - or SigV4 access keys `aws-access-key-id` + `aws-secret-access-key`
      #     (+ optional `aws-session-token`) — these are RESIDENT in the sandbox env
      #     (SigV4 signs in-process; see threatmodel). Region/model change needs a
      #     wardynd restart (creds are live-addable).
      #   - or WARDYN_BEDROCK_AWS_DIR below: bind your host ~/.aws read-only and let the
      #     AWS SDK resolve creds itself (RESIDENT in the sandbox at /home/agent/.aws).
      #     SSO/IAM-Identity-Center only auto-refreshes for `sso-session` profiles whose
      #     CACHED token is still valid at run start — the read-only mount can't write
      #     back a rotated token, and legacy `sso_start_url` profiles need a periodic
      #     host `aws sso login`. NOTE: this exposes the ENTIRE host ~/.aws (all
      #     profiles + cached tokens) to the untrusted sandbox (uid 1000 — you may need
      #     `setfacl -R -m u:1000:rX ~/.aws`). Point it at ~/.aws only.
      WARDYN_BEDROCK_REGION: "${WARDYN_BEDROCK_REGION:-}"
      WARDYN_BEDROCK_MODEL: "${WARDYN_BEDROCK_MODEL:-}"
      WARDYN_BEDROCK_AWS_DIR: "${WARDYN_BEDROCK_AWS_DIR:-}"
      WARDYN_BEDROCK_AWS_PROFILE: "${WARDYN_BEDROCK_AWS_PROFILE:-}"
      WARDYN_BEDROCK_AWS_SSO_REGION: "${WARDYN_BEDROCK_AWS_SSO_REGION:-}"
      # Standard AWS env, passed through from the operator's shell so a machine
      # already configured for AWS needs no Wardyn-specific restatement. wardynd
      # uses these ONLY when the WARDYN_BEDROCK_* above resolve empty. Region
      # alone can't enable Bedrock (that also needs WARDYN_BEDROCK_MODEL), so an
      # inherited AWS_REGION cannot silently turn the transport on. No
      # credentials are forwarded here — only selectors.
      AWS_REGION: "${AWS_REGION:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-}"
      AWS_PROFILE: "${AWS_PROFILE:-}"
    volumes:
      # Daemon trust: see the loud note at the top of this file.
      # WARDYN_DOCKER_SOCK selects WHICH daemon wardynd drives. It matters on hosts
      # running two daemons (e.g. Docker Desktop owns /var/run/docker.sock while a
      # native in-distro dockerd listens elsewhere): the driver probes CC2/CC3
      # runtimes against `docker info` of the daemon behind THIS socket and fails
      # closed when they're absent — so pointing at a runc-only daemon silently
      # caps the whole control plane at CC1.
      - ${WARDYN_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      # Shared groundtruth-token file: wardynd's rotator WRITES a fresh host-sensor
      # token here; the wardyn-tetragon-ingest sidecar reads it read-only.
      - groundtruth_token:/var/run/wardyn-gt
      # Workspaces root — READ-ONLY, mounted at the SAME path inside the container so
      # host paths resolve identically on both sides. A `local_dir` workspace is
      # scanned IN-PROCESS by wardynd (os.Stat + workspacescan.Scan, see
      # internal/api/workspaces.go handleScanWorkspace), so a sealed/containerized
      # wardynd that cannot see the host filesystem fails EVERY local-directory
      # import with "local directory not found on this host" — even though the run
      # itself would mount fine, because the sandbox bind is resolved daemon-side.
      #
      # Point this at the NARROWEST directory that contains your projects — ideally
      # a dedicated projects dir, e.g.
      #     WARDYN_WORKSPACES_ROOT=/home/you/projects
      # DO NOT set it to your home directory. wardynd would then be able to read
      # ~/.ssh, ~/.aws, ~/.claude and the staged ~/.wardyn/claude-creds, and it is
      # the process that decides what gets mounted into sandboxes — a needlessly
      # large blast radius for a feature that only needs to read source files.
      # Read-only is sufficient: the scan never writes.
      #
      # Default is a harmless empty path: local-directory import stays unavailable
      # until an operator opts in by naming a root, rather than silently exposing
      # anything.
      - ${WARDYN_WORKSPACES_ROOT:-/var/empty/wardyn-no-workspaces-root}:${WARDYN_WORKSPACES_ROOT:-/var/empty/wardyn-no-workspaces-root}:ro
      # Bedrock ~/.aws (WARDYN_BEDROCK_AWS_DIR) — READ-ONLY, mounted at the SAME path
      # inside the container so the host path resolves identically on both sides: the
      # sandbox bind Source is resolved by the HOST dockerd (DooD siblings), and
      # wardynd's own os.Stat needs the path present in its container. Default is a
      # harmless empty path (Bedrock ~/.aws stays off until an operator sets the var).
      # See the WARDYN_BEDROCK_AWS_DIR note in this service's environment above.
      - ${WARDYN_BEDROCK_AWS_DIR:-/var/empty/wardyn-no-aws-dir}:${WARDYN_BEDROCK_AWS_DIR:-/var/empty/wardyn-no-aws-dir}:ro
      # MDM-managed directory (WARDYN_MANAGED_DIR) — READ-ONLY, the desktop tier's
      # one addition to this stack. WARDYN_DEFAULT_POLICY there is a HOST path
      # (/etc/wardyn/policy.json) wardynd reads off disk at boot, so the directory
      # has to be visible INSIDE the container at that same path. Unlike the two
      # mounts above, the CONTAINER side is the fixed literal /etc/wardyn — the
      # policy path is set by the MDM payload, not chosen by the operator — so only
      # the host side varies. Default is a harmless empty path: every non-desktop
      # deployment leaves this unset and mounts nothing. See docs/DESKTOP.md.
      - ${WARDYN_MANAGED_DIR:-/var/empty/wardyn-no-managed-dir}:/etc/wardyn:ro
      - recordings:/data/recordings
      - audit:/data/audit
    ports:
      # Loopback-only: WARDYN_LOCAL_MODE bypasses login entirely, so this must
      # never be reachable beyond the host. Override the host-side port with
      # WARDYN_UP_PORT (matches scripts/up.sh's doctor/healthz-wait).
      - "127.0.0.1:${WARDYN_UP_PORT:-8080}:8080"
      # SSH gateway (docs/SSH.md). The mapping is always here, loopback-only,
      # mirroring WARDYN_UP_PORT above; the gateway itself stays off until
      # WARDYN_SSH_LISTEN is ALSO set (see the environment block below) — an
      # unused mapped port with no listener behind it is inert (connection
      # refused).
      - "127.0.0.1:${WARDYN_SSH_PORT:-2222}:2222"
      # UI-sandbox gateway (docs/UI-SANDBOXES.md). Same always-mapped,
      # loopback-only, inert-until-enabled treatment as the SSH port above.
      # 127.0.0.1:8081 is a DIFFERENT ORIGIN than 127.0.0.1:8080 as far as the
      # browser is concerned (origin = scheme + host + PORT), which is exactly
      # the separation the gateway needs — but cookies are not port-scoped, so
      # on this stack the console's own cookies would be attached to relay
      # requests if the gateway did not strip every wardyn_* cookie inbound.
      # It does (internal/api/uigateway.go, uiStripInbound).
      - "127.0.0.1:${WARDYN_UI_SANDBOX_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      # The devcontainer-build registry rides along with wardynd: every
      # bring-up path names services explicitly (`up -d postgres dex wardynd`),
      # and a sidecar outside that list simply never starts — the build step
      # then fails with "dial tcp 127.0.0.1:5010: connection refused".
      registry:
        condition: service_started
      # required: false — dex is opt-in (profile "sso"); without it, Compose
      # would otherwise refuse to start wardynd at all when dex isn't part of
      # the active profile set ("depends on undefined service"). With SSO on,
      # this still waits for dex to be healthy before wardynd starts.
      dex:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "/usr/local/bin/wardyn", "runs", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wardyn

  # ───────────────────────────────────────────────────────────────────────────
  # eBPF GROUND-TRUTH TIER (the SECOND of Wardyn's three audit streams).
  #
  # `tetragon` is a PRIVILEGED host eBPF sensor (the upstream image). It loads
  # the TracingPolicies in ./tetragon-policies and EXPORTS kernel events as
  # line-delimited JSON to the shared `tetragon_export` volume.
  # `wardyn-tetragon-ingest` tails that JSON, correlates each event to a Wardyn
  # run by listing docker containers labelled wardyn.managed=true, maps a bounded
  # subset to audit events, and POSTs them to wardynd's
  # POST /api/v1/internal/groundtruth (which records them append-only -> Postgres
  # AND every SIEM sink, with zero new fanout code).
  #
  # This tier is OPTIONAL. On a host WITHOUT it (omit the `groundtruth` profile),
  # wardynd's /healthz reports ebpf_groundtruth=unavailable — honest degradation,
  # never a silent claim. Start the tier with:
  #   docker compose --profile groundtruth up -d tetragon wardyn-tetragon-ingest
  # after seeding WARDYN_GROUNDTRUTH_TOKEN (see below).
  #
  # TOKEN SEEDING (host-sensor auth): the ingest sidecar authenticates with a
  # token whose audience is "wardyn-groundtruth" (audit-write-only; it can never
  # mint or approve). Obtain one from the running control plane and export it
  # before starting this tier. No -age-key on the command line: `exec` runs
  # inside the ALREADY-RUNNING wardynd container, which already has
  # WARDYN_AGE_KEY in its own environment (this service's `environment` block
  # above) — the exec'd process inherits it, so passing it again as a flag
  # would only put the master key on an argv any `ps`/`/proc` reader on the
  # host can see for no benefit.
  #   export WARDYN_GROUNDTRUTH_TOKEN=$(docker compose exec -T wardynd \
  #     /usr/local/bin/wardynd -print-groundtruth-token \
  #     -dsn "$WARDYN_PG_DSN")
  # (The token has the provider's 1h TTL; re-mint on rotation. The wardynd image
  # bundles the wardynd binary, so the same image mints it.)
  # ───────────────────────────────────────────────────────────────────────────
  tetragon:
    # Digest-pinned (tag kept for readability); bump both together on a version move.
    image: quay.io/cilium/tetragon:v1.1.2@sha256:fca204b06c8bd5ade16cbe46f52429e11863dc2ce630cc8a2140b74eedbecde7
    container_name: ${WARDYN_NS:-wardyn}-tetragon
    profiles: ["groundtruth"]
    # Host eBPF sensor: needs privileged + host PID/cgroup + kernel mounts.
    privileged: true
    pid: host
    network_mode: host
    command:
      - --export-filename=/var/log/tetragon/tetragon.log
      - --tracing-policy-dir=/etc/tetragon/tetragon.tp.d
    volumes:
      # JSON export shared with the ingest sidecar.
      - tetragon_export:/var/log/tetragon
      # TracingPolicies (tcp_connect + sensitive-file-write).
      - ./tetragon-policies:/etc/tetragon/tetragon.tp.d:ro
      # Kernel/BPF/cgroup host mounts the sensor requires.
      - /sys/kernel/btf/vmlinux:/var/lib/tetragon/btf:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/fs/cgroup:/sys/fs/cgroup
      - /proc:/procRoot:ro

  wardyn-tetragon-ingest:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.tetragon-ingest
    image: wardyn/wardyn-tetragon-ingest:local
    container_name: ${WARDYN_NS:-wardyn}-tetragon-ingest
    profiles: ["groundtruth"]
    environment:
      WARDYN_TETRAGON_EXPORT: "/var/log/tetragon/tetragon.log"
      WARDYN_CONTROL_PLANE_URL: "http://wardynd:8080"
      # Host-sensor token (aud=wardyn-groundtruth). PREFERRED: the shared file below,
      # which wardynd's rotator keeps fresh so this sidecar RECOVERS when the ~1h token
      # expires instead of going permanently blind. WARDYN_GROUNDTRUTH_TOKEN is
      # a static fallback that CANNOT refresh — leave it empty when the file is wired.
      WARDYN_GROUNDTRUTH_TOKEN_FILE: "/var/run/wardyn-gt/token"
      WARDYN_GROUNDTRUTH_TOKEN: "${WARDYN_GROUNDTRUTH_TOKEN:-}"
      WARDYN_GROUNDTRUTH_HEARTBEAT: "30s"
      # Comma-separated run ids the host sensor is blind to (CC3/Kata); a
      # kernel.sensor.blind event is emitted once per id at boot.
      WARDYN_GROUNDTRUTH_BLIND_RUNS: "${WARDYN_GROUNDTRUTH_BLIND_RUNS:-}"
    volumes:
      # Read the Tetragon JSON export.
      - tetragon_export:/var/log/tetragon:ro
      # The host-sensor token wardynd's rotator keeps fresh; read-only here.
      - groundtruth_token:/var/run/wardyn-gt:ro
      # Read the host docker socket to list wardyn-managed containers for
      # correlation. Daemon-trust tradeoff applies (see the top-of-file note);
      # the sidecar only ever runs `docker ps` (read-only listing). Must follow
      # wardynd onto the SAME daemon, or the correlation lists the wrong host's
      # containers — see WARDYN_DOCKER_SOCK above.
      - ${WARDYN_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      wardynd:
        condition: service_healthy
      tetragon:
        condition: service_started
    networks:
      - wardyn

  # proxy is built here but not run as a long-lived service: the docker runner
  # launches one wardyn-proxy container per run from the wardyn/wardyn-proxy
  # image. This stanza exists so `docker compose build` produces that image.
  proxy-image:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.proxy
    # Same override knob as wardynd's, and the same variable wardynd reads
    # above — building this stanza and running the stack agree by construction.
    image: ${WARDYN_PROXY_IMAGE:-wardyn/wardyn-proxy:local}
    # Never started; build-only. `command: true` would still require an entry,
    # so we park it under a profile that the demo never activates.
    profiles: ["build-only"]
    command: ["--help"]

  # agent-claude-code and agent-codex-cli are build-only stanzas: the docker
  # runner launches agent containers on demand; these entries exist so
  # `docker compose --profile build-only build` produces the tagged images.
  # Both are parked under the build-only profile (never started by the demo).
  agent-claude-code:
    build:
      context: ../..
      dockerfile: deploy/images/claude-code/Dockerfile
      # Corporate-build pass-through for the npm install (empty by default).
      args:
        NPM_REGISTRY: "${NPM_REGISTRY:-}"
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: wardyn/agent-claude-code:local
    profiles: ["build-only"]
    command: ["sleep", "infinity"]

  agent-codex-cli:
    build:
      context: ../..
      dockerfile: deploy/images/codex-cli/Dockerfile
      # Corporate-build pass-through for the npm install (empty by default).
      args:
        NPM_REGISTRY: "${NPM_REGISTRY:-}"
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: wardyn/agent-codex-cli:local
    profiles: ["build-only"]
    command: ["sleep", "infinity"]

  # agent-vscode: same build-only convention as agent-claude-code/agent-codex-cli
  # above — never started by the demo, exists so `docker compose --profile
  # build-only build` produces the tagged image. `FROM wardyn/agent-claude-code:local`
  # (deploy/images/vscode/Dockerfile), so it depends on that image existing
  # locally first — same as `make agent-image-vscode` depending on
  # `agent-images-core`. Opt-in like agent-full: register it via
  # WARDYN_AGENT_IMAGES='{"vscode":"wardyn/agent-vscode:local"}' rather than
  # the default map above.
  agent-vscode:
    build:
      context: ../..
      dockerfile: deploy/images/vscode/Dockerfile
      # Corporate-build pass-through (the code-server fetch dials github.com).
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: wardyn/agent-vscode:local
    profiles: ["build-only"]
    command: ["sleep", "infinity"]

  # agent-aws-sso: same build-only convention as agent-claude-code/agent-codex-cli
  # above — never started by the demo, exists so `docker compose --profile
  # build-only build` produces the tagged image. Hosts an interactive
  # `aws sso login --sso-session wardyn --no-browser --use-device-code` session (AWS CLI v2; see
  # deploy/images/aws-sso/Dockerfile).
  agent-aws-sso:
    build:
      context: ../..
      dockerfile: deploy/images/aws-sso/Dockerfile
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: wardyn/agent-aws-sso:local
    profiles: ["build-only"]
    command: ["sleep", "infinity"]

volumes:
  registry_data:
  postgres_data:
  # Shared host-sensor token file: wardynd's rotator writes it, the tetragon-ingest
  # sidecar reads it, so the ground-truth stream survives the ~1h token TTL.
  groundtruth_token:
  recordings:
    # Empty under the default `pg` store; used only with
    # WARDYN_RECORDING_STORE=fs or the WARDYN_RECORDING_MOUNT fallback.
    # Explicit name so the docker runner can mount the SAME volume into agent
    # containers by name (compose would otherwise prefix it with the project).
    # Per-namespace so concurrent stacks don't share one recordings volume
    # (default wardyn-recordings, single-tenant unchanged).
    name: ${WARDYN_NS:-wardyn}-recordings
  audit:
  # Tetragon JSON export shared between the tetragon sensor (writer) and the
  # wardyn-tetragon-ingest sidecar (reader). Part of the groundtruth profile.
  tetragon_export:

networks:
  wardyn:
    # Per-namespace name so concurrent stacks on a shared host don't share one
    # control-plane network. Default wardyn-internal (single-tenant, unchanged).
    # MUST match wardynd's WARDYN_INTERNAL_NETWORK (both derive from WARDYN_NS) so
    # the docker runner connects the proxy sidecar to the right network.
    # postgres, dex, and wardynd (the admin API) live here — see wardyn-envbuild
    # below for why the untrusted envbuild build container is deliberately NOT
    # a member.
    name: ${WARDYN_NS:-wardyn}-internal
    driver: bridge
  wardyn-envbuild:
    # Dedicated bridge for the untrusted envbuilder BUILD container (Dockerfile
    # RUN, devcontainer feature installs, onCreate/updateContent all execute
    # here — internal/envbuild's package doc). It gets normal outbound internet
    # (same as any compose bridge — devcontainer builds need it) and can reach
    # `registry:5000` to push (registry is multi-homed onto both networks), but
    # is NOT a member of `wardyn`, so it is never an in-network peer able to
    # dial postgres or wardynd's admin API by service name — only WARDYN_ENVBUILD_
    # BUILD_NETWORK (wardynd, above) and the registry service reference this
    # network name, matching by WARDYN_NS the same way `wardyn` does.
    name: ${WARDYN_NS:-wardyn}-envbuild
    driver: bridge
