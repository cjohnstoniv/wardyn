# Default values for the wardyn-runnerd chart: one organisation-owned runner that places each run as an
# agent pod and a proxy pod in a dedicated runs namespace. One release per sandbox architecture.
# The chart refuses to render without org, runsNamespace, sandbox.arch and registration.existingSecret.

# The organisation's public HTTPS URL (register and serve --org).
org: ""

# The pre-existing namespace runs are placed in. It must not be the release namespace: a pod can name any
# ServiceAccount of its own namespace, so runs beside runnerd could name runnerd's.
runsNamespace: ""

sandbox:
  # Required: amd64 or arm64 (register and serve --arch, WARDYN_RUNNERD_ARCH). Every run pod and the canary get
  # nodeSelector kubernetes.io/arch=<arch> beside k8s.sandbox.nodeSelector's own keys, and the runner reports it
  # as its arch. A k8s.sandbox.nodeSelector kubernetes.io/arch of another arch refuses boot.
  # A mixed-arch cluster installs two releases, one per arch, each with its own release name, registration
  # Secret and runs namespace.
  arch: ""
  # Upper bound on both pods' activeDeadlineSeconds (--max-pod-lifetime).
  maxPodLifetime: 168h

image:
  repository: ghcr.io/cjohnstoniv/wardyn-runnerd
  # Empty means .Chart.AppVersion. The proxy image always takes the same tag.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

proxyImage:
  repository: ghcr.io/cjohnstoniv/wardyn-proxy

registration:
  # A Secret in the release namespace holding the single-use registration token under the key "token".
  # The chart never templates it. Mounted optional, so deleting it after registration does not block restarts.
  existingSecret: ""

# Register's limit flags. Zero leaves a flag out, so register proposes the value.
limits:
  maxRuns: 0
  totalCPU: 0
  totalMemory: 0
  totalDisk: 0
  perRunCPU: 0
  perRunMemory: 0
  perRunDisk: 0

# --recording-store: pg, fs or off.
recording: pg

trustedCA:
  # A ConfigMap in the release namespace holding a PEM bundle under the key "ca.pem" (--trusted-ca-file).
  configMap: ""

relay:
  # The run's control-plane URL port must equal servicePort; runnerd refuses a run whose port differs.
  servicePort: 443
  targetPort: 8443

sink:
  port: 8444

clusterDomain: cluster.local

apiServer:
  ports: [443, 6443]
  # Raw NetworkPolicyPeer list for the apiserver egress rule. Empty allows those ports to any destination,
  # because a managed control plane is often not selectable; scope it with an ipBlock in production.
  peers: []

egress:
  # CIDRs the organisation is reached at, on relay.servicePort. Empty allows 0.0.0.0/0 except RFC 1918,
  # 100.64.0.0/10 and 169.254.0.0/16, so runnerd has no route to pods on a private range.
  orgCIDRs: []
  # Raw NetworkPolicyEgressRule list appended to runnerd's egress.
  extra: []
  # Written into every proxy's hard_deny on top of the in-cluster names and addresses runnerd adds itself,
  # and the apiserver addresses the chart reads from the kubernetes Service at install and upgrade.
  # Recommended: the cluster's pod and service CIDRs.
  hardDenyCIDRs: []

# Sandbox knobs passed to the substrate. WARDYN_K8S_ALLOW_UNENFORCED_NETPOL and
# WARDYN_K8S_ACK_AMBIENT_DEFAULT_DENY have no values here: runnerd boots only on an enforced canary verdict,
# and the chart refuses k8s.allowUnenforcedNetPol and k8s.ackAmbientDefaultDeny.
k8s:
  imagePullSecret: ""
  sandbox:
    # sandbox.arch joins these keys as kubernetes.io/arch; a key of another arch refuses boot.
    nodeSelector: {}
    tolerations: []
    affinity: {}
    priorityClassName: ""
    podAnnotations: {}
    podLabels: {}
  runtimeClasses:
    CC2: ""
    CC3: ""

# false: a platform team applies the ClusterRole, ClusterRoleBinding and both Roles and RoleBindings itself,
# before the image starts (see NOTES).
rbac:
  create: true

persistence:
  # ReadWriteOnce only: the key, offline state, daemon.lock and spools rely on flock, which NFS-class and
  # ReadWriteMany storage do not honour.
  size: 10Gi
  storageClass: ""

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

nameOverride: ""
fullnameOverride: ""
