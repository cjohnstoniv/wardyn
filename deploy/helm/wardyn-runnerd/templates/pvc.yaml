apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "runnerd.fullname" . }}
  labels:
    {{- include "runnerd.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
