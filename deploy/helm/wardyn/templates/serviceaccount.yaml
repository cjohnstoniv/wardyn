{{/*
ServiceAccount for wardynd: a dedicated identity (not "default") that the roles
in rbac.yaml bind to. Token auto-mount follows serviceAccount.automount: the
Kubernetes runner (k8s.enabled) drives the API server with the projected token
and the chart refuses it without automount; with any other runner wardynd calls
no API server, so the token stays unmounted.
*/}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wardyn.serviceAccountName" . }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
  {{- $annotations := .Values.serviceAccount.annotations | default dict }}
  {{- if eq (include "wardyn.azureWorkloadIdentity" .) "true" }}
  {{- $annotations = merge (dict "azure.workload.identity/client-id" .Values.secretStore.azure.clientId) $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end -}}

{{- /*
The proxies' ServiceAccount for the spire identity provider (docs/operations/spire.md). Each run's proxy pod runs as
it in the runs namespace, so the SPIRE agent can attest the proxy by account as well as by labels. It has no token
and no RoleBinding: the account exists to be attested, never to call the API server. Creating pods with it in the
runs namespace is equivalent to issuing a run identity, so grant that only to admins.
*/}}
{{- if (.Values.spire | default dict).enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.spire.proxyServiceAccount }}
  namespace: {{ .Values.k8s.runsNamespace | default .Release.Namespace }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
