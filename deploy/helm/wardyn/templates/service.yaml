{{/*
Service fronting wardynd. Targets the container's HTTP port by name ("http") so
the port number can change in values without breaking the Service. wardynd serves
the API, the embedded web UI, and /healthz all on this single port.

ssh.enabled adds a SECOND port on this SAME Service (no second Service object)
targeting the Deployment's "ssh" named containerPort. An operator who wants SSH
exposed differently from HTTP (e.g. its own LoadBalancer while HTTP stays
ClusterIP) brings their own minimal Service instead — see the chart README's
"Split SSH exposure" recipe.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wardyn.fullname" . }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.ssh.enabled }}
    - name: ssh
      port: {{ .Values.ssh.port }}
      targetPort: ssh
      protocol: TCP
    {{- end }}
  selector:
    {{- include "wardyn.selectorLabels" . | nindent 4 }}
