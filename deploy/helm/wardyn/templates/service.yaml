{{/*
Service fronting wardynd. Targets the container's HTTP port by name ("http") so
the port number can change in values without breaking the Service. wardynd serves
the API, the embedded web UI, and /healthz all on this single port.

ssh.enabled adds a SECOND port on this SAME Service (no second Service object)
targeting the Deployment's "ssh" named containerPort. An operator who wants SSH
exposed differently from HTTP (e.g. its own LoadBalancer while HTTP stays
ClusterIP) brings their own minimal Service instead — see the chart README's
"Split SSH exposure" recipe.

uiSandbox.enabled adds a THIRD port the same way ("ui"). That one MUST be
routed to a different hostname than the console at your ingress/LoadBalancer —
it serves the sandbox's own pages, and the separate browser origin is the
control (README "UI sandbox gateway", docs/UI-SANDBOXES.md).
*/}}
{{- include "wardyn.assertPorts" . -}}
{{- /*
`default dict` on the 0.6-only blocks: `helm upgrade --reuse-values` replaces
this chart's defaults with the PREVIOUS release's values map, so upgrading a
0.5 release hands these templates a map with no uiSandbox/readinessProbe at
all. Unguarded, that upgrade dies at render on a nil pointer instead of rolling
out; guarded, the 0.5 defaults simply carry forward.
*/ -}}
{{- $ssh := .Values.ssh | default dict -}}
{{- $ui := .Values.uiSandbox | default dict -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wardyn.fullname" . }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if $ssh.enabled }}
    - name: ssh
      port: {{ $ssh.port | default 2222 }}
      targetPort: ssh
      protocol: TCP
    {{- end }}
    {{- if $ui.enabled }}
    - name: ui
      port: {{ $ui.port | default 8081 }}
      targetPort: ui
      protocol: TCP
    {{- end }}
  selector:
    {{- include "wardyn.selectorLabels" . | nindent 4 }}
