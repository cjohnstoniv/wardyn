{{/*
Default-deny NetworkPolicy for the wardynd pod, consistent with Wardyn's L0 egress
posture (deny-by-default; only explicitly-allowed flows pass). A bare
podSelector with empty Ingress/Egress rule arrays denies all traffic; we then
re-open only what wardynd needs:

  - DNS (UDP+TCP/53) so it can resolve Postgres and the OIDC issuer
  - egress to Postgres on .Values.networkPolicy.postgres.port
  - egress to the Kubernetes API server (k8s.enabled only) on
    .Values.k8s.apiServer.ports, scoped to .Values.k8s.apiServer.to when set
    (empty by default — see the BOLD warning on that value) — wardynd itself
    drives the k8s runner substrate via client-go
  - ingress to the HTTP port from the configured sources (default: same
    namespace, e.g. an ingress controller / the UI)
  - a SEPARATE ingress rule for SSH (ssh.enabled) and the UI-sandbox gateway
    (uiSandbox.enabled), whose peer list EXCLUDES the pods the k8s runner
    substrate creates: those two are operator/human surfaces, and a run's
    agent pod or proxy sidecar has no business on either. They cannot ride
    the HTTP rule above, because NetworkPolicy ingress rules are ADDITIVE —
    withholding a port from run pods means NO rule may grant it to them.
  - a SEPARATE ingress rule, HTTP ONLY, when k8s.enabled and
    k8s.runsNamespace differs from this release's namespace: that namespace's
    proxy sidecars call back to wardynd for credential mints, approval
    checks, and recording uploads — never SSH, which is an operator/human
    surface, not something a run's sidecar has any business reaching
*/}}
{{- /*
`default dict` on the 0.6-only blocks: `helm upgrade --reuse-values` replaces
this chart's defaults with the PREVIOUS release's values map, so upgrading a
0.5 release hands these templates a map with no uiSandbox/readinessProbe at
all. Unguarded, that upgrade dies at render on a nil pointer instead of rolling
out; guarded, the 0.5 defaults simply carry forward.
*/ -}}
{{- $ssh := .Values.ssh | default dict -}}
{{- $ui := .Values.uiSandbox | default dict -}}
{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wardyn.fullname" . }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
spec:
  {{/*
  Narrow past the bare name+instance selector below: NetworkPolicy allows
  are ADDITIVE, and sandbox pods the k8s runner substrate creates
  (internal/runner/k8s/naming.go's wardynLabels) can carry caller-supplied
  "extra" labels that happen to match this release's
  app.kubernetes.io/name+instance without ever setting
  app.kubernetes.io/component — such a pod would otherwise silently inherit
  wardynd's own egress (DNS, Postgres, the k8s API server), not just the
  per-run allow rules it's actually supposed to get. The Deployment's own
  spec.selector is immutable and stays name+instance only
  (wardyn.selectorLabels, untouched) — this is a NetworkPolicy-only
  narrowing to the control-plane pod.
  */ -}}
  podSelector:
    matchLabels:
      {{- include "wardyn.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingress.from }}
        {{- toYaml .Values.networkPolicy.ingress.from | nindent 8 }}
        {{- else }}
        # Default: every pod in THIS namespace. A bare podSelector is what means
        # "the policy's own namespace" — an empty namespaceSelector would mean
        # ALL namespaces. Narrow to your ingress controller in production.
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: http
    {{- if or $ssh.enabled $ui.enabled }}
    # SSH and the UI-sandbox gateway, on their OWN rule with their OWN peers.
    #
    # The rule above cannot carry them. Its default peer is `podSelector: {}` —
    # every pod in THIS namespace — and k8s.runsNamespace defaults to EMPTY,
    # i.e. runs land in this same namespace. So the http rule's peer already
    # includes every agent pod and every proxy sidecar the k8s substrate
    # creates, and ingress rules are additive: a port listed there is granted to
    # them, full stop. The runsNamespace-differs rule below already withholds
    # ssh/ui correctly for a SEPARATE namespace; this is that same invariant for
    # the default, same-namespace case, which is the case almost every install
    # is actually in.
    #
    # `wardyn.managed` is stamped on every object the k8s runner substrate
    # creates (internal/runner/k8s/naming.go's wardynLabels) and is stamped
    # LAST, after any caller-supplied "extra" labels, so a run cannot un-select
    # itself from this exclusion.
    - from:
        {{- if .Values.networkPolicy.ingress.from }}
        {{- range .Values.networkPolicy.ingress.from }}
        {{- if and (hasKey . "podSelector") (empty .podSelector) (not .namespaceSelector) }}
        # Your catch-all same-namespace peer, MINUS run pods. Rewritten only for
        # this exact shape (a bare `podSelector: {}` and nothing else) — the
        # documented "keep the default peer and add mine" idiom, which is what
        # deploy/kind/quickstart.sh and this chart's README both write. Any
        # other peer you supply is passed through untouched: an ipBlock or a
        # namespaceSelector is yours to scope, and the chart will not silently
        # narrow a selector you wrote deliberately.
        - podSelector:
            matchExpressions:
              - key: wardyn.managed
                operator: DoesNotExist
        {{- else }}
        {{- toYaml (list .) | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- else }}
        - podSelector:
            matchExpressions:
              - key: wardyn.managed
                operator: DoesNotExist
        {{- end }}
      ports:
        {{- if $ssh.enabled }}
        - protocol: TCP
          port: ssh
        {{- end }}
        {{- if $ui.enabled }}
        - protocol: TCP
          port: ui
        {{- end }}
    {{- end }}
    {{- if and .Values.k8s.enabled .Values.k8s.runsNamespace (ne .Values.k8s.runsNamespace .Release.Namespace) }}
    # A different runs namespace carries no chart labels (the chart never
    # creates/labels it — see values.yaml's k8s.runsNamespace doc) — match
    # the built-in, Kubernetes-applied kubernetes.io/metadata.name label
    # instead of inventing a custom one a bare operator namespace would
    # never carry. A custom-label selector here would silently match NOTHING
    # and strand every run's proxy sidecar with no route back to wardynd
    # (credential mints, approval checks, recording uploads all go dark,
    # with no render-time or even boot-time signal). A SEPARATE rule (not
    # folded into the one above): this peer gets http only, never ssh and
    # never the UI-sandbox gateway — a run's proxy sidecar has no business on
    # either operator/human port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.k8s.runsNamespace }}
      ports:
        - protocol: TCP
          port: http
    {{- end }}
  egress:
    # DNS resolution (kube-dns / CoreDNS). The ONLY rule in this chart that may
    # be cluster-wide: an empty namespaceSelector means all namespaces, which is
    # required because CoreDNS lives in kube-system. helm-lint pins the count.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres. By default allow to any destination on the DB port (managed
    # Postgres is commonly out-of-cluster); restrict with networkPolicy.egress.extra.
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgres.port }}
    {{- if .Values.k8s.enabled }}
    # Kubernetes API server (client-go, internal/runner/k8s). See
    # values.yaml's k8s.apiServer.ports/.to doc for why the ports default
    # includes 6443 and why `to` is empty (any-destination) by default.
    {{- range .Values.k8s.apiServer.ports }}
    - ports:
        - protocol: TCP
          port: {{ . }}
      {{- with $.Values.k8s.apiServer.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.extra }}
    # Operator-supplied additional egress rules (OIDC issuer, SIEM sinks, etc.).
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end -}}
