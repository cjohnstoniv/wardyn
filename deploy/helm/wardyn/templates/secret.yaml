{{/*
DSN / age-key / admin-token Secrets, plus the chart's render-time refusals.

Finding wiring: the Deployment sources WARDYN_PG_DSN (and optionally WARDYN_AGE_KEY
and WARDYN_ADMIN_TOKEN) from a Secret. Two modes:

  1. External secret (recommended / production): set postgres.dsn.secretRef.name
     to a Secret you created out-of-band (see README "Database (DSN)"). The
     chart then references it and renders NO Secret of its own, so credentials
     never live in rendered manifests or Helm release history.

  2. Inline (demo): leave postgres.dsn.secretRef.name empty and supply
     postgres.dsn.value (and optionally secrets.ageKey). The chart creates
     "<fullname>-secrets". This is demo-grade — the DSN is base64 in the
     release; do not use for anything beyond a laptop.

The age key is the secret-store identity. Left empty, wardynd generates an
ephemeral key at boot (secrets do not survive a restart). For persistence,
supply secrets.ageKey from `age-keygen`. wardynd fails closed on the old
publicly-known demo key, so we never default one here. With an external DSN
(persistent Postgres) that ephemeral default is a trap, not a convenience:
boot 1 encrypts under key A, boot 2 generates an unrelated key B and can never
decrypt what boot 1 wrote, so the pod crash-loops on its SECOND start and the
rows written under A are unrecoverable. The third fail below refuses that
combination outright (W27-S1-5) rather than leaving it to documentation — an
install that is guaranteed to crash-loop is exactly what a render-time refusal
is for. secrets.allowEphemeralAgeKey=true renders it anyway, the same
"acknowledge the ceiling" escape hatch allowMultiReplica is for replicas > 1.

Order matters among these fails: the auth refusal stays FIRST so a render with
no credentials at all still names the credential problem, not the age key.

The admin token picks its mode independently of the DSN (own Secret, own guard):
sharing the DSN's external Secret would emit a secretKeyRef for a key that is
not in it. It has no working default, hence the second fail below — a rendered
install with no auth is a control plane whose every route 401s.
*/}}
{{/* Two age-identity sources named at once is refused outright, not ranked:
booting under whichever one template precedence happens to pick — while the
operator believes the OTHER is in effect — is the unrecoverable failure this
refusal exists to prevent (see the ephemeral-key refusal below for the same
"wrong identity is worse than no identity" reasoning).

$ageSources is the SINGLE definition of "an age identity is named here", and
both this refusal and the ephemeral-key refusal below read it. They used to
count differently — this one knew three sources, the wired-check knew four
(it already counted env/extraEnv WARDYN_AGE_KEY) — so `secrets.ageKeySecretRef`
BESIDE an `env.WARDYN_AGE_KEY` rendered clean, emitted both, and the plaintext
literal won on k8s's last-defined-wins. That is precisely the silent ranking
this refusal exists to forbid, arriving through the one door it did not check.

Append order is load-bearing: secrets.ageKeySecretRef.name goes first, so the
message opens with it whenever it is one of the pair. */}}
{{- $ageRef := .Values.secrets.ageKeySecretRef | default dict -}}
{{- $ageSources := list -}}
{{- if $ageRef.name -}}{{- $ageSources = append $ageSources "secrets.ageKeySecretRef.name" -}}{{- end -}}
{{- if .Values.secrets.ageKeyFromSecret -}}{{- $ageSources = append $ageSources "secrets.ageKeyFromSecret" -}}{{- end -}}
{{- if .Values.secrets.ageKey -}}{{- $ageSources = append $ageSources "secrets.ageKey" -}}{{- end -}}
{{- if include "wardyn.envValue" (dict "ctx" . "name" "WARDYN_AGE_KEY") -}}{{- $ageSources = append $ageSources "a WARDYN_AGE_KEY in env/extraEnv" -}}{{- end -}}
{{- if gt (len $ageSources) 1 -}}
{{- fail (printf "wardyn: %s is set together with %s — pick exactly one age-identity source. Two are refused outright rather than ranked: whichever one template precedence happens to pick becomes the identity the pod boots under while you believe the other is in effect, and a secret store written under one age identity can never be decrypted with the other. An env or extraEnv WARDYN_AGE_KEY counts as a source: it renders AFTER the chart's own secretKeyRef and wins (k8s env: last-defined-wins)." (first $ageSources) (join ", " (rest $ageSources))) -}}
{{- end -}}
{{- if and .Values.postgres.dsn.secretRef.name .Values.secrets.ageKey -}}
{{- fail "wardyn: secrets.ageKey applies to inline mode only; with an external postgres.dsn.secretRef, put the identity in that Secret under `age-key` and set secrets.ageKeyFromSecret=true" -}}
{{- end -}}
{{/* LOCAL MODE IS NOT A CLUSTER POSTURE. The chart carries no WARDYN_LOCAL_MODE
key, but .Values.env renders verbatim into the Deployment, so `--set
env.WARDYN_LOCAL_MODE=true` would otherwise boot a cluster with the public API's
authentication bypassed and every request attributed to one fixed "local
operator" — plus, before the posture rule, one operator's Anthropic subscription
injected into every user's run. wardynd itself only refuses a SPECIFIC
globally-routable bind, and a pod's unspecified :8080 merely warns, so the
refusal has to live here where the intent is visible.

.Values.extraEnv is checked too, and not as belt-and-braces: it is the
DOCUMENTED path for secret-bearing variables (values.yaml "Raw EnvVar
entries"), it lands in the same container env, and reading only .Values.env
left the whole refusal one documented keystroke away from being bypassed —
`extraEnv: [{name: WARDYN_LOCAL_MODE, value: "true"}]` rendered clean. The
sibling age-key check below already ranged over both lists. */}}
{{- $localKeys := list "WARDYN_LOCAL_MODE" "WARDYN_ALLOW_LOCAL_MODE_WITH_OIDC" "WARDYN_ALLOW_SHARED_SUBSCRIPTION" -}}
{{- $localSet := false -}}
{{- range $localKeys -}}
{{- if hasKey ($.Values.env | default dict) . -}}{{- $localSet = true -}}{{- end -}}
{{- end -}}
{{- range .Values.extraEnv | default list -}}
{{- if has (.name | default "") $localKeys -}}{{- $localSet = true -}}{{- end -}}
{{- end -}}
{{- if $localSet -}}
{{- fail "wardyn: WARDYN_LOCAL_MODE / WARDYN_ALLOW_LOCAL_MODE_WITH_OIDC / WARDYN_ALLOW_SHARED_SUBSCRIPTION are single-user desktop settings and must not be set on Kubernetes (in env or extraEnv). Local mode bypasses public-API authentication entirely, and a shared subscription credential would serve one person's Claude subscription to every user's run — which the harness vendor's terms prohibit. Give each user their own API key (wardyn secret set anthropic-api-key) or use Bedrock." -}}
{{- end -}}
{{- if not (include "wardyn.authConfigured" .) -}}
{{- fail "wardyn: the public API would 401 every request. Set auth.adminToken.secretRef.name (external Secret — recommended), auth.adminToken.value (inline demo; the token then lives in the Helm release history), or env.WARDYN_OIDC_ISSUER for SSO — and if you pick OIDC, also set env.WARDYN_OIDC_OPERATOR_EMAILS, or the pod will render fine and then crash-loop at boot (env.WARDYN_ALLOW_OIDC_NO_OPERATOR_LIST=true overrides). A raw env.WARDYN_ADMIN_TOKEN also satisfies this and is deliberately still accepted, but it is no longer recommended here: .Values.env renders VERBATIM into the Deployment, so the admin bearer for the entire API becomes a plaintext literal in the pod spec, readable by anyone who can `get deploy`. Inject it yourself with an extraEnv entry carrying a secretKeyRef instead." -}}
{{- end -}}
{{/* A Secret-wired admin token BESIDE a literal one is the same silent ranking
the age-source refusal above forbids, on the credential that gates the whole
public API: deployment.yaml emits the secretKeyRef first and .Values.env /
.Values.extraEnv render after it, so k8s's last-defined-wins hands the pod the
literal while the operator believes the Secret is in effect — and rotating that
Secret then changes nothing. Refused, not ranked. (Either one ALONE still
renders: this is about naming two.) */}}
{{- $envToken := include "wardyn.envValue" (dict "ctx" . "name" "WARDYN_ADMIN_TOKEN") -}}
{{- if and $envToken (or .Values.auth.adminToken.secretRef.name .Values.auth.adminToken.value) -}}
{{- fail "wardyn: WARDYN_ADMIN_TOKEN is set in env/extraEnv AND through auth.adminToken (secretRef.name or value) — pick exactly one admin-token source. The env/extraEnv entry renders after the chart's own secretKeyRef and silently wins (k8s env: last-defined-wins), so the API would authenticate with that value while you believe the Secret is in effect, and rotating the Secret would change nothing. Prefer auth.adminToken.secretRef.name, which keeps the bearer out of the pod spec entirely." -}}
{{- end -}}
{{/* SSO WITH NO OPERATOR ALLOWLIST IS A BOOT REFUSAL, so it has to be a RENDER
refusal too. cmd/wardynd/boot_posture.go validateOperatorPosture refuses to
start when an OIDC issuer is configured and there is neither an operator
allowlist nor a role map nor the explicit override — and the message above
already told operators so. But nothing enforced it: `env.WARDYN_OIDC_ISSUER`
alone rendered exit 0, applied cleanly, and then crash-looped, which is the
exact shape the k8s.proxyImage refusal in deployment.yaml exists to prevent
("a boot-time failure, not a per-run one"). The chart's own
ci/all-on-values.yaml was that unbootable shape.

A valueFrom-sourced allowlist counts as set: the chart cannot read a Secret,
and "cannot see it" must not read as "not set". */}}
{{- $issuer := include "wardyn.envValue" (dict "ctx" . "name" "WARDYN_OIDC_ISSUER") -}}
{{- if $issuer -}}
{{- $emails := include "wardyn.envValue" (dict "ctx" . "name" "WARDYN_OIDC_OPERATOR_EMAILS") -}}
{{- $roleMap := include "wardyn.envValue" (dict "ctx" . "name" "WARDYN_OIDC_ROLE_MAP") -}}
{{- if not (or $emails $roleMap (include "wardyn.allowNoOperatorList" .)) -}}
{{- fail "wardyn: OIDC SSO is configured (WARDYN_OIDC_ISSUER) but the operator allowlist is empty — EVERY human the IdP signs in would be admin-equivalent (rewrite policies/workspaces/site-config, connect the shared harness credential, write and delete secrets, decide approvals, and open an interactive shell in any running sandbox). wardynd REFUSES TO BOOT on this (cmd/wardynd/boot_posture.go validateOperatorPosture), so the render would apply cleanly and the pod would crash-loop. Set env.WARDYN_OIDC_OPERATOR_EMAILS to the humans who may do that — everyone else becomes a member who reads their OWN runs and can launch runs — or set env.WARDYN_OIDC_ROLE_MAP for claim-based roles instead, or explicitly set env.WARDYN_ALLOW_OIDC_NO_OPERATOR_LIST=true to override. extraEnv counts for all four." -}}
{{- end -}}
{{- end -}}
{{/* An age identity counts as wired however the operator supplied it: the
ageKeyFromSecret path, secrets.ageKeySecretRef, an inline secrets.ageKey, a
literal .Values.env entry, or the documented secret-bearing .Values.extraEnv
path. That is exactly $ageSources above — read it rather than re-deriving the
same list a second, subtly different way, which is how the refusal above came to
miss the env/extraEnv door this check already knew about. Note it is read
through wardyn.envValue, so an EMPTY WARDYN_AGE_KEY no longer counts as wired:
wardynd would generate an ephemeral identity, which is the case below. */}}
{{- $ageWired := gt (len $ageSources) 0 -}}
{{- if and .Values.postgres.dsn.secretRef.name (not $ageWired) (not .Values.secrets.allowEphemeralAgeKey) -}}
{{- fail (printf "wardyn: postgres.dsn.secretRef.name=%q is a PERSISTENT Postgres, but no age identity is wired, so wardynd generates an ephemeral one at every boot. Boot 1 encrypts its own signing key into that database under identity A; boot 2 generates identity B, cannot decrypt it, and fails closed — the pod crash-loops on its SECOND start (a helm upgrade, node drain, eviction or OOM is enough), and the rows written under A cannot be recovered by setting the key afterwards. Fix: add an `age-key` entry to that Secret (`wardynd -gen-age-key`) and set secrets.ageKeyFromSecret=true. Throwaway install where losing every stored secret on restart is fine: secrets.allowEphemeralAgeKey=true renders anyway." .Values.postgres.dsn.secretRef.name) -}}
{{- end -}}
{{- if not .Values.postgres.dsn.secretRef.name -}}
{{- if not .Values.postgres.dsn.value -}}
{{- fail "wardyn: set either postgres.dsn.secretRef.name (external Secret) or postgres.dsn.value (inline demo DSN)" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wardyn.secretName" . }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.dsn.key }}: {{ .Values.postgres.dsn.value | quote }}
  {{- with .Values.secrets.ageKey }}
  age-key: {{ . | quote }}
  {{- end }}
{{- end -}}
{{- if and (not .Values.auth.adminToken.secretRef.name) .Values.auth.adminToken.value }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wardyn.authSecretName" . }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.adminToken.key }}: {{ .Values.auth.adminToken.value | quote }}
{{- end -}}
