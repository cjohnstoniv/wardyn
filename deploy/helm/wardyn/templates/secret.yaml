{{/*
DSN / age-key / admin-token Secrets, plus the chart's render-time refusals.

Finding wiring: the Deployment sources WARDYN_PG_DSN (and optionally WARDYN_AGE_KEY
and WARDYN_ADMIN_TOKEN) from a Secret. Two modes:

  1. External secret (recommended / production): set postgres.dsn.secretRef.name
     to a Secret you created out-of-band (see README "Database (DSN)"). The
     chart then references it and renders NO Secret of its own, so credentials
     never live in rendered manifests or Helm release history.

  2. Inline (demo): leave postgres.dsn.secretRef.name empty and supply
     postgres.dsn.value (and optionally secrets.ageKey). The chart creates
     "<fullname>-secrets". This is demo-grade — the DSN is base64 in the
     release; do not use for anything beyond a laptop.

The age key is the secret-store identity. Left empty, wardynd generates an
ephemeral key at boot (secrets do not survive a restart). For persistence,
supply secrets.ageKey from `age-keygen`. wardynd fails closed on the old
publicly-known demo key, so we never default one here.

The admin token picks its mode independently of the DSN (own Secret, own guard):
sharing the DSN's external Secret would emit a secretKeyRef for a key that is
not in it. It has no working default, hence the second fail below — a rendered
install with no auth is a control plane whose every route 401s.
*/}}
{{- if and .Values.postgres.dsn.secretRef.name .Values.secrets.ageKey -}}
{{- fail "wardyn: secrets.ageKey applies to inline mode only; with an external postgres.dsn.secretRef, put the identity in that Secret under `age-key` and set secrets.ageKeyFromSecret=true" -}}
{{- end -}}
{{- if not (include "wardyn.authConfigured" .) -}}
{{- fail "wardyn: the public API would 401 every request. Set auth.adminToken.secretRef.name (external Secret), auth.adminToken.value (inline demo), env.WARDYN_ADMIN_TOKEN, or env.WARDYN_OIDC_ISSUER for SSO" -}}
{{- end -}}
{{- if not .Values.postgres.dsn.secretRef.name -}}
{{- if not .Values.postgres.dsn.value -}}
{{- fail "wardyn: set either postgres.dsn.secretRef.name (external Secret) or postgres.dsn.value (inline demo DSN)" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wardyn.secretName" . }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.dsn.key }}: {{ .Values.postgres.dsn.value | quote }}
  {{- with .Values.secrets.ageKey }}
  age-key: {{ . | quote }}
  {{- end }}
{{- end -}}
{{- if and (not .Values.auth.adminToken.secretRef.name) .Values.auth.adminToken.value }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wardyn.authSecretName" . }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.adminToken.key }}: {{ .Values.auth.adminToken.value | quote }}
{{- end -}}
