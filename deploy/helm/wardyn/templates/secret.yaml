{{/*
DSN / age-key / admin-token Secrets, plus the chart's render-time refusals.

Finding wiring: the Deployment sources WARDYN_PG_DSN (and optionally WARDYN_AGE_KEY
and WARDYN_ADMIN_TOKEN) from a Secret. Two modes:

  1. External secret (recommended / production): set postgres.dsn.secretRef.name
     to a Secret you created out-of-band (see README "Database (DSN)"). The
     chart then references it and renders NO Secret of its own, so credentials
     never live in rendered manifests or Helm release history.

  2. Inline (demo): leave postgres.dsn.secretRef.name empty and supply
     postgres.dsn.value (and optionally secrets.ageKey). The chart creates
     "<fullname>-secrets". This is demo-grade — the DSN is base64 in the
     release; do not use for anything beyond a laptop.

The age key is the secret-store identity. Left empty, wardynd generates an
ephemeral key at boot (secrets do not survive a restart). For persistence,
supply secrets.ageKey from `age-keygen`. wardynd fails closed on the old
publicly-known demo key, so we never default one here. With an external DSN
(persistent Postgres) that ephemeral default is a trap, not a convenience:
boot 1 encrypts under key A, boot 2 generates an unrelated key B and can never
decrypt what boot 1 wrote, so the pod crash-loops on its SECOND start and the
rows written under A are unrecoverable. The third fail below refuses that
combination outright (W27-S1-5) rather than leaving it to documentation — an
install that is guaranteed to crash-loop is exactly what a render-time refusal
is for. secrets.allowEphemeralAgeKey=true renders it anyway, the same
"acknowledge the ceiling" escape hatch allowMultiReplica is for replicas > 1.

Order matters among these fails: the auth refusal stays FIRST so a render with
no credentials at all still names the credential problem, not the age key.

The admin token picks its mode independently of the DSN (own Secret, own guard):
sharing the DSN's external Secret would emit a secretKeyRef for a key that is
not in it. It has no working default, hence the second fail below — a rendered
install with no auth is a control plane whose every route 401s.
*/}}
{{- if and .Values.postgres.dsn.secretRef.name .Values.secrets.ageKey -}}
{{- fail "wardyn: secrets.ageKey applies to inline mode only; with an external postgres.dsn.secretRef, put the identity in that Secret under `age-key` and set secrets.ageKeyFromSecret=true" -}}
{{- end -}}
{{- if not (include "wardyn.authConfigured" .) -}}
{{- fail "wardyn: the public API would 401 every request. Set auth.adminToken.secretRef.name (external Secret), auth.adminToken.value (inline demo), env.WARDYN_ADMIN_TOKEN, or env.WARDYN_OIDC_ISSUER for SSO — and if you pick OIDC, also set env.WARDYN_OIDC_OPERATOR_EMAILS, or the pod will render fine and then crash-loop at boot (env.WARDYN_ALLOW_OIDC_NO_OPERATOR_LIST=true overrides)" -}}
{{- end -}}
{{/* An age identity counts as wired however the operator supplied it: the
ageKeyFromSecret path, a literal .Values.env entry, or the documented
secret-bearing .Values.extraEnv path. Missing any of those checks would refuse
a render that is actually fine. */}}
{{- $ageWired := or .Values.secrets.ageKeyFromSecret (hasKey .Values.env "WARDYN_AGE_KEY") -}}
{{- range .Values.extraEnv -}}
{{- if eq (default "" .name) "WARDYN_AGE_KEY" -}}{{- $ageWired = true -}}{{- end -}}
{{- end -}}
{{- if and .Values.postgres.dsn.secretRef.name (not $ageWired) (not .Values.secrets.allowEphemeralAgeKey) -}}
{{- fail (printf "wardyn: postgres.dsn.secretRef.name=%q is a PERSISTENT Postgres, but no age identity is wired, so wardynd generates an ephemeral one at every boot. Boot 1 encrypts its own signing key into that database under identity A; boot 2 generates identity B, cannot decrypt it, and fails closed — the pod crash-loops on its SECOND start (a helm upgrade, node drain, eviction or OOM is enough), and the rows written under A cannot be recovered by setting the key afterwards. Fix: add an `age-key` entry to that Secret (`wardynd -gen-age-key`) and set secrets.ageKeyFromSecret=true. Throwaway install where losing every stored secret on restart is fine: secrets.allowEphemeralAgeKey=true renders anyway." .Values.postgres.dsn.secretRef.name) -}}
{{- end -}}
{{- if not .Values.postgres.dsn.secretRef.name -}}
{{- if not .Values.postgres.dsn.value -}}
{{- fail "wardyn: set either postgres.dsn.secretRef.name (external Secret) or postgres.dsn.value (inline demo DSN)" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wardyn.secretName" . }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.dsn.key }}: {{ .Values.postgres.dsn.value | quote }}
  {{- with .Values.secrets.ageKey }}
  age-key: {{ . | quote }}
  {{- end }}
{{- end -}}
{{- if and (not .Values.auth.adminToken.secretRef.name) .Values.auth.adminToken.value }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wardyn.authSecretName" . }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.adminToken.key }}: {{ .Values.auth.adminToken.value | quote }}
{{- end -}}
