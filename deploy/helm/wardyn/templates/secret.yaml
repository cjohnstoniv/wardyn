{{/*
DSN / age-key / admin-token Secrets, plus the chart's render-time refusals.

Finding wiring: the Deployment sources WARDYN_PG_DSN (and optionally WARDYN_AGE_KEY
and WARDYN_ADMIN_TOKEN) from a Secret. Two modes:

  1. External secret (recommended / production): set postgres.dsn.secretRef.name
     to a Secret you created out-of-band (see README "Database (DSN)"). The
     chart then references it and renders NO Secret of its own, so credentials
     never live in rendered manifests or Helm release history.

  2. Inline (demo): leave postgres.dsn.secretRef.name empty and supply
     postgres.dsn.value (and optionally secrets.ageKey). The chart creates
     "<fullname>-secrets". This is demo-grade — the DSN is base64 in the
     release; do not use for anything beyond a laptop.

  3. Your own file (Vault Agent / CSI): leave both empty and set
     env.WARDYN_PG_DSN_FILE to a path your own volume delivers. The chart
     renders no DSN env and no DSN Secret.

secretFiles.enabled changes only HOW modes 1 and 2 reach the pod (a projected
volume plus WARDYN_*_FILE paths instead of secretKeyRef env — deployment.yaml).

The age key is the secret-store identity. Left empty, wardynd generates an
ephemeral key at boot (secrets do not survive a restart). For persistence,
supply secrets.ageKey from `age-keygen`. wardynd fails closed on the old
publicly-known demo key, so we never default one here. With an external DSN
(persistent Postgres) that ephemeral default is a trap, not a convenience:
boot 1 encrypts under key A, boot 2 generates an unrelated key B and can never
decrypt what boot 1 wrote, so the pod crash-loops on its SECOND start and the
rows written under A are unrecoverable. The third fail below refuses that
combination outright (W27-S1-5) rather than leaving it to documentation — an
install that is guaranteed to crash-loop is exactly what a render-time refusal
is for. secrets.allowEphemeralAgeKey=true renders it anyway, the same
"acknowledge the ceiling" escape hatch allowMultiReplica is for replicas > 1.

Order matters among these fails: the auth refusal stays FIRST so a render with
no credentials at all still names the credential problem, not the age key.

The admin token picks its mode independently of the DSN (own Secret, own guard):
sharing the DSN's external Secret would emit a secretKeyRef for a key that is
not in it. It has no working default, hence the second fail below — a rendered
install with no auth is a control plane whose every route 401s.
*/}}
{{/* Two age-identity sources named at once is refused outright, not ranked:
booting under whichever one template precedence happens to pick — while the
operator believes the OTHER is in effect — is the unrecoverable failure this
refusal exists to prevent (see the ephemeral-key refusal below for the same
"wrong identity is worse than no identity" reasoning).

$ageSources is the SINGLE definition of "an age identity is named here", and
both this refusal and the ephemeral-key refusal below read it. They used to
count differently — this one knew three sources, the wired-check knew four
(it already counted env/extraEnv WARDYN_AGE_KEY) — so `secrets.ageKeySecretRef`
BESIDE an `env.WARDYN_AGE_KEY` rendered clean, emitted both, and the plaintext
literal won on k8s's last-defined-wins. That is precisely the silent ranking
this refusal exists to forbid, arriving through the one door it did not check.

Append order is load-bearing: secrets.ageKeySecretRef.name goes first, so the
message opens with it whenever it is one of the pair. */}}
{{/* Every secret setting with a _FILE twin, read once so wardyn.envValue's
both-forms refusal fires even for the ones no other check asks about. */}}
{{- range list "WARDYN_PG_DSN" "WARDYN_PG_MIGRATE_DSN" "WARDYN_ADMIN_TOKEN" "WARDYN_AGE_KEY" "WARDYN_OIDC_CLIENT_SECRET" "WARDYN_DIRECTORY_CLIENT_SECRET" "WARDYN_AUDIT_SINKS" "WARDYN_ORG_ENROLMENT_TOKEN" -}}
{{- $_ := include "wardyn.envValue" (dict "ctx" $ "name" .) -}}
{{- end -}}
{{- $ageRef := .Values.secrets.ageKeySecretRef | default dict -}}
{{- $ageSources := list -}}
{{- if $ageRef.name -}}{{- $ageSources = append $ageSources "secrets.ageKeySecretRef.name" -}}{{- end -}}
{{- if .Values.secrets.ageKeyFromSecret -}}{{- $ageSources = append $ageSources "secrets.ageKeyFromSecret" -}}{{- end -}}
{{- if .Values.secrets.ageKey -}}{{- $ageSources = append $ageSources "secrets.ageKey" -}}{{- end -}}
{{- if include "wardyn.envValue" (dict "ctx" . "name" "WARDYN_AGE_KEY") -}}{{- $ageSources = append $ageSources "a WARDYN_AGE_KEY or WARDYN_AGE_KEY_FILE in env/extraEnv" -}}{{- end -}}
{{- if gt (len $ageSources) 1 -}}
{{- fail (printf "wardyn: %s is set together with %s — pick exactly one age-identity source. Two are refused outright rather than ranked: whichever one template precedence happens to pick becomes the identity the pod boots under while you believe the other is in effect, and a secret store written under one age identity can never be decrypted with the other. An env or extraEnv WARDYN_AGE_KEY counts as a source: it renders AFTER the chart's own secretKeyRef and wins (k8s env: last-defined-wins); a WARDYN_AGE_KEY_FILE there counts too, and wardynd refuses to boot with both forms set." (first $ageSources) (join ", " (rest $ageSources))) -}}
{{- end -}}
{{/* A DSN delivered as a file the chart does not own (env/extraEnv
WARDYN_PG_DSN_FILE: a Vault Agent or CSI path, or your own Secret volume) is a
THIRD DSN source beside secretRef.name and value. Naming it together with
either is refused rather than ranked — wardynd refuses both forms at boot, or,
in secretFiles mode, the later WARDYN_PG_DSN_FILE silently wins. With it, the
chart renders no DSN env and no DSN Secret, so the two age-key paths that ride
the chart's DSN Secret have nothing to ride. */}}
{{- $dsnFile := include "wardyn.envValue" (dict "ctx" . "name" "WARDYN_PG_DSN_FILE") -}}
{{- if and $dsnFile (or .Values.postgres.dsn.secretRef.name .Values.postgres.dsn.value) -}}
{{- fail "wardyn: WARDYN_PG_DSN_FILE is set in env/extraEnv AND postgres.dsn names a DSN (secretRef.name or value) — pick exactly one DSN source. To read the DSN from your own file (Vault Agent, CSI), set postgres.dsn.secretRef.name to an empty string and leave postgres.dsn.value empty; note secretRef.name has a non-empty default." -}}
{{- end -}}
{{- if and $dsnFile .Values.secrets.ageKeyFromSecret -}}
{{- fail "wardyn: secrets.ageKeyFromSecret reads `age-key` from the DSN's Secret, and with WARDYN_PG_DSN_FILE there is no DSN Secret — deliver the identity as WARDYN_AGE_KEY_FILE beside the DSN file, or name its Secret with secrets.ageKeySecretRef" -}}
{{- end -}}
{{- if and (or .Values.postgres.dsn.secretRef.name $dsnFile) .Values.secrets.ageKey -}}
{{- fail "wardyn: secrets.ageKey applies to inline mode only (postgres.dsn.value); with an external postgres.dsn.secretRef, put the identity in that Secret under `age-key` and set secrets.ageKeyFromSecret=true, and with WARDYN_PG_DSN_FILE deliver it as WARDYN_AGE_KEY_FILE" -}}
{{- end -}}
{{/* LOCAL MODE IS NOT A CLUSTER POSTURE. The chart carries no WARDYN_LOCAL_MODE
key, but .Values.env renders verbatim into the Deployment, so `--set
env.WARDYN_LOCAL_MODE=true` would otherwise boot a cluster with the public API's
authentication bypassed and every request attributed to one fixed "local
operator" — plus, before the posture rule, one operator's Anthropic subscription
injected into every user's run. wardynd itself only refuses a SPECIFIC
globally-routable bind, and a pod's unspecified :8080 merely warns, so the
refusal has to live here where the intent is visible.

.Values.extraEnv is checked too, and not as belt-and-braces: it is the
DOCUMENTED path for secret-bearing variables (values.yaml "Raw EnvVar
entries"), it lands in the same container env, and reading only .Values.env
left the whole refusal one documented keystroke away from being bypassed —
`extraEnv: [{name: WARDYN_LOCAL_MODE, value: "true"}]` rendered clean. The
sibling age-key check below already ranged over both lists. */}}
{{- $localKeys := list "WARDYN_LOCAL_MODE" "WARDYN_ALLOW_LOCAL_MODE_WITH_OIDC" "WARDYN_ALLOW_SHARED_SUBSCRIPTION" -}}
{{- $localSet := false -}}
{{- range $localKeys -}}
{{- if hasKey ($.Values.env | default dict) . -}}{{- $localSet = true -}}{{- end -}}
{{- end -}}
{{- range .Values.extraEnv | default list -}}
{{- if has (.name | default "") $localKeys -}}{{- $localSet = true -}}{{- end -}}
{{- end -}}
{{- if $localSet -}}
{{- fail "wardyn: WARDYN_LOCAL_MODE / WARDYN_ALLOW_LOCAL_MODE_WITH_OIDC / WARDYN_ALLOW_SHARED_SUBSCRIPTION are single-user desktop settings and must not be set on Kubernetes (in env or extraEnv). Local mode bypasses public-API authentication entirely, and a shared subscription credential would serve one person's Claude subscription to every user's run — which the harness vendor's terms prohibit. Give each user their own API key (wardyn secret set anthropic-api-key) or use Bedrock." -}}
{{- end -}}
{{/* WARDYN_SSO_ONLY IS A BOOT REFUSAL TOO (cmd/wardynd/boot_posture.go
validateSSOOnlyPosture): auth.ssoOnly asserts SSO is the ONLY way into the
console, and wardynd refuses to start unless that is actually true — OIDC
configured, and the admin token / local mode / member mode / no-operator-list
override all absent. Mirrored here, beside the local-mode refusal above, for
the same reason every other refusal in this file exists: a bad values.yaml
must not apply cleanly and then crash-loop.

WARDYN_LOCAL_MODE has no check of its own below: the blanket local-mode
refusal above already fires unconditionally on Kubernetes, ssoOnly or not, so
a second, sso-only-flavored message here could never be reached — it would
be dead code asserting a posture the render already refuses for an unrelated,
more fundamental reason. The other four checks validateSSOOnlyPosture makes
are NOT otherwise enforced at render time, so they stay here.

A WARDYN_SSO_ONLY=true set directly in env/extraEnv declares the same posture
to the daemon as auth.ssoOnly does, so it gets the same refusals: otherwise the
combination renders clean and the pod crash-loops on the boot refusal. The
message names whichever of the two declared it. */}}
{{- $ssoOnlyBy := "" -}}
{{- if .Values.auth.ssoOnly -}}{{- $ssoOnlyBy = "auth.ssoOnly" -}}
{{- else if eq (include "wardyn.envValue" (dict "ctx" . "name" "WARDYN_SSO_ONLY") | lower) "true" -}}{{- $ssoOnlyBy = "WARDYN_SSO_ONLY=true in env/extraEnv" -}}
{{- end -}}
{{- if $ssoOnlyBy -}}
{{- $ssoIssuer := include "wardyn.envValue" (dict "ctx" . "name" "WARDYN_OIDC_ISSUER") -}}
{{- if not $ssoIssuer -}}
{{- fail (printf "wardyn: %s is set but no OIDC issuer is configured — sso-only asserts SSO is the only way into the console, and with no issuer there is no SSO at all; set env.WARDYN_OIDC_ISSUER (plus WARDYN_OIDC_OPERATOR_EMAILS or WARDYN_OIDC_ROLE_MAP) or unset it" $ssoOnlyBy) -}}
{{- end -}}
{{- $ssoAdminToken := include "wardyn.envValue" (dict "ctx" . "name" "WARDYN_ADMIN_TOKEN") -}}
{{- if or .Values.auth.adminToken.secretRef.name .Values.auth.adminToken.value $ssoAdminToken -}}
{{- fail (printf "wardyn: %s is set together with an admin token (auth.adminToken.secretRef.name/value, or WARDYN_ADMIN_TOKEN in env/extraEnv) — a live admin bearer token is a second way into the console, which sso-only asserts does not exist; remove the admin token or unset %s" $ssoOnlyBy $ssoOnlyBy) -}}
{{- end -}}
{{- $ssoMemberModeSet := false -}}
{{- if or (hasKey ($.Values.env | default dict) "WARDYN_USER_DESKTOP") (hasKey ($.Values.env | default dict) "WARDYN_MEMBER_MODE") -}}{{- $ssoMemberModeSet = true -}}{{- end -}}
{{- range .Values.extraEnv | default list -}}
{{- if or (eq (.name | default "") "WARDYN_USER_DESKTOP") (eq (.name | default "") "WARDYN_MEMBER_MODE") -}}{{- $ssoMemberModeSet = true -}}{{- end -}}
{{- end -}}
{{- if $ssoMemberModeSet -}}
{{- fail (printf "wardyn: %s is set together with WARDYN_USER_DESKTOP (or its deprecated alias WARDYN_MEMBER_MODE, removed in 0.9) — member mode relies on the admin token as a process credential, which sso-only forbids outright; unset it or unset %s" $ssoOnlyBy $ssoOnlyBy) -}}
{{- end -}}
{{- if include "wardyn.allowNoOperatorList" . -}}
{{- fail (printf "wardyn: %s is set together with WARDYN_ALLOW_OIDC_NO_OPERATOR_LIST — that override is what makes the \"every signed-in human is an admin\" role-derivation branch reachable, which sso-only exists to forbid; unset WARDYN_ALLOW_OIDC_NO_OPERATOR_LIST or unset %s" $ssoOnlyBy $ssoOnlyBy) -}}
{{- end -}}
{{- end -}}
{{- if not (include "wardyn.authConfigured" .) -}}
{{- fail "wardyn: the public API would 401 every request. Set auth.adminToken.secretRef.name (external Secret — recommended), auth.adminToken.value (inline demo; the token then lives in the Helm release history), or env.WARDYN_OIDC_ISSUER for SSO — and if you pick OIDC, also set env.WARDYN_OIDC_OPERATOR_EMAILS, or the pod will render fine and then crash-loop at boot (env.WARDYN_ALLOW_OIDC_NO_OPERATOR_LIST=true overrides). A raw env.WARDYN_ADMIN_TOKEN also satisfies this and is deliberately still accepted, but it is no longer recommended here: .Values.env renders VERBATIM into the Deployment, so the admin bearer for the entire API becomes a plaintext literal in the pod spec, readable by anyone who can `get deploy`. Inject it yourself with an extraEnv entry carrying a secretKeyRef instead, or point env.WARDYN_ADMIN_TOKEN_FILE at a file a Vault Agent or CSI volume delivers." -}}
{{- end -}}
{{/* A Secret-wired admin token BESIDE a literal one is the same silent ranking
the age-source refusal above forbids, on the credential that gates the whole
public API: deployment.yaml emits the secretKeyRef first and .Values.env /
.Values.extraEnv render after it, so k8s's last-defined-wins hands the pod the
literal while the operator believes the Secret is in effect — and rotating that
Secret then changes nothing. Refused, not ranked. (Either one ALONE still
renders: this is about naming two.) */}}
{{- $envToken := include "wardyn.envValue" (dict "ctx" . "name" "WARDYN_ADMIN_TOKEN") -}}
{{- if and $envToken (or .Values.auth.adminToken.secretRef.name .Values.auth.adminToken.value) -}}
{{- fail "wardyn: WARDYN_ADMIN_TOKEN (or WARDYN_ADMIN_TOKEN_FILE) is set in env/extraEnv AND through auth.adminToken (secretRef.name or value) — pick exactly one admin-token source. The env/extraEnv entry renders after the chart's own secretKeyRef and silently wins (k8s env: last-defined-wins), so the API would authenticate with that value while you believe the Secret is in effect, and rotating the Secret would change nothing. Prefer auth.adminToken.secretRef.name, which keeps the bearer out of the pod spec entirely." -}}
{{- end -}}
{{/* SSO WITH NO OPERATOR ALLOWLIST IS A BOOT REFUSAL, so it has to be a RENDER
refusal too. cmd/wardynd/boot_posture.go validateOperatorPosture refuses to
start when an OIDC issuer is configured and there is neither an operator
allowlist nor a role map nor the explicit override — and the message above
already told operators so. But nothing enforced it: `env.WARDYN_OIDC_ISSUER`
alone rendered exit 0, applied cleanly, and then crash-looped, which is the
exact shape the k8s.proxyImage refusal in deployment.yaml exists to prevent
("a boot-time failure, not a per-run one"). The chart's own
ci/all-on-values.yaml was that unbootable shape.

A valueFrom-sourced allowlist counts as set: the chart cannot read a Secret,
and "cannot see it" must not read as "not set". */}}
{{- $issuer := include "wardyn.envValue" (dict "ctx" . "name" "WARDYN_OIDC_ISSUER") -}}
{{- if $issuer -}}
{{- $emails := include "wardyn.envValue" (dict "ctx" . "name" "WARDYN_OIDC_OPERATOR_EMAILS") -}}
{{- $roleMap := include "wardyn.envValue" (dict "ctx" . "name" "WARDYN_OIDC_ROLE_MAP") -}}
{{- if not (or $emails $roleMap (include "wardyn.allowNoOperatorList" .)) -}}
{{- fail "wardyn: OIDC SSO is configured (WARDYN_OIDC_ISSUER) but the operator allowlist is empty — EVERY human the IdP signs in would be admin-equivalent (rewrite policies/workspaces/site-config, connect the shared harness credential, write and delete secrets, decide approvals, and open an interactive shell in any running sandbox). wardynd REFUSES TO BOOT on this (cmd/wardynd/boot_posture.go validateOperatorPosture), so the render would apply cleanly and the pod would crash-loop. Set env.WARDYN_OIDC_OPERATOR_EMAILS to the humans who may do that — everyone else becomes a user who reads their OWN runs and can launch runs — or set env.WARDYN_OIDC_ROLE_MAP for claim-based roles instead, or explicitly set env.WARDYN_ALLOW_OIDC_NO_OPERATOR_LIST=true to override. extraEnv counts for all four." -}}
{{- end -}}
{{- end -}}
{{/* An age identity counts as wired however the operator supplied it: the
ageKeyFromSecret path, secrets.ageKeySecretRef, an inline secrets.ageKey, a
literal .Values.env entry, or the documented secret-bearing .Values.extraEnv
path. That is exactly $ageSources above — read it rather than re-deriving the
same list a second, subtly different way, which is how the refusal above came to
miss the env/extraEnv door this check already knew about. Note it is read
through wardyn.envValue, so an EMPTY WARDYN_AGE_KEY no longer counts as wired:
wardynd would generate an ephemeral identity, which is the case below. */}}
{{- $ageWired := gt (len $ageSources) 0 -}}
{{/* Store mode keeps no value under the age key, so an unwired key is the
goal there, not an outage; a missing Vault address or role is what would
crash-loop instead (wardynd refuses to boot without a working Vault login). */}}
{{- $store := .Values.secretStore | default dict -}}
{{- $backend := $store.backend | default "pg" -}}
{{- $vault := $store.vault | default dict -}}
{{- $azure := $store.azure | default dict -}}
{{- if not (has $backend (list "pg" "vaultkv" "azurekv")) -}}
{{- fail (printf "wardyn: secretStore.backend=%q is not \"pg\", \"vaultkv\" or \"azurekv\"" $backend) -}}
{{- end -}}
{{- if and $vault.addr $azure.vaultUrl -}}
{{- fail "wardyn: set secretStore.vault.addr or secretStore.azure.vaultUrl, not both — wardynd refuses to boot with two external secret stores" -}}
{{- end -}}
{{- if and (eq $backend "azurekv") (not $azure.vaultUrl) -}}
{{- fail "wardyn: secretStore.backend=azurekv needs secretStore.azure.vaultUrl — wardynd refuses to boot without its Key Vault" -}}
{{- end -}}
{{- if and $azure.vaultUrl (eq ($azure.auth | default "workload-identity") "workload-identity") (or (not $azure.tenantId) (not $azure.clientId)) -}}
{{- fail "wardyn: secretStore.azure.auth=workload-identity needs secretStore.azure.tenantId and secretStore.azure.clientId" -}}
{{- end -}}
{{- if and (eq $backend "vaultkv") (not $vault.addr) -}}
{{- fail "wardyn: secretStore.backend=vaultkv needs secretStore.vault.addr — wardynd refuses to boot without its Vault" -}}
{{- end -}}
{{- if and $vault.addr (eq ($vault.auth | default "kubernetes") "kubernetes") (not $vault.role) -}}
{{- fail "wardyn: secretStore.vault.auth=kubernetes needs secretStore.vault.role — wardynd refuses to boot without a Vault role to log in as" -}}
{{- end -}}
{{- if and $vault.addr $vault.rolePlatform (or (ne ($vault.auth | default "kubernetes") "kubernetes") (eq $vault.rolePlatform $vault.role)) -}}
{{- fail "wardyn: secretStore.vault.rolePlatform is a second Kubernetes-auth role — it needs secretStore.vault.auth=kubernetes and a role other than secretStore.vault.role" -}}
{{- end -}}
{{- if and $vault.addr (eq $vault.auth "token-file") (not $vault.tokenFile) -}}
{{- fail "wardyn: secretStore.vault.auth=token-file needs secretStore.vault.tokenFile, a path your own volume mounts" -}}
{{- end -}}
{{/* A Transit key wraps every new row instead of the age key: the same
exemption as store mode, and a missing key or Vault address is what would
crash-loop instead. */}}
{{- $kek := .Values.kek | default dict -}}
{{- $kekProvider := $kek.provider | default "local" -}}
{{- $transit := $kek.transit | default dict -}}
{{- if not (has $kekProvider (list "local" "transit")) -}}
{{- fail (printf "wardyn: kek.provider=%q is not \"local\" or \"transit\"" $kekProvider) -}}
{{- end -}}
{{- if and (eq $kekProvider "transit") (not $transit.key) -}}
{{- fail "wardyn: kek.provider=transit needs kek.transit.key — wardynd refuses to boot without its Transit key" -}}
{{- end -}}
{{- if and $transit.key (not $vault.addr) -}}
{{- fail "wardyn: kek.transit.key needs secretStore.vault.addr (and its auth) — Transit is reached through the Vault client" -}}
{{- end -}}
{{- $persistentDSN := "" -}}
{{- if .Values.postgres.dsn.secretRef.name -}}{{- $persistentDSN = printf "postgres.dsn.secretRef.name=%q" .Values.postgres.dsn.secretRef.name -}}
{{- else if $dsnFile -}}{{- $persistentDSN = "WARDYN_PG_DSN_FILE" -}}{{- end -}}
{{- if and $persistentDSN (not $ageWired) (not .Values.secrets.allowEphemeralAgeKey) (eq $backend "pg") (ne $kekProvider "transit") -}}
{{- fail (printf "wardyn: %s is a PERSISTENT Postgres, but no age identity is wired, so wardynd generates an ephemeral one at every boot. Boot 1 encrypts its own signing key into that database under identity A; boot 2 generates identity B, cannot decrypt it, and fails closed — the pod crash-loops on its SECOND start (a helm upgrade, node drain, eviction or OOM is enough), and the rows written under A cannot be recovered by setting the key afterwards. Fix: add an `age-key` entry to that Secret (`wardynd -gen-age-key`) and set secrets.ageKeyFromSecret=true, or deliver the identity as WARDYN_AGE_KEY_FILE. Throwaway install where losing every stored secret on restart is fine: set secrets.allowEphemeralAgeKey to true to render anyway." $persistentDSN) -}}
{{- end -}}
{{- if not (or .Values.postgres.dsn.secretRef.name $dsnFile) -}}
{{- if not .Values.postgres.dsn.value -}}
{{- fail "wardyn: set either postgres.dsn.secretRef.name (external Secret) or postgres.dsn.value (inline demo DSN), or point env.WARDYN_PG_DSN_FILE at a file your own volume delivers (Vault Agent, CSI)" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wardyn.secretName" . }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.dsn.key }}: {{ .Values.postgres.dsn.value | quote }}
  {{- with .Values.secrets.ageKey }}
  age-key: {{ . | quote }}
  {{- end }}
{{- end -}}
{{- if and (not .Values.auth.adminToken.secretRef.name) .Values.auth.adminToken.value }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wardyn.authSecretName" . }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.adminToken.key }}: {{ .Values.auth.adminToken.value | quote }}
{{- end -}}
