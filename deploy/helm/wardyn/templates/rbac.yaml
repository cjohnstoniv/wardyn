{{/*
RBAC for the Kubernetes runner substrate (internal/runner/k8s). Rendered ONLY
when k8s.enabled=true — the chart's default (no runner, or the separate
Docker Compose path) calls the API server for nothing, hence
serviceaccount.yaml's automount=false default.

Verbs are EXACT, not "just in case" — every verb below is a verb the
substrate actually issues; see internal/runner/k8s/{sandbox,lifecycle,exec,
canary,driver}.go. In particular:
  - pods: NO watch. Every wait loop (Exec's Wait, teardown's waitPodsGone)
    polls with Get/List; none of them use a watch.Interface.
  - pods/exec: BOTH create and get. session.go's newExecutor builds a
    FallbackExecutor that tries the websocket transport FIRST (SPDY only on
    upgrade failure) — and the websocket leg issues an HTTP GET against the
    exec subresource (remotecommand.NewWebSocketExecutor's
    http.MethodGet), which RBAC maps to the "get" verb, not "create" (that's
    the SPDY/POST leg). Without "get" the websocket attempt 403s and every
    exec silently falls back to the deprecated SPDY path (still functional,
    but noisy: a 403 audit line per channel) — review round 2, M3.
  - secrets: NO get/list. wardynd creates its own per-run proxy-config Secret
    and later deletes it (by name, then by label at teardown) — it never
    reads one back; the kubelet mounts it into the proxy pod, not wardynd.
  - networkpolicies: NO get/list, same reasoning as secrets.
  - runtimeclasses: get ONLY (cluster-scoped, below) — driver.go's
    runtimeClassHandler resolves a RuntimeClass by NAME (Get); nothing in
    this substrate lists them.

Namespaced (Role+RoleBinding, in runsNamespace|release namespace): every
per-sandbox object the substrate creates/tears down (pods, ephemeral
containers, exec, secrets, network policies).
Cluster-scoped (ClusterRole+ClusterRoleBinding): RuntimeClass lookups
(node.k8s.io — RuntimeClass is never namespaced) for the CC2/CC3 floor guard
(Classes(), resolveRuntimeClassName()).
*/}}
{{- if .Values.k8s.enabled -}}
{{- if and (not .Values.serviceAccount.create) (not .Values.serviceAccount.name) -}}
{{- fail "wardyn: k8s.enabled is set with serviceAccount.create=false and no serviceAccount.name — the RoleBinding/ClusterRoleBinding below would bind the k8s-runner privileges (pods/exec, secrets create/delete, networkpolicies create/delete) to the namespace's default ServiceAccount, handing them to every OTHER pod in the namespace that also uses it. Either leave serviceAccount.create=true (the default, a dedicated ServiceAccount), or set serviceAccount.name to an existing ServiceAccount you intend to grant these privileges to." -}}
{{- end -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "wardyn.fullname" . }}-k8s-runner
  namespace: {{ .Values.k8s.runsNamespace | default .Release.Namespace }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "deletecollection"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "wardyn.fullname" . }}-k8s-runner
  namespace: {{ .Values.k8s.runsNamespace | default .Release.Namespace }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "wardyn.fullname" . }}-k8s-runner
subjects:
  - kind: ServiceAccount
    name: {{ include "wardyn.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "wardyn.fullname" . }}-k8s-runtimeclasses
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
rules:
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "wardyn.fullname" . }}-k8s-runtimeclasses
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "wardyn.fullname" . }}-k8s-runtimeclasses
subjects:
  - kind: ServiceAccount
    name: {{ include "wardyn.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
