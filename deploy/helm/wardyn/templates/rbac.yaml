{{/*
RBAC for the Kubernetes runner substrate (internal/runner/k8s). Rendered ONLY
when k8s.enabled=true — the chart's default (no runner, or the separate
Docker Compose path) calls the API server for nothing, hence
serviceaccount.yaml's automount=false default.

Verbs are EXACT, not "just in case" — every verb below is a verb the
substrate actually issues; see internal/runner/k8s/{sandbox,lifecycle,exec,
canary,driver}.go. In particular:
  - pods: NO watch. Every wait loop (Exec's Wait, teardown's waitPodsGone)
    polls with Get/List; none of them use a watch.Interface.
  - pods/exec: BOTH create and get. session.go's newExecutor builds a
    FallbackExecutor that tries the websocket transport FIRST (SPDY only on
    upgrade failure) — and the websocket leg issues an HTTP GET against the
    exec subresource (remotecommand.NewWebSocketExecutor's
    http.MethodGet), which RBAC maps to the "get" verb, not "create" (that's
    the SPDY/POST leg). Without "get" the websocket attempt 403s and every
    exec silently falls back to the deprecated SPDY path (still functional,
    but noisy: a 403 audit line per channel) — review round 2, M3.
  - secrets: NO get/list. wardynd creates its own per-run proxy-config Secret
    and later deletes it (by name, then by label at teardown) — it never
    reads one back; the kubelet mounts it into the proxy pod, not wardynd.
  - networkpolicies: NO get/list, same reasoning as secrets.
  - runtimeclasses: get ONLY (cluster-scoped, below) — driver.go's
    runtimeClassHandler resolves a RuntimeClass by NAME (Get); nothing in
    this substrate lists them.
  - persistentvolumeclaims: get + create, and ONLY when userDrives.enabled —
    drives.go's ensureDrivePVC. Absent from a stock install: a deployment that
    allocates no user drive never touches a claim.

Namespaced (Role+RoleBinding, in runsNamespace|release namespace): every
per-sandbox object the substrate creates/tears down (pods, ephemeral
containers, exec, secrets, network policies).
Cluster-scoped (ClusterRole+ClusterRoleBinding): RuntimeClass lookups
(node.k8s.io — RuntimeClass is never namespaced) for the CC2/CC3 floor guard
(Classes(), resolveRuntimeClassName()).
*/}}
{{- if .Values.k8s.enabled -}}
{{- if and (not .Values.serviceAccount.create) (not .Values.serviceAccount.name) -}}
{{- fail "wardyn: k8s.enabled is set with serviceAccount.create=false and no serviceAccount.name — the RoleBinding/ClusterRoleBinding below would bind the k8s-runner privileges (pods/exec, secrets create/delete, networkpolicies create/delete) to the namespace's default ServiceAccount, handing them to every OTHER pod in the namespace that also uses it. This holds with k8s.rbac.create=false too: wardynd still runs AS that ServiceAccount, and whoever writes the bindings out-of-band binds them to the namespace default SA just the same. Either leave serviceAccount.create=true (the default, a dedicated ServiceAccount), or set serviceAccount.name to an existing ServiceAccount you intend to grant these privileges to." -}}
{{- end -}}
{{/*
The OTHER way these verbs reach things they should not: not the wrong SUBJECT
(above) but the wrong NAMESPACE. An empty k8s.runsNamespace puts runs — and so
this Role — in the control-plane namespace, where pods/exec + secrets delete +
networkpolicies delete cover every workload that happens to share it. RBAC
cannot narrow that (run object names are derived per-run from a UUID, so
resourceNames cannot enumerate them), so the namespace IS the blast radius and
the only fix is to pick a different one. Refused ABOVE the k8s.rbac.create gate
on purpose: with create=false a platform team writes the same Role out-of-band,
so the namespace question is identical — only who types it changes.

Gated on serviceAccount.automount and k8s.proxyImage being satisfied FIRST, by
condition rather than by file position: Helm evaluates rbac.yaml before
deployment.yaml, so without this an install that is missing the proxy image (a
boot-time crash-loop) or the API-server token (a runner that cannot function at
all) would be told about namespace hygiene instead of about the thing that stops
it working. Fix what breaks the install, then what widens its blast radius.
*/}}
{{- if and .Values.serviceAccount.automount .Values.k8s.proxyImage (not .Values.k8s.runsNamespace) (not .Values.k8s.allowRunsInReleaseNamespace) -}}
{{- fail "wardyn: k8s.enabled is set with an empty k8s.runsNamespace, so every run's pods land in the CONTROL-PLANE namespace and the k8s-runner Role is created there. Its verbs then apply to every OTHER workload sharing that namespace: wardynd can exec into any pod there, delete any pod there, and create or delete any Secret and NetworkPolicy there — not only the objects it created for a run. RBAC cannot narrow it: a run's object names are derived per-run from its UUID, so resourceNames cannot enumerate them, which makes the namespace itself the blast radius. Set k8s.runsNamespace to a dedicated, pre-existing namespace that holds nothing else and the chart moves the Role, the RoleBinding and the control-plane NetworkPolicy's callback peer there with it. Sharing the namespace deliberately (a laptop demo, or a cluster where wardynd is the only workload): set k8s.allowRunsInReleaseNamespace=true to render anyway and accept that." -}}
{{- end -}}
{{/*
k8s.rbac.create=false skips the four objects below — for a platform team
that provisions equivalent RBAC out-of-band (e.g. via GitOps) and would
rather this chart not manage it. `default dict` + `hasKey`, not
`| default true`: a bool defaults false-on-false ("false | default true"
== true), so an explicit create=false would be silently ignored by
`| default true`. hasKey correctly treats an ABSENT key (an old
--reuse-values map, or the chart's own default) as "not set" and falls
through to true.
*/}}
{{- $rbac := .Values.k8s.rbac | default dict -}}
{{/*
Same shape for userDrives: a `helm upgrade --reuse-values` from a release that
PREDATES this block hands the templates a values map with no userDrives key at
all, and a bare .Values.userDrives.enabled would kill that upgrade at render
with a nil pointer (the failure mode the Makefile's own predates-the-0.6-blocks
render exists to catch). `| default dict` makes an absent block read as off.
*/}}
{{- $userDrives := .Values.userDrives | default dict -}}
{{- if or (not (hasKey $rbac "create")) $rbac.create -}}
{{- if not .Values.k8s.runsNamespace }}
# ─────────────────────────────────────────────────────────────────────────────
# WARNING: k8s.runsNamespace is empty, so runs land in the CONTROL-PLANE
# namespace and the Role below is created there ({{ .Release.Namespace }}).
# Every verb in it then applies to every OTHER workload that shares this
# namespace — wardynd can exec into any pod here, delete any pod here, and
# create or delete any Secret and NetworkPolicy here, not merely the ones it
# made for a run. RBAC cannot narrow that: a run's object names are derived
# per-run from its UUID, so `resourceNames` is not available to scope them.
# The confinement is the NAMESPACE. Set k8s.runsNamespace to a dedicated,
# pre-existing namespace that holds nothing else and this Role moves there with
# the runs; the sibling guard above already refuses the OTHER way these verbs
# leak (binding them to the namespace's default ServiceAccount).
# ─────────────────────────────────────────────────────────────────────────────
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "wardyn.fullname" . }}-k8s-runner
  namespace: {{ .Values.k8s.runsNamespace | default .Release.Namespace }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "deletecollection"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete", "deletecollection"]
{{- if $userDrives.enabled }}
  # User drives (drives.go's ensureDrivePVC), each verb justified:
  #   get    — a drive's claim is looked up BY NAME before anything else, and a
  #            k8s_pvc_static (share) drive is ONLY ever looked up: an admin
  #            provisioned that claim, so a missing one fails the run instead of
  #            being invented as an empty volume.
  #   create — a k8s_pvc (managed) drive provisions one claim per person, once,
  #            on the first run that mounts it.
  # NOT granted, deliberately:
  #   delete/deletecollection — a drive outlives every run that mounts it.
  #            Reclaiming a departed person's claim is an operator command (see
  #            this chart's README), never something wardynd can do on its own.
  #   list/watch — nothing enumerates claims; the name is derived, not searched.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "wardyn.fullname" . }}-k8s-runner
  namespace: {{ .Values.k8s.runsNamespace | default .Release.Namespace }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "wardyn.fullname" . }}-k8s-runner
subjects:
  - kind: ServiceAccount
    name: {{ include "wardyn.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{/* CLUSTER-SCOPED NAMES CARRY THE NAMESPACE; namespaced ones above must not.
wardyn.fullname is built from the RELEASE NAME alone, which is enough for every
namespaced object (two releases in two namespaces get two distinct Roles) but
NOT for these two: a cluster-scoped object has one global name, so
`helm install wardyn -n team-a` and `helm install wardyn -n team-b` both want
"wardyn-k8s-runtimeclasses" — the second install fails on a resource it does not
own, and an uninstall of either would take the other's RuntimeClass read
permission with it, breaking every CC2/CC3 run in the surviving namespace with a
403 no chart output explains. Prefixing with .Release.Namespace makes the two
independent. Renaming is safe on upgrade: both objects are in the release
manifest, so Helm creates the new pair and removes the old. */}}
{{- $clusterName := printf "%s-%s-k8s-runtimeclasses" .Release.Namespace (include "wardyn.fullname" .) -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
rules:
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "wardyn.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
{{- end -}}
