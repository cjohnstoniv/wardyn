{{/*
wardynd Deployment — the core object the chart was missing.

Honors values.yaml: image.*, replicas, resources, persistence, and the secret
wiring. The bind address is the -listen arg; env uses cmd/wardynd/main.go's
flagEnv names. WARDYN_PG_DSN and WARDYN_ADMIN_TOKEN come from Secrets (external
or chart-created, chosen independently), WARDYN_AGE_KEY only when the referenced
Secret is known to carry it (otherwise wardynd generates an ephemeral key at
boot), and WARDYN_RECORDING_STORE/WARDYN_RECORDING_DIR follow persistence so the
chart's own defaults boot on a read-only root FS and record nothing anywhere
until an operator asks for it. Secret-bearing extras go through .Values.extraEnv;
.Values.env renders inline. k8s.* wires the k8s runner substrate
(WARDYN_RUNNER/WARDYN_K8S_NAMESPACE/WARDYN_PROXY_IMAGE/WARDYN_CONFINEMENT_MAP/
WARDYN_CONTROL_PLANE_URL — refused at render if serviceAccount.automount is
off, since the substrate drives the API server via client-go); ssh.* adds the
optional SSH port + WARDYN_SSH_LISTEN/WARDYN_SSH_ADVERTISE; uiSandbox.* adds
the optional UI-sandbox gateway port + WARDYN_UI_SANDBOX_LISTEN/_ADVERTISE/
_ORIGIN_TEMPLATE (docs/UI-SANDBOXES.md).

Hardening (defense in depth alongside the per-run sandbox envelope):
  - runs as a non-root user (the wardynd image is distroless:nonroot, uid 65532)
  - read-only root FS, all Linux capabilities dropped, no privilege escalation
  - liveness/readiness/startup probes on /healthz (wardynd serves it even when
    the admin token is unset — it is the one always-on endpoint)
*/}}
{{- if and (gt (int .Values.replicas) 1) (not .Values.allowMultiReplica) -}}
{{- fail "wardyn: replicas > 1 is refused. wardynd keeps state per-process that a second pod cannot see; the sharpest is the secret-masking registry (internal/secretmask) — an in-memory, process-local map that FAILS OPEN. Secrets are registered on whichever replica served the run's proxy injection; a session recording uploaded to any other replica finds an empty snapshot and is persisted VERBATIM, live credentials in cleartext, with a `success` audit event. The same holds for the live-attach cast. Run one replica (docs/OPERATIONS.md, \"One replica, by construction\"); set allowMultiReplica=true to render anyway and accept that." -}}
{{- end -}}
{{- if and .Values.k8s.enabled (not .Values.serviceAccount.automount) -}}
{{- fail "wardyn: k8s.enabled requires serviceAccount.automount=true. The k8s runner substrate (internal/runner/k8s) drives the Kubernetes API directly via client-go, which needs the pod's own projected ServiceAccount token to authenticate — automount=false (the chart's own default, since wardynd calls no API server otherwise) leaves it completely unable to. Set serviceAccount.automount=true." -}}
{{- end -}}
{{- if and .Values.k8s.enabled (not .Values.k8s.proxyImage) -}}
{{- fail "wardyn: k8s.enabled requires k8s.proxyImage. The k8s runner substrate (internal/runner/k8s driver.go) refuses to construct without one (errProxyImageUnset) — this is a boot-time failure, not a per-run one: wardynd's runner build returns the error straight up through cmd/wardynd/main.go, so the pod crash-loops instead of coming up with runs merely failing closed. Set k8s.proxyImage to the wardyn-proxy image you built and pushed (see the chart README's Prerequisites)." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wardyn.fullname" . }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
spec:
  # replicas stays at 1, and the fail above ENFORCES it (allowMultiReplica is the
  # only way past). Five defects that used to make >1 drop requests — attach
  # tickets, compose results, the lifecycle reaper, run watchers, session
  # recordings, and the ground-truth token rotator — are closed at the code level
  # (Postgres state, leases, leader election). What is NOT closed is the
  # secret-masking registry, which fails open across replicas; docs/OPERATIONS.md
  # "One replica, by construction" carries the full remaining list. The value
  # stays templated for a future build that ships multi-replica for real.
  replicas: {{ .Values.replicas }}
  # Recreate, not Kubernetes' default RollingUpdate: a rolling update starts the
  # NEW pod before terminating the old one — a second replica for the window
  # between them, on every `helm upgrade`, even though `replicas` never leaves
  # 1 — exactly the secret-masking exposure the refusal above exists to
  # prevent. Recreate tears the old pod down first so there is never a second
  # one live.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wardyn.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wardyn.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "wardyn.serviceAccountName" . }}
      # Set on the POD, not just on the ServiceAccount we may not be creating:
      # serviceAccount.create=false points at an SA whose own automount default
      # is true, and the pod-level field wins over the SA-level one.
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: wardynd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -listen=:{{ .Values.service.port }}
          env:
            # DSN is the only required input; pulled from the (external or
            # chart-created) Secret so it never appears in the pod spec.
            - name: WARDYN_PG_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "wardyn.secretName" . }}
                  key: {{ .Values.postgres.dsn.key }}
            {{- if or .Values.auth.adminToken.secretRef.name .Values.auth.adminToken.value }}
            # Admin bearer token. Unset (and no OIDC) => every API route 401s
            # while /healthz still reports Ready, so secret.yaml fails the render
            # instead of shipping a control plane that serves nothing.
            - name: WARDYN_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "wardyn.authSecretName" . }}
                  key: {{ .Values.auth.adminToken.key }}
            {{- end }}
            {{- if or .Values.secrets.ageKeyFromSecret (and .Values.secrets.ageKey (not .Values.postgres.dsn.secretRef.name)) }}
            # age secret-store identity (optional). Injected only when the Secret
            # we reference is KNOWN to carry an "age-key" entry — the chart wrote
            # it (inline mode) or the operator says so (ageKeyFromSecret).
            # Otherwise wardynd self-generates an ephemeral one.
            - name: WARDYN_AGE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "wardyn.secretName" . }}
                  key: age-key
            {{- end }}
            {{- if not (hasKey .Values.env "WARDYN_RECORDING_STORE") }}
            # wardynd's own default store is `pg` — Postgres-backed, needs no
            # volume, visible to every replica. The chart pins `fs` anyway so
            # persistence.enabled stays the SINGLE recording switch it is
            # documented to be: with `pg`, WARDYN_RECORDING_DIR below is a no-op
            # and a stock install (persistence off, the default) would silently
            # start persisting every PTY asciicast into the control-plane
            # database — forever, since WARDYN_RECORDING_RETENTION_DAYS defaults
            # to keep-everything. That is a storage AND privacy decision, so it
            # is opt-in: set env.WARDYN_RECORDING_STORE=pg to take it (and then
            # leave persistence off — pg needs no PVC).
            - name: WARDYN_RECORDING_STORE
              value: "fs"
            {{- end }}
            {{- if not (hasKey .Values.env "WARDYN_RECORDING_DIR") }}
            # wardynd's own default (./data/recordings) lands on the read-only
            # root FS, and NewFSStore's MkdirAll failure is a hard boot error —
            # the chart's defaults would CrashLoopBackOff. Point it at the
            # persistent mount, else empty = replay off (the documented no-op in
            # internal/recording/registry.go). An .Values.env entry overrides.
            - name: WARDYN_RECORDING_DIR
              value: {{ if .Values.persistence.enabled }}{{ printf "%s/recordings" .Values.persistence.mountPath | quote }}{{ else }}""{{ end }}
            {{- end }}
            {{- if not (hasKey .Values.env "WARDYN_AUDIT_SPOOL") }}
            # wardynd's own default (./data/audit-spool.jsonl) is the audit
            # fallback spool (C1: a Postgres write that fails is fsync'd here
            # instead of silently lost) — and it lands on the read-only root FS
            # exactly like WARDYN_RECORDING_DIR above, silently disabling the
            # documented per-pod spool on the chart's own defaults. Point it at
            # the always-present /tmp emptyDir when persistence is off (durable
            # across a container restart, not a reschedule, but strictly better
            # than the mkdir failure the unpatched default hits), or the
            # persistent volume when persistence is on. An .Values.env entry
            # overrides.
            - name: WARDYN_AUDIT_SPOOL
              value: {{ if .Values.persistence.enabled }}{{ printf "%s/audit-spool.jsonl" .Values.persistence.mountPath | quote }}{{ else }}"/tmp/audit-spool.jsonl"{{ end }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            # Raw EnvVar entries, so secret-bearing WARDYN_* (OIDC client secret,
            # composer API key, audit-sink JSON) ride a secretKeyRef instead of
            # rendering as a literal in the Deployment object like .Values.env.
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.k8s.enabled }}
            # k8s runner wiring (internal/runner/k8s, `-tags k8s`). Placed AFTER
            # .Values.env/.extraEnv above so it always wins on a duplicate key
            # (k8s env: last-defined-wins) — WARDYN_RUNNER especially must never
            # be silently skipped: the registry defaults to `docker`, and
            # forgetting it on a cluster (no Docker daemon at all) is a boot-time
            # connection error, not a helpful message.
            - name: WARDYN_RUNNER
              value: "k8s"
            - name: WARDYN_K8S_NAMESPACE
              value: {{ .Values.k8s.runsNamespace | default .Release.Namespace | quote }}
            - name: WARDYN_PROXY_IMAGE
              value: {{ .Values.k8s.proxyImage | quote }}
            {{- if .Values.k8s.imagePullSecret }}
            - name: WARDYN_K8S_IMAGE_PULL_SECRET
              value: {{ .Values.k8s.imagePullSecret | quote }}
            {{- end }}
            {{- $rtc := list -}}
            {{- with .Values.k8s.runtimeClasses.CC2 }}{{- $rtc = append $rtc (printf "CC2=%s" .) -}}{{- end }}
            {{- with .Values.k8s.runtimeClasses.CC3 }}{{- $rtc = append $rtc (printf "CC3=%s" .) -}}{{- end }}
            {{- if $rtc }}
            - name: WARDYN_CONFINEMENT_MAP
              value: {{ join ";" $rtc | quote }}
            {{- end }}
            # The Service's in-cluster FQDN, not a bare name: correct whether
            # sandbox proxy pods run in THIS namespace or in a different
            # k8s.runsNamespace (a bare Service name only resolves within the
            # SAME namespace's DNS search path).
            - name: WARDYN_CONTROL_PLANE_URL
              value: {{ printf "http://%s.%s.svc.cluster.local:%d" (include "wardyn.fullname" .) .Release.Namespace (int .Values.service.port) | quote }}
            {{- end }}
            {{- if .Values.ssh.enabled }}
            - name: WARDYN_SSH_LISTEN
              value: {{ printf ":%d" (int .Values.ssh.port) | quote }}
            - name: WARDYN_SSH_ADVERTISE
              value: {{ printf "%s:%d" (required "wardyn: ssh.advertiseHost is required when ssh.enabled=true (the externally-reachable host agents/operators connect back to)" .Values.ssh.advertiseHost) (int .Values.ssh.port) | quote }}
            {{- end }}
            {{- if .Values.uiSandbox.enabled }}
            - name: WARDYN_UI_SANDBOX_LISTEN
              value: {{ printf ":%d" (int .Values.uiSandbox.port) | quote }}
            - name: WARDYN_UI_SANDBOX_ADVERTISE
              value: {{ required "wardyn: uiSandbox.advertiseURL is required when uiSandbox.enabled=true (the externally-reachable base URL of the gateway — the console's Open button opens it, and it must be a DIFFERENT host than the console)" .Values.uiSandbox.advertiseURL | quote }}
            {{- with .Values.uiSandbox.originTemplate }}
            - name: WARDYN_UI_SANDBOX_ORIGIN_TEMPLATE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.ssh.enabled }}
            - name: ssh
              containerPort: {{ .Values.ssh.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.uiSandbox.enabled }}
            - name: ui
              containerPort: {{ .Values.uiSandbox.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            # Generous startup budget covering wardynd's OWN connect (fixed 30s)
            # + migrate (WARDYN_MIGRATE_TIMEOUT, default 5m) budgets — /healthz
            # doesn't bind until both finish, so this window must stay >= their
            # sum or the probe kills the pod mid-migration instead of protecting
            # it (W28-S1-4: before the migrate timeout existed, wardynd itself
            # hard-exited at 30s regardless of this probe's allowance, so the
            # "generous startup budget" this comment promised was never the
            # thing actually bounding a slow migration).
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 90
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Read-only root FS needs writable scratch for any temp work.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            # Recordings + audit spool. The env block above already points
            # WARDYN_RECORDING_DIR / WARDYN_AUDIT_SPOOL at <mountPath>/recordings
            # and <mountPath>/audit-spool.jsonl respectively.
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "wardyn.fullname" . }}-data
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "wardyn.fullname" . }}-data
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
