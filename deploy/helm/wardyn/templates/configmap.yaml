{{/*
Optional operator-supplied default policy (WARDYN_DEFAULT_POLICY), baked
into a ConfigMap and mounted read-only instead of relying on the wardynd
image's own baked-in default (examples/policies/default.json — README
"Installation"). Rendered only when .Values.defaultPolicy is non-empty.

The guards are deliberate: a non-string value, invalid JSON, or JSON that
is not an object fails the RENDER (a clear message, no object created)
instead of applying fine and crash-looping the pod at policy load. They
check shape only — the policy's fields are still validated by wardynd.
*/}}
{{- if .Values.defaultPolicy -}}
{{- if not (kindIs "string" .Values.defaultPolicy) -}}
{{- fail "wardyn: defaultPolicy must be the policy as JSON TEXT (a string — e.g. --set-file defaultPolicy=my-policy.json), not a YAML map or number" -}}
{{- end -}}
{{- if not (kindIs "map" (mustFromJson .Values.defaultPolicy)) -}}
{{- fail "wardyn: defaultPolicy must be a JSON object (a RunPolicy), not a bare JSON scalar or array" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wardyn.fullname" . }}-default-policy
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
data:
  policy.json: {{ .Values.defaultPolicy | quote }}
{{- end }}
{{/*
Optional corporate CA trust (WARDYN_TRUSTED_CA_FILE): a PEM bundle of
additional trusted roots a corporate TLS-inspecting middlebox signs with,
baked into a ConfigMap (a certificate is public, unlike the age key or the
DSN — no Secret involved) and mounted read-only. Rendered only when
.Values.trustedCA is non-empty. PEM text is a string, not JSON — no shape
guard beyond "it's a string"; wardynd itself refuses boot on a PEM that
doesn't parse (loadTrustedCA), which is the real validation.
*/}}
{{- if .Values.trustedCA -}}
{{- if not (kindIs "string" .Values.trustedCA) -}}
{{- fail "wardyn: trustedCA must be PEM TEXT (a string — e.g. --set-file trustedCA=my-corp-ca.pem), not a YAML map or number" -}}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wardyn.fullname" . }}-trusted-ca
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
data:
  ca.pem: {{ .Values.trustedCA | quote }}
{{- end -}}
{{/*
Optional key domains (WARDYN_KEY_DOMAINS_FILE): kek.domains rendered as JSON.
A key id and a role name are identifiers, not secrets, so a ConfigMap is right.
The render refuses a domain name wardynd would refuse at boot (it must be
a-z, 0-9 and "-", and is never "default") and a value that is not one transit
key or one azurekv pair; the keys themselves are proven by wardynd at boot.
*/}}
{{- $domains := (.Values.kek | default dict).domains | default dict -}}
{{- if $domains -}}
{{- if not (kindIs "map" $domains) -}}
{{- fail "wardyn: kek.domains must be a map from domain name to {transit: {key, role}} or {azurekv: {key, signingKey, clientId}}" -}}
{{- end -}}
{{- range $name, $d := $domains -}}
{{- if or (eq $name "default") (not (regexMatch "^[a-z0-9-]{1,63}$" $name)) -}}
{{- fail (printf "wardyn: kek.domains names a domain %q; a name is 1 to 63 characters of a-z, 0-9 and \"-\", and never \"default\"" $name) -}}
{{- end -}}
{{- if not (and (kindIs "map" $d) (eq (len $d) 1) (or (hasKey $d "transit") (hasKey $d "azurekv"))) -}}
{{- fail (printf "wardyn: kek.domains.%s must hold exactly one of transit (key, role) or azurekv (key, signingKey, clientId)" $name) -}}
{{- end -}}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wardyn.fullname" . }}-key-domains
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
data:
  domains.json: {{ toJson $domains | quote }}
{{- end -}}
{{/*
Optional site-config seed (WARDYN_SITE_CONFIG_SEED_FILE): .Values.siteConfigSeed
rendered as JSON. Network topology and secret NAMES only, so a ConfigMap is
right; wardynd validates the keys and values at boot (LoadSiteConfigSeed).
*/}}
{{- $seed := .Values.siteConfigSeed | default dict -}}
{{- if $seed -}}
{{- if not (kindIs "map" $seed) -}}
{{- fail "wardyn: siteConfigSeed must be a map of upstream_proxy_url or upstream_proxy_secret_ref, upstream_proxy_no_proxy and internal_hosts" -}}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wardyn.fullname" . }}-site-config-seed
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
data:
  seed.json: {{ toJson $seed | quote }}
{{- end -}}
