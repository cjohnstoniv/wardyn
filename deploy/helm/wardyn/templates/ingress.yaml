{{/*
Optional Ingress fronting the console's HTTP port ONLY — never `ui` (needs
its own hostname, see README "UI sandbox gateway") or `ssh` (TCP, not
HTTP-routable). Off by default: this chart's own service.type=ClusterIP
needs *something* routing to it in most clusters, but every platform's
ingress controller / class / TLS story differs enough that the chart
cannot guess a working default.

Gateway API's HTTPRoute is deliberately NOT offered here yet — this repo's
CI has no Gateway controller to exercise it against, and a template no CI
run ever renders through a real controller is worse than not shipping one.
*/}}
{{- $ing := .Values.ingress | default dict -}}
{{- if $ing.enabled -}}
{{- if not $ing.hosts -}}
{{- fail "wardyn: ingress.enabled is set with no ingress.hosts — an Ingress with no rules routes nothing. Add at least one host under ingress.hosts." -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "wardyn.fullname" . }}
  labels:
    {{- include "wardyn.labels" . | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $ing.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- /* no paths => the console root; `paths: null` renders an Ingress the API server rejects */ -}}
          {{- range (.paths | default (list (dict "path" "/" "pathType" "Prefix"))) }}
          - path: {{ .path | default "/" }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "wardyn.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end -}}
