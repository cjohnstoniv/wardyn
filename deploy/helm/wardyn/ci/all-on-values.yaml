# The other side of every switch, in ONE render.
#
# `<chart>/ci/*-values.yaml` is the chart-testing convention, so this is the
# native place for it. `make helm-lint` renders the chart twice: once on the
# defaults (external DSN Secret, persistence off, created ServiceAccount, no
# extras) and once with this file, which flips each of those the other way.
# Without it CI only ever exercised the default branch of every `{{ if }}` in
# templates/ — the chart's one prior failure mode was shipping with no
# templates/ at all, rendering zero objects (see templates/_helpers.tpl).
#
# The values are structurally valid but deliberately fake: nothing here is ever
# installed, only rendered.
image:
  pullSecrets:
    - name: regcred

# Console Ingress, the "other side" of ITS off-by-default switch.
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/tls-acme: "true"
  hosts:
    - host: wardyn.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts: ["wardyn.example.com"]
      secretName: wardyn-tls

# Inline (demo) DSN mode => the chart renders its own Secret, and secrets.ageKey
# is injectable (it is inline-mode only; see templates/secret.yaml's fail guard).
postgres:
  dsn:
    secretRef:
      name: ""
    value: postgres://wardyn:wardyn@db:5432/wardyn?sslmode=disable

auth:
  adminToken:
    value: not-a-real-token

secrets:
  # Deliberately NOT bech32-shaped: the chart never parses it, and a realistic
  # AGE-SECRET-KEY-1... would need its own gitleaks fingerprint forever.
  ageKey: not-a-real-age-identity

env:
  WARDYN_OIDC_ISSUER: https://issuer.example
  # NOT optional garnish. An OIDC issuer with no operator allowlist, no role map
  # and no explicit override is a BOOT refusal (validateOperatorPosture), so the
  # chart refuses to render it — this file used to be exactly that unbootable
  # shape, rendering exit 0 and crash-looping on apply. Keeping a satisfier here
  # means the "all switches on" example is also a bootable one.
  WARDYN_OIDC_OPERATOR_EMAILS: platform@example.com

extraEnv:
  - name: WARDYN_OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: wardyn-oidc
        key: client-secret

# JSON text (see values.yaml's defaultPolicy doc for why), shaped like
# examples/policies/demo.json — a CC1 floor, so it works unmodified on any
# cluster (no k8s.runtimeClasses pin needed).
defaultPolicy: |
  {
    "allowed_domains": ["proxy.golang.org"],
    "denied_domains": [],
    "first_use_approval": "deny_with_review",
    "allowed_methods": [],
    "min_confinement_class": "CC1",
    "eligible_grants": [],
    "auto_stop_after_sec": 0
  }

networkPolicy:
  ingress:
    # Setting this REPLACES the same-namespace default, so every peer that must
    # reach wardynd has to be listed. The monitoring namespace is here because
    # podAnnotations below advertises prometheus.io/scrape — an example that
    # advertised the scrape while the default-deny policy admitted no scraper
    # was advertising a signal nothing could collect. See the chart README's
    # "Scraping /metrics through the NetworkPolicy".
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
  egress:
    extra:
      - to:
          - ipBlock:
              cidr: 10.0.0.0/8

# On => a PersistentVolumeClaim plus WARDYN_RECORDING_DIR=/data/recordings.
persistence:
  enabled: true
  storageClass: fast

# Bring-your-own ServiceAccount: the chart renders NO ServiceAccount here, so
# the automountServiceAccountToken the gate counts can only come from the pod
# spec (proving the values-level override survives even with create=false).
# automount=true (not false, as this render used to pin it) because k8s.enabled
# below now requires it — see templates/deployment.yaml's fourth render
# refusal. The thing under test either way is the SAME direct passthrough
# ({{ .Values.serviceAccount.automount }}), so this is equal coverage of that
# template line, not less — helm-lint asserts the count at 1 for "true" now.
serviceAccount:
  create: false
  name: wardyn-byo
  automount: true

# The k8s runner substrate, the "other side" of its own off-by-default switch.
# runsNamespace deliberately DIFFERENT from the release namespace (which
# `helm template` with no -n/--namespace resolves to "default") so this render
# also exercises the control-plane NetworkPolicy's extra runsNamespace ingress
# peer (see templates/networkpolicy.yaml).
k8s:
  enabled: true
  runsNamespace: wardyn-runs
  proxyImage: ghcr.io/example/wardyn-proxy:ci-test
  imagePullSecret: k8s-regcred
  runtimeClasses:
    CC2: gvisor
    CC3: kata-qemu
  apiServer:
    ports: [443, 6443]
    to:
      - ipBlock:
          cidr: 172.18.0.0/16

# User drives, the "other side" of THEIR off-by-default switch: the k8s-runner
# Role gains persistentvolumeclaims get+create (see templates/rbac.yaml).
userDrives:
  enabled: true

# SSH access, the "other side" of ITS off-by-default switch: a second port on
# the same Service/Deployment (see templates/service.yaml, deployment.yaml).
ssh:
  enabled: true
  port: 2222
  advertiseHost: ssh.example.com

# UI-sandbox gateway, the "other side" of ITS off-by-default switch: a third
# port, on its OWN hostname (never the console's — that separation is the
# whole control), plus the per-run origin template's wildcard-DNS mode.
uiSandbox:
  enabled: true
  port: 8081
  advertiseURL: https://wardyn-ui.example.com
  originTemplate: https://run-{run}.ui.example.com

# Corporate CA trust, the "other side" of ITS off-by-default switch. It is a
# FIVE-object surface — a ConfigMap, a checksum pod annotation,
# WARDYN_TRUSTED_CA_FILE, a volume and a volumeMount — and with `trustedCA`
# left at its default neither of helm-lint's two renders touched any of them:
# breaking the mount path passed the whole gate. PEM TEXT, structurally shaped
# but not a real certificate (nothing here is ever installed, only rendered).
trustedCA: |
  -----BEGIN CERTIFICATE-----
  MIIBnotarealcertificateitisonlyrenderedneverinstalledAAAAAAAAAAAA
  -----END CERTIFICATE-----

# Explicit requests/limits: the values.yaml default is `{}` (no resources
# stanza at all), so the passthrough was likewise rendered by neither gate.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

podAnnotations:
  prometheus.io/scrape: "true"

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - key: dedicated
    operator: Exists
    effect: NoSchedule

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values:
                - amd64
