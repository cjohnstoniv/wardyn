# Wardyn attach: make tmux a transparent, PERSISTENT shell host.
#
# The attach terminal runs `tmux new-session -A -s wardyn bash` so the session
# survives WebSocket detaches (tab switches, refreshes, drops). This config
# keeps tmux invisible so it behaves like a plain shell in the browser xterm:
#
#   - status off: no bottom status bar (it otherwise renders as stray bars /
#     line-drawing artifacts in xterm.js — the "__" the operator saw).
#   - sane terminfo + truecolor passthrough so prompts/TUIs (claude) render.
#   - mouse on, large scrollback; snappy ESC for TUIs.
set -g status off
# Mouse ON: tmux enters the alternate screen, so xterm.js has no scrollback of
# its own and would turn each wheel notch into Up/Down (recalling bash
# history). With the mouse on, tmux owns the wheel: it scrolls its own history
# in a shell pane and still sends Up/Down to full-screen programs that do not
# ask for the mouse (see the wheel bindings below).
set -g mouse on
# Right-click stays with the browser (context menu, paste).
unbind -n MouseDown3Pane
unbind -n M-MouseDown3Pane
# tmux forwards its copy buffer to the terminal as OSC 52 only for programs
# outside tmux ("external"). This is a default, not a control: code in the
# sandbox can still emit OSC 52 itself (for example `tmux set-buffer -w`), so
# the browser-side clipboard gate is the only control.
set -g set-clipboard external
# A writer's focus reclaims the window size (window-size latest).
set -g focus-events on
# Wheel: a program on the alternate screen that did not request the mouse (vim,
# less) gets Up/Down; a program that requested it gets the wheel itself; a
# shell pane enters copy-mode and scrolls history.
bind -n WheelUpPane if -F '#{||:#{mouse_any_flag},#{pane_in_mode}}' 'send-keys -M' 'if -F "#{alternate_on}" "send-keys Up" "copy-mode -e; send-keys -M"'
bind -n WheelDownPane if -F '#{||:#{mouse_any_flag},#{pane_in_mode}}' 'send-keys -M' 'if -F "#{alternate_on}" "send-keys Down" "send-keys -M"'
set -g history-limit 50000
set -s escape-time 0
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*:Tc"
# Don't rename the window from program titles (keeps things quiet with no bar).
set -g allow-rename off
setw -g automatic-rename off
