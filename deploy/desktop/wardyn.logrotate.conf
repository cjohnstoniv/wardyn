#
# logrotate fragment for the Linux desktop tier. Install to
# /etc/logrotate.d/wardyn.
#
# MOSTLY NOT NEEDED: wardyn.service logs to journald, which rotates itself. This
# exists only for a Linux box whose operator has redirected the converge job's
# output to a file, or who runs wardyn-desktop.sh from something other than the
# shipped unit. It is a no-op when the path is absent (missingok).
#
# Generations match the macOS fragment for the same reason: A7's audit-drop
# counter surfaces only as a log warning on a laptop, so rotating it away
# destroys the evidence the SIEM fanout dropped events.
/var/log/wardyn/*.log {
    weekly
    rotate 7
    size 1M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
