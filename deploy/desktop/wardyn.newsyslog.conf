#
# newsyslog fragment for the macOS desktop tier. Install to
# /etc/newsyslog.d/wardyn.conf (install.sh does this).
#
# WHY: com.wardyn.daemon.plist appends BOTH stdout and stderr to a single
# /var/log/wardyn/desktop.log, every 300s, forever, and compose sets no
# max-size. Nothing rotated it. On a laptop that runs for months that is
# unbounded growth on the volume the user actually uses.
#
# The Linux side needs no equivalent: wardyn.service logs to journald, which
# rotates on its own.
#
# KEEP 7 GENERATIONS, NOT 1. A7's audit-drop counter surfaces ONLY as a
# slog.Warn in this file (nothing scrapes /metrics on a laptop), so aggressive
# rotation would destroy the very evidence that the SIEM fanout dropped events
# — on the tier whose pitch is that widening your ceiling leaves evidence.
# 7 x 1MB is small and covers a working week of drops.
#
# logfilename                    [owner:group]  mode  count  size  when  flags
/var/log/wardyn/desktop.log       root:wheel     644   7      1024  *     J
