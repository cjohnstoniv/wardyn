version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # Batch low-risk minor/patch bumps into one PR so a CVE-driven or major bump
      # (e.g. React 18->19) stands out instead of drowning in the weekly pile.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Base-image CVE bumps: the pinned production Dockerfiles (golang/node/alpine/
  # debian/distroless/postgres/tetragon/dex) got no automated updates before.
  # GLOB, not a per-image list: the list missed /deploy/images/aws-sso — the one
  # image with an external debian base and a full AWS CLI — so its pins were
  # frozen forever while its identically-pinned siblings moved. Expansion only
  # matches directories that hold a manifest, so common/ (no Dockerfile) is
  # skipped for free and the next agent image is covered on arrival.
  #
  # BOTH levels of deploy/ are globbed, for that same reason one level up: a
  # hand-listed `/deploy/compose` left /deploy/kind (Dockerfile.conformance-agent,
  # pinned at busybox 1.36 while 1.38 shipped) frozen forever — recreating the
  # exact gap the /deploy/images/* glob was adopted to prevent, one directory
  # over. `/deploy/*` covers every current and future deploy/ subdirectory that
  # holds a Dockerfile or a compose file; `/deploy/images/*` is still needed
  # because a glob matches ONE path segment, and the agent images sit a level
  # deeper.
  - package-ecosystem: docker
    directories:
      - /deploy/*
      - /deploy/images/*
      # test/e2e/fixtures holds a base image too; a fixture that never moves
      # is a CVE that never surfaces (R5 F181 follow-up).
      - /test/e2e/fixtures
    schedule:
      interval: weekly
    groups:
      docker-base-images:
        patterns: ["*"]
    ignore:
      # Agent images ship on Node LTS lines only — odd-numbered majors are
      # non-LTS. Extend this list when the next odd major appears.
      - dependency-name: node
        versions: ["25.*", "27.*"]
