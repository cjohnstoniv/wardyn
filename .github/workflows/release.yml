name: Release images

# Publishes the FOUR images a Wardyn release actually ships, cosign-signed
# (keyless), plus a signed-release SBOM — on every vX.Y.Z tag push
# (RELEASING.md's tagging convention). This is the "release" half of image
# publishing; .github/workflows/publish-image.yml remains the CONTINUOUS half
# (wardynd only, :latest + :sha-<commit> on every push to main) — the two no
# longer overlap: publish-image.yml's own tags trigger was removed in the same
# change that added this file (a v* push used to fire BOTH workflows, racing
# to push the identical wardynd:X.Y.Z ref, one signed one not — see that
# file's header for the current split).
#
# ── the five images, and why each ref is what it is (verified against the
#    tree, not assumed) ──────────────────────────────────────────────────────
#   ghcr.io/cjohnstoniv/wardynd
#     deploy/helm/wardyn/values.yaml's `image.repository` default (line ~16)
#     — the chart's `image.tag: ""` resolves to `.Chart.AppVersion`, so a
#     release tag vX.Y.Z landing here as the bare "X.Y.Z" is what makes a
#     freshly-cut chart of the same version resolve to a real, pullable image
#     instead of ImagePullBackOff. Built with GO_BUILD_TAGS=docker,k8s (both
#     runner substrates compiled in — deploy/compose/Dockerfile.wardynd's own
#     new default, passed explicitly here for the record) so the SAME
#     published image serves the compose demo AND the Helm chart.
#   ghcr.io/cjohnstoniv/wardyn-proxy
#     matches deploy/helm/wardyn/README.md's "Kubernetes runner substrate"
#     worked example (`--set k8s.proxyImage="$REGISTRY/wardyn-proxy:$TAG"`)
#     and WARDYN_PROXY_IMAGE's naming (docs/ENV.md) — the chart ships NO
#     default for k8s.proxyImage (environment-specific, required in practice),
#     so this is the ref an operator points `--set k8s.proxyImage=` at once
#     they choose ghcr as their registry, not a value baked into the chart.
#   ghcr.io/cjohnstoniv/agent-claude-code, ghcr.io/cjohnstoniv/agent-codex-cli
#     internal/api/runs_policy.go's agentImage() fallback convention:
#     "ghcr.io/cjohnstoniv/agent-" + ImageKey, and internal/api/harness.go's
#     catalog sets ImageKey "claude-code"/"codex-cli" for exactly these two
#     rows (the aws-sso login-only image ships in the matrix too, but names
#     no --agent a run selects — see harness.go's own doc comment).
#
# ── cosign (keyless) ─────────────────────────────────────────────────────────
# No key material anywhere: `id-token: write` lets the job mint a short-lived
# OIDC token, which cosign exchanges for a Fulcio cert + a Rekor transparency-
# log entry (the standard GitHub-Actions-native keyless recipe) — `cosign
# sign --yes` picks this up automatically from the ambient Actions OIDC env,
# no extra flags. Signs by DIGEST (the build-push step's own `digest` output),
# never by the mutable tag.
#
# WHAT THAT DIGEST NOW IS: with the two-platform `platforms:` list below it is
# the multi-arch INDEX digest, not a single image manifest — so ONE signature
# covers the index, and the per-arch child manifests are NOT individually
# signed. That is the normal multi-arch cosign posture (`cosign verify` on the
# index ref is what a consumer runs), but it is a real change from the
# single-arch shape this file used to have, so RELEASING.md's "Container
# images" section carries the verify command and this caveat in prose.
# `provenance: false` stays: it keeps the index to exactly the two platform
# manifests, with no BuildKit attestation manifests riding along under
# `unknown/unknown` platforms — those would land inside the signed index
# without ever having been reviewed here.
#
# ── SBOM, provenance, release assets ──────────────────────────────────────
# Each pushed digest gets a CycloneDX SBOM scanned from the IMAGE (syft on the
# registry ref, not `syft .` — a source-tree scan sees no OS packages and no
# bundled UI, which is precisely where the copyleft and the CVEs live), attested
# with `cosign attest`, plus actions/attest-build-provenance. The release-assets
# job then puts those SBOMs, the notices and a signed SHA256SUMS ON the Release
# and fails if any did not land.
#
# ── linux/amd64 + linux/arm64 ────────────────────────────────────────────────
# W-DESK S1: an Apple-silicon / arm64 laptop is the desktop tier's ordinary
# hardware (docs/DESKTOP.md), so every published image is a two-platform index.
# How the cost is kept sane: EVERY Go compile stage carries
# `FROM --platform=$BUILDPLATFORM` + `GOARCH=$TARGETARCH`, so the binaries
# cross-compile natively (pure Go, CGO_ENABLED=0) and never run under
# emulation. QEMU below is therefore needed by the RUNTIME stages only — the
# `apt-get`/`npm`/AWS-CLI-installer RUNs in the three agent images, which must
# execute as the target arch. wardynd and wardyn-proxy need none of it: their
# distroless runtime stages are COPY-only.
#
# Every base pin in these Dockerfiles was verified to be a multi-arch INDEX
# digest (not an amd64-only manifest) with `docker buildx imagetools inspect
# --raw` before this list was widened; all eight already carried linux/arm64,
# so no repin was needed. `make lint`'s scripts/check-image-pins.sh still only
# proves a digest EXISTS — it does no network I/O and cannot tell an index from
# a single-arch manifest, so re-check by hand when bumping a base.
#
# ── can this be live-tested? ─────────────────────────────────────────────────
# No. It only runs on a real `vX.Y.Z` tag push against origin, needs GHCR
# `packages: write` + the Actions OIDC token for cosign, and pushes to the
# real ghcr.io/cjohnstoniv namespace — none of that exists in this worktree/
# sandbox. Verified instead by: actionlint (see the lane report), matching
# every `uses:` pin's style/SHA against ci.yml and publish-image.yml
# (identical actions, identical versions, reused rather than re-resolved
# where the same action already appears in this repo), and the image-ref
# parity check above against the actual tree. The image-build steps
# themselves (Dockerfile correctness, GO_BUILD_TAGS=docker,k8s compiling) ARE
# locally verified — see the lane report's gate output.
on:
  push:
    tags: ['v*']
  # Rehearsal. This pipeline could only ever be exercised by tagging, so its bugs
  # were unobservable until a real tag pushed — 0.6.2 shipped images with no
  # provenance (a missing permission scope) and 0.6.3 shipped an SBOM that
  # understated its own contents, both found only after the fact.
  #
  # dry_run builds everything and pushes nothing: no registry write, no signature,
  # no attestation, no Release. It exercises the parts that broke — the build
  # matrix, the SBOM generation and its zero-npm assertion, the CLI cross-builds,
  # the chart package and its version check.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without pushing anything (leave true)"
        type: boolean
        default: true

jobs:
  images:
    name: build, push, sign (${{ matrix.name }})
    runs-on: ubuntu-latest
    # 60, not 30: the three agent rows run their apt-get/npm/installer steps
    # twice, one of those passes under arm64 emulation. A timeout kill here
    # would read as a build break — the one failure a release must not fake.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (Fulcio/Rekor OIDC exchange)
      # attest-build-provenance writes to the repo's attestations API, which is a
      # SEPARATE scope from id-token — without it the action gets far enough to
      # generate the statement and then fails with "Resource not accessible by
      # integration", after the image has already been pushed and signed.
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wardynd
            dockerfile: deploy/compose/Dockerfile.wardynd
            build-args: |
              GO_BUILD_TAGS=docker,k8s
          - name: wardyn-proxy
            dockerfile: deploy/compose/Dockerfile.proxy
            build-args: ""
          # float-latest: "true" on the three agent-* rows below (W30-S1-2).
          # internal/api/runs_policy.go's agentImage() fallback — what a
          # freshly-installed daemon with no WARDYN_AGENT_IMAGES override
          # actually pulls — is ghcr.io/cjohnstoniv/agent-<key>:<version>, the
          # daemon's OWN version.Version (D19), which the semver `:${RELEASE_TAG}`
          # tag every matrix row pushes below satisfies. The extra `:latest`
          # here is the fallback for a build with no version string (agentImageTag
          # returns "latest" only then); pushing it keeps that last-resort tag
          # pullable too. wardynd/wardyn-proxy don't need it: the Helm chart pins
          # their tag to .Chart.AppVersion (the release semver).
          # agent-claude-code is NOT published, deliberately. It bundles Anthropic's
          # Claude Code CLI, which is not open-source: the package declares
          # "SEE LICENSE IN README.md" and neither that file nor a LICENSE ships in
          # the image, so a puller cannot read the terms they would be bound by.
          # Wardyn publishes no image containing a proprietary vendor CLI. The
          # Dockerfile stays as a LOCAL build recipe (`make agent-images`), which is
          # also the honest arrangement: the operator installs that CLI under their
          # own agreement with its vendor. agent-base below is what ships instead.
          #
          # 0.5.0/0.6.0/0.6.1 of agent-claude-code remain on GHCR — retracting them
          # would break existing pulls of already-released versions, and they are
          # documented in deploy/images/THIRD-PARTY-TERMS.md.
          - name: agent-base
            dockerfile: deploy/images/base/Dockerfile
            build-args: ""
            float-latest: "true"
          - name: agent-codex-cli
            dockerfile: deploy/images/codex-cli/Dockerfile
            build-args: ""
            float-latest: "true"
          # W5-S1-3: the guided AWS SSO container login (agentHarnessLogin's
          # awsSSOAgent="aws-sso" row, harnesscred.go) resolves its sandbox
          # image through the SAME agentImage() ghcr.io/cjohnstoniv/agent-<id>
          # convention as claude-code/codex-cli above — without this row that
          # image was never published, so a by-the-book Helm install or
          # run-host.sh deployment 404'd on ImagePullBackOff / pull failure
          # the moment an operator clicked "Log in with AWS SSO".
          - name: agent-aws-sso
            dockerfile: deploy/images/aws-sso/Dockerfile
            build-args: ""
            float-latest: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # binfmt_misc handlers so the agent images' target-arch RUN steps
      # (apt-get / npm / the AWS CLI installer) execute under emulation. The Go
      # compile stages do NOT use this — they cross-compile (see the header).
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: "v2.6.4"
      # Bare semver (v-prefix stripped), matching Chart.yaml's appVersion —
      # same convention publish-image.yml uses for its own tag-triggered
      # publish. Via env, not `${{ }}` inside the script body (this repo's own
      # precedent — ci.yml's screenshots-fresh job, publish-image.yml's
      # "Compute image tags" step).
      - name: Compute the release tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # W30-S1-2: docker/build-push-action's `tags:` accepts a newline-
      # separated list — push the semver tag always, plus `:latest` on the
      # float-latest rows (see the matrix comment above for why). cosign
      # still signs by DIGEST (build.outputs.digest), so floating `:latest`
      # doesn't change what gets signed.
      - name: Compute the image tags
        id: tags
        env:
          IMAGE_NAME: ghcr.io/cjohnstoniv/${{ matrix.name }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          FLOAT_LATEST: ${{ matrix.float-latest }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${RELEASE_TAG}"
            if [ "$FLOAT_LATEST" = "true" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # A dry run builds BOTH platforms and exports nothing. `load: true`
          # cannot work here: the docker exporter refuses a manifest list, which
          # is exactly what a multi-arch build produces. Building without an
          # exporter still validates every Dockerfile and every RUN step, which is
          # what this rehearsal is for.
          push: ${{ inputs.dry_run != true }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.tags.outputs.tags }}
      - name: Sign the pushed image (keyless, by digest)
        if: inputs.dry_run != true
        env:
          IMAGE_REF: ghcr.io/cjohnstoniv/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"
      # A signature proves WHO built the image and says nothing about what is
      # inside it — yet a green cosign verify is routinely read as "supply chain
      # verified". The attestation below is what makes the signature say anything
      # about contents, and it is what an enterprise scanner can actually consume.
      #
      # syft is pointed at the PUSHED DIGEST, not at the source tree. `syft .`
      # (a source-tree scan) describes something nobody can pull: it omits every
      # apt package in the base image and every globally-installed npm CLI, which
      # is exactly where the non-permissive components live.
      - name: SBOM for the pushed digest
        if: inputs.dry_run != true
        env:
          IMAGE_REF: ghcr.io/cjohnstoniv/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          SYFT_VERSION: v1.46.0
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          syft "registry:${IMAGE_REF}" -o cyclonedx-json > "sbom-${{ matrix.name }}.cdx.json"
          # wardynd embeds the console as a Vite bundle, which strips every
          # package.json — so scanning the IMAGE finds zero npm packages however
          # you point it, and the whole frontend dependency tree is invisible.
          # Scanning the image instead of the source tree fixed the OS-package
          # blindness; it did nothing for this. The lockfile is the only place
          # those versions still exist, so merge a lockfile-derived scan in.
          if [ "${{ matrix.name }}" = wardynd ]; then
            syft dir:ui -o cyclonedx-json > ui-sbom.json
            jq -s '.[0].components += [.[1].components[] | select(.purl // "" | startswith("pkg:npm"))] | .[0]' \
              "sbom-${{ matrix.name }}.cdx.json" ui-sbom.json > merged.json
            mv merged.json "sbom-${{ matrix.name }}.cdx.json"
            test "$(jq '[.components[]|select(.purl//""|startswith("pkg:npm"))]|length' "sbom-${{ matrix.name }}.cdx.json")" -gt 0 \
              || { echo "wardynd SBOM still reports zero npm packages after the merge"; exit 1; }
          fi
          # A scan that finds nothing is a scan that ran against the wrong thing.
          test "$(jq '.components | length' "sbom-${{ matrix.name }}.cdx.json")" -gt 0 \
            || { echo "SBOM for ${IMAGE_REF} has zero components — refusing to attest it"; exit 1; }
      - name: Attest the SBOM to the digest
        if: inputs.dry_run != true
        env:
          IMAGE_REF: ghcr.io/cjohnstoniv/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate "sbom-${{ matrix.name }}.cdx.json" "${IMAGE_REF}"
      # Build provenance: how it was built, not merely who signed it. Separate
      # from cosign because this is the format GitHub's own verification consumes.
      - name: Attest build provenance
        if: inputs.dry_run != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/cjohnstoniv/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Upload the SBOM for the release-assets job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json
          if-no-files-found: error

  # Standalone CLI binaries. The images and the chart cover the two install paths,
  # but neither gives you just `wardyn` — for CI, for an air-gapped host, or for
  # anyone who wants the client without the stack. Static (CGO_ENABLED=0) so they
  # run anywhere, and covered by the same signed SHA256SUMS as everything else.
  binaries:
    name: CLI binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          out="wardyn-${GOOS}-${GOARCH}"
          go build -trimpath -o "$out" ./cmd/wardyn
          # A cross-built binary that cannot report its own version is a binary
          # nobody can support. Only checkable natively.
          if [ "$GOOS" = linux ] && [ "$GOARCH" = amd64 ]; then
            "./$out" --version || "./$out" version
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wardyn-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  # The chart, published as an OCI artifact so installing does not require cloning.
  #
  # Until 0.6.2 the images were published and the CHART was not, which made the
  # documented install `git clone && helm install ./deploy/helm/wardyn`. That is a
  # strange asymmetry to hand an operator: the artifacts they run are pullable, but
  # the thing that installs them is not. Helm speaks OCI natively and GHCR hosts
  # charts, so this is a package + push.
  chart:
    name: Publish the Helm chart (OCI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push
        id: push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          # workflow_dispatch runs off a branch, so there is no tag to match; use
          # the chart's own version and let the tag check apply only to real tags.
          if [ "${{ github.ref_type }}" != "tag" ]; then
            ver="$(grep -E '^version:' deploy/helm/wardyn/Chart.yaml | awk '{print $2}')"
          fi
          # The chart's own version must match the tag, or `helm install --version`
          # silently resolves to something other than the release being cut.
          chart_ver="$(grep -E '^version:' deploy/helm/wardyn/Chart.yaml | awk '{print $2}')"
          test "$chart_ver" = "$ver" \
            || { echo "Chart.yaml version=$chart_ver but the tag is $ver — bump it (RELEASING.md step 1b)"; exit 1; }
          helm package deploy/helm/wardyn -d dist/
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry run: packaged dist/wardyn-${ver}.tgz, not pushing"
            exit 0
          fi
          helm push "dist/wardyn-${ver}.tgz" oci://ghcr.io/cjohnstoniv/charts 2>&1 | tee push.log
          echo "digest=$(grep -oE 'sha256:[a-f0-9]{64}' push.log | head -1)" >> "$GITHUB_OUTPUT"
      - name: Sign the chart (keyless, by digest)
        if: inputs.dry_run != true
        run: cosign sign --yes "ghcr.io/cjohnstoniv/charts/wardyn@${{ steps.push.outputs.digest }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error

  # Everything a consumer needs, ON the Release object rather than in a workflow
  # artifact that expires and needs a GitHub login to reach. Before this job,
  # v0.6.1's release assets were empty and v0.6.0's were 13 demo .mp4 files — an
  # enterprise that cannot pull from a public registry had no ingestion path at
  # all, and nobody could verify what they did pull without reading RELEASING.md.
  release-assets:
    name: Release assets (SBOMs, checksums, notices)
    if: inputs.dry_run != true
    needs: [images, chart, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # gh release upload
      id-token: write   # cosign sign-blob (keyless)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3
      - name: Collect the per-image SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "{sbom-*,chart,cli-*}"
          merge-multiple: true
          path: assets
      - name: Assemble the asset set
        run: |
          set -euo pipefail
          cp THIRD-PARTY-NOTICES.md LICENSE NOTICE install.sh assets/
          chmod +x assets/wardyn-* 2>/dev/null || true
          cd assets
          # One SBOM per published image. If the matrix grows and this does not,
          # the count assertion below is what says so.
          want=$(grep -cE '^          - name: [a-z0-9-]+$' ../.github/workflows/release.yml)
          have=$(ls -1 sbom-*.cdx.json | wc -l)
          test "$have" -eq "$want" || { echo "expected $want image SBOMs, found $have"; ls -1; exit 1; }
          sha256sum ./* > SHA256SUMS
      - name: Sign the checksums (keyless)
        working-directory: assets
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS
      - name: Upload to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # RELEASING.md cuts the Release by hand; create a draft if the tag ran
          # ahead of that so the assets are never homeless.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --prerelease --notes-from-tag
          gh release upload "$TAG" assets/* --clobber
      - name: Assert every required asset actually landed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          have=$(gh release view "$TAG" --json assets -q '.assets[].name' | sort)
          for want in SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem THIRD-PARTY-NOTICES.md LICENSE NOTICE \
                      install.sh wardyn-linux-amd64 wardyn-linux-arm64 wardyn-darwin-amd64 wardyn-darwin-arm64; do
            grep -qx "$want" <<<"$have" || { echo "MISSING RELEASE ASSET: $want"; exit 1; }
          done
          echo "$have"
