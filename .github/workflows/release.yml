name: Release images

# Publishes the eight images a Wardyn release actually ships, cosign-signed
# (keyless), plus a signed-release SBOM — on every vX.Y.Z tag push
# (RELEASING.md's tagging convention). This is the "release" half of image
# publishing; .github/workflows/publish-image.yml remains the CONTINUOUS half
# (wardynd only, :latest + :sha-<commit> after CI passes on main) — the two no
# longer overlap: publish-image.yml's own tags trigger was removed in the same
# change that added this file (a v* push used to fire BOTH workflows, racing
# to push the identical wardynd:X.Y.Z ref, one signed one not — see that
# file's header for the current split).
#
# ── the eight images, and why each ref is what it is (verified against the
#    tree, not assumed) ──────────────────────────────────────────────────────
#   ghcr.io/cjohnstoniv/wardynd
#     deploy/helm/wardyn/values.yaml's `image.repository` default (line ~16)
#     — the chart's `image.tag: ""` resolves to `.Chart.AppVersion`, so a
#     release tag vX.Y.Z landing here as the bare "X.Y.Z" is what makes a
#     freshly-cut chart of the same version resolve to a real, pullable image
#     instead of ImagePullBackOff. Built with GO_BUILD_TAGS=docker,k8s (both
#     runner substrates compiled in — deploy/compose/Dockerfile.wardynd's own
#     new default, passed explicitly here for the record) so the SAME
#     published image serves the compose demo AND the Helm chart.
#   ghcr.io/cjohnstoniv/wardynd-fips
#     the same recipe with GOFIPS140 pinned to a frozen Go Cryptographic Module
#     snapshot (an extra image, so the default one is unchanged). The `images`
#     job reads the snapshot back out of the pushed digest before signing it.
#   ghcr.io/cjohnstoniv/wardyn-proxy
#     matches deploy/helm/wardyn/README.md's "Kubernetes runner substrate"
#     worked example (`--set k8s.proxyImage="$REGISTRY/wardyn-proxy:$TAG"`)
#     and WARDYN_PROXY_IMAGE's naming (docs/ENV.md) — the chart ships NO
#     default for k8s.proxyImage (environment-specific, required in practice),
#     so this is the ref an operator points `--set k8s.proxyImage=` at once
#     they choose ghcr as their registry, not a value baked into the chart.
#   ghcr.io/cjohnstoniv/agent-base, ghcr.io/cjohnstoniv/agent-codex-cli
#     internal/api/runs_policy.go's agentImage() fallback convention:
#     "ghcr.io/cjohnstoniv/agent-" + ImageKey, and internal/api/harness.go's
#     catalog sets ImageKey "claude-code"/"codex-cli" for exactly these two
#     rows (the aws-sso login-only image ships in the matrix too, but names
#     no --agent a run selects — see harness.go's own doc comment).
#   ghcr.io/cjohnstoniv/agent-vscode, ghcr.io/cjohnstoniv/agent-novnc
#     the UI-sandbox relay's two `ui_apps` (internal/api/uigateway.go) — NOT
#     resolved by agentImage()'s automatic convention like the two rows above;
#     a run reaches them only via an explicit `ui_apps` image ref or a
#     WARDYN_AGENT_IMAGES override (deploy/images/vscode and novnc's own
#     Dockerfile headers). Both build FROM the agent-base image THIS SAME
#     workflow run just pushed, at the identical release tag — never from the
#     unpublished agent-claude-code, which is the whole point of #140/#141:
#     LICENSING.md's claim that no published image bundles the vendor CLI
#     depends on that. See the images-ui-sandbox job below for why that
#     dependency needs its own job rather than two more rows here.
#
# ── cosign (keyless) ─────────────────────────────────────────────────────────
# No key material anywhere: `id-token: write` lets the job mint a short-lived
# OIDC token, which cosign exchanges for a Fulcio cert + a Rekor transparency-
# log entry (the standard GitHub-Actions-native keyless recipe) — `cosign
# sign --yes` picks this up automatically from the ambient Actions OIDC env,
# no extra flags. Signs by DIGEST (the build-push step's own `digest` output),
# never by the mutable tag.
#
# WHAT THAT DIGEST NOW IS: with the two-platform `platforms:` list below it is
# the multi-arch INDEX digest, not a single image manifest — so ONE signature
# covers the index, and the per-arch child manifests are NOT individually
# signed. That is the normal multi-arch cosign posture (`cosign verify` on the
# index ref is what a consumer runs), but it is a real change from the
# single-arch shape this file used to have, so RELEASING.md's "Container
# images" section carries the verify command and this caveat in prose.
# `provenance: false` stays: it keeps the index to exactly the two platform
# manifests, with no BuildKit attestation manifests riding along under
# `unknown/unknown` platforms — those would land inside the signed index
# without ever having been reviewed here.
#
# ── SBOM, provenance, release assets ──────────────────────────────────────
# Each pushed digest gets a CycloneDX SBOM scanned from the IMAGE (syft on the
# registry ref, not `syft .` — a source-tree scan sees no OS packages and no
# bundled UI, which is precisely where the copyleft and the CVEs live), attested
# with `cosign attest`, plus actions/attest-build-provenance. The release-assets
# job then puts those SBOMs, the notices and a signed SHA256SUMS ON the Release
# and fails if any did not land.
#
# ── linux/amd64 + linux/arm64 ────────────────────────────────────────────────
# W-DESK S1: an Apple-silicon / arm64 laptop is the desktop tier's ordinary
# hardware (docs/DESKTOP.md), so every published image is a two-platform index.
# How the cost is kept sane: EVERY Go compile stage carries
# `FROM --platform=$BUILDPLATFORM` + `GOARCH=$TARGETARCH`, so the binaries
# cross-compile natively (pure Go, CGO_ENABLED=0) and never run under
# emulation. QEMU below is therefore needed by the RUNTIME stages only — the
# `apt-get`/`npm`/AWS-CLI-installer RUNs in the three agent images, which must
# execute as the target arch. wardynd and wardyn-proxy need none of it: their
# distroless runtime stages are COPY-only.
#
# Every base pin in these Dockerfiles was verified to be a multi-arch INDEX
# digest (not an amd64-only manifest) with `docker buildx imagetools inspect
# --raw` before this list was widened; all eight already carried linux/arm64,
# so no repin was needed. `make lint`'s scripts/check-image-pins.sh still only
# proves a digest EXISTS — it does no network I/O and cannot tell an index from
# a single-arch manifest, so re-check by hand when bumping a base.
#
# ── can this be live-tested? ─────────────────────────────────────────────────
# No. It only runs on a real `vX.Y.Z` tag push against origin, needs GHCR
# `packages: write` + the Actions OIDC token for cosign, and pushes to the
# real ghcr.io/cjohnstoniv namespace — none of that exists in this worktree/
# sandbox. Verified instead by: actionlint (see the lane report), matching
# every `uses:` pin's style/SHA against ci.yml and publish-image.yml
# (identical actions, identical versions, reused rather than re-resolved
# where the same action already appears in this repo), and the image-ref
# parity check above against the actual tree. The image-build steps
# themselves (Dockerfile correctness, GO_BUILD_TAGS=docker,k8s compiling) ARE
# locally verified — see the lane report's gate output.
# ── build once, promote ──────────────────────────────────────────────────────
# A workflow_dispatch with `path: promote` publishes without rebuilding. The
# images were built once, by the candidate's nightly (nightly.yml, dispatched on
# the candidate's branch), which pushed them to the public
# ghcr.io/cjohnstoniv/staging/<image>:run-<nightly run id>. The `promote` job
# copies those exact digests to the release tags, then signs, scans and attests
# them under this workflow's identity. A tag push still takes the build path
# (the `images` and `images-ui-sandbox` jobs) until R9 flips the default in
# preflight-green's `path` step.
#
# Where the digest comes from. preflight-green resolves
# staging/<image>:run-<nightly_run> to its index digest, for every row of the
# `promote` matrix, and passes the {image: digest} map on as the `digests`
# output. nightly_run is the run scripts/green-by-tree.sh selected.
#
# The proof that a digest was built from the tagged tree has three parts, all in
# preflight-green:
#   1. green-by-tree.sh selected nightly run R at commit C, and the tree of C
#      equals the tag's tree, so the Dockerfiles and the nightly.yml that ran are
#      the tag's own.
#   2. `gh attestation verify` on the staged digest, with --signer-workflow
#      nightly.yml and --source-digest C: GitHub-signed provenance that
#      nightly.yml at C built that digest.
#   3. The image's org.opencontainers.image.revision label equals C. This is a
#      cross-check only: a label is self-asserted and proves nothing alone.
# Staging older than 24 hours is refused, because a fresh build carries Debian
# fixes that a stale one lacks.
#
# Fallback. If promotion cannot be used, dispatch this workflow on the tag with
# `path: build` and dry_run false: it rebuilds at the tag as before. The CLI
# binaries and the chart are built here on both paths. Promote is idempotent, so
# a failed job can simply be re-run.
#
on:
  push:
    tags: ['v*']
  # Rehearsal. This pipeline could only ever be exercised by tagging, so its bugs
  # were unobservable until a real tag pushed — 0.6.2 shipped images with no
  # provenance (a missing permission scope) and 0.6.3 shipped an SBOM that
  # understated its own contents, both found only after the fact.
  #
  # dry_run builds everything and pushes nothing: no registry write, no signature,
  # no attestation, no Release. It exercises the parts that broke — the build
  # matrix, the SBOM generation and its zero-npm assertion, the CLI cross-builds,
  # the chart package and its version check.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without pushing anything (leave true)"
        type: boolean
        default: true
      path:
        description: "promote = copy the digests the candidate's nightly built (R4); build = rebuild at the tag"
        type: choice
        options: [build, promote]
        default: build

jobs:
  # The gate on a release: the tag's TREE must be green, by CI and by the
  # nightly. T-06 (#666) added it because nothing asked "is the commit this tag
  # points at actually green" — a tag can be pushed on any commit, including one
  # CI never ran on or one whose nightly has never gone green.
  #
  # Evidence is keyed by tree, not by commit (#1461). In 0.8.2 the nightly
  # passed on one sha, then release/0.8 got a different sha for the same tree
  # after a merge, and the exact-sha rule forced a second nightly (about 20
  # minutes). Now ci.yml uploads a ci-full-tree-<tree> marker holding the tree it
  # tested, and a run counts when its marker names the tag's tree: a pull
  # request's run qualifies a commit it never saw, because the marker records
  # the merge commit's tree, which the run API does not show. The run's own head
  # tree must match too, so a PR counts only when its merge left the tree equal
  # to its head; that fails closed. scripts/green-by-tree.sh holds the rules and
  # is the same command the release runs by hand.
  #
  # R2-1's rule survives: an IDENTICAL tree only, never an ancestor's. An
  # ancestor walk could pick a stale run from days earlier, silently passing a
  # tag whose cherry-picks it never saw. The nightly must be a workflow_dispatch
  # run: a scheduled one skips the staging matrix and never qualifies a tree.
  # The NEWEST such run decides (cancelled ones skipped): a red newest run is
  # not rescued by an older green one, so re-dispatching is the recovery.
  #
  # The script reads branch protection's LIVE required_status_checks.contexts
  # (the one list RELEASING.md's own PATCH configures, never a second typed
  # copy) and the watched= list below. Skipped only when this is an explicit
  # dry-run rehearsal (`inputs.dry_run == true`) — a real tag push has no
  # `inputs` at all, and a workflow_dispatch with `dry_run: false` is a real
  # publish, so keying the skip on the event name instead of the flag would have
  # let that path through with no gate at all.
  preflight-green:
    name: Preflight — required contexts + newest dispatched nightly green on the tag's tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read # the staged digests are read from ghcr.io/cjohnstoniv/staging
      attestations: read # gh attestation verify lists the nightly's build provenance
    outputs:
      path: ${{ steps.path.outputs.path }}
      tree: ${{ steps.green.outputs.tree }}
      ci_run: ${{ steps.green.outputs.ci_run }}
      nightly_run: ${{ steps.green.outputs.nightly_run }}
      nightly_sha: ${{ steps.green.outputs.nightly_sha }}
      digests: ${{ steps.staging.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Which publish path runs: build rebuilds the images at the tag, promote
      # copies the digests the candidate's nightly staged. Only a dispatch can
      # ask for promote; a tag push is always build. R9 changes the push
      # default here and only here.
      - id: path
        name: Choose the publish path
        env:
          EVENT_NAME: ${{ github.event_name }}
          PATH_INPUT: ${{ inputs.path }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$PATH_INPUT" = promote ]; then
            echo "path=promote" >> "$GITHUB_OUTPUT"
          else
            echo "path=build" >> "$GITHUB_OUTPUT"
          fi
      # The nightly RUN's own conclusion is never success: e2e-live (known-fail,
      # #965 + the OIDC-flow issue nightly.yml's own comment names) and
      # migration-merge-check (red by design, scripts/test-repo-guards.sh's
      # guard 1 comment) are red on purpose and carry no error-tolerant step
      # override. So the script judges the WATCHED jobs individually instead of
      # the run's conclusion. The list must stay identical to nightly.yml's
      # notify-new-lanes.needs (the set nightly.yml itself treats as "no
      # characterised noise"), which already excludes both of those by name:
      # test-repo-guards.sh's guard 13 fails the build if the two drift.
      # buildx-smoke is not on the list: it is a matrix job whose API job name
      # is "multi-arch build (<matrix.name>)" (nightly.yml), never the literal
      # YAML key, so the script matches that prefix instead.
      # daemon-proxy-secret-kind (T-59, #719), provider-subscription-docker-pg
      # (T-17, #677) and managed-settings-drift (#1395) each joined after a
      # green hosted run (see nightly.yml's own comment on each job).
      - id: green
        name: The tag's tree must be green by CI and by a dispatched nightly
        if: inputs.dry_run != true || steps.path.outputs.path == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          watched="task-e2e-live ssh-e2e-live test-drive ci-mode-dogfood docker-tagged-live byoi-e2e-live ui-sandbox-e2e-live kind-sso-walk kek-conformance fuzz gvisor-cc2-live kind-sso-ado-walk compose-sso-roles daemon-proxy-secret-kind provider-subscription-docker-pg managed-settings-drift"
          need=0
          if [ "${{ steps.path.outputs.path }}" = promote ]; then need=1; fi
          WATCHED="$watched" NEED_STAGING="$need" ./scripts/green-by-tree.sh "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Rehearsal — dry_run skips the preflight (no real release contract to check)
        if: inputs.dry_run == true && steps.path.outputs.path != 'promote'
        run: |
          echo "workflow_dispatch dry_run=true rehearsal: preflight-green's checks apply only to a real vX.Y.Z tag push, or a workflow_dispatch with dry_run=false."
      - if: steps.path.outputs.path == 'promote'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The staged digests are the release, so each is proved before anything is
      # copied: it resolves to an index digest, its revision label names the
      # nightly's commit, and GitHub's signed provenance says nightly.yml at
      # that commit built it (a label alone is self-asserted). The tree check
      # above ties that commit to the tag. A dry run does all of this too: only
      # the copy, the signing and the attestations are skipped.
      - id: staging
        name: Resolve and verify the staged digests
        if: steps.path.outputs.path == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_RUN: ${{ steps.green.outputs.nightly_run }}
          NIGHTLY_SHA: ${{ steps.green.outputs.nightly_sha }}
        run: |
          set -euo pipefail
          # A fresh build carries Debian fixes that a stale one lacks. The age is the
          # run's created_at: updated_at moves on `gh run rerun --failed`, which
          # keeps the image jobs it did not rerun.
          created="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${NIGHTLY_RUN}" --jq .created_at)"
          age=$(( $(date +%s) - $(date -d "${created}" +%s) ))
          if [ "${age}" -gt 86400 ]; then
            echo "nightly run ${NIGHTLY_RUN} was created ${created}, more than 24 hours ago: dispatch a fresh nightly on the candidate"
            exit 1
          fi
          digests='{}'
          for name in $(yq -r '.jobs.promote.strategy.matrix.include[].name' .github/workflows/release.yml); do
            tagref="ghcr.io/cjohnstoniv/staging/${name}:run-${NIGHTLY_RUN}"
            digest="$(docker buildx imagetools inspect "${tagref}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "${tagref} did not resolve to an index digest (got '${digest}')"
              exit 1
            fi
            ref="ghcr.io/cjohnstoniv/staging/${name}@${digest}"
            labels="$(docker buildx imagetools inspect "${ref}" --format '{{json (index .Image "linux/amd64").Config.Labels}}')"
            revision="$(jq -r '.["org.opencontainers.image.revision"] // ""' <<<"${labels}")"
            if [ "${revision}" != "${NIGHTLY_SHA}" ]; then
              echo "${ref}: revision label is '${revision}', expected the nightly's commit ${NIGHTLY_SHA}"
              exit 1
            fi
            gh attestation verify "oci://${ref}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/nightly.yml" \
              --source-digest "${NIGHTLY_SHA}"
            digests="$(jq -c --arg n "${name}" --arg d "${digest}" '. + {($n): $d}' <<<"${digests}")"
            echo "verified ${name} ${digest}"
          done
          echo "digests=${digests}" >> "$GITHUB_OUTPUT"

  images:
    name: build, push, sign (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: preflight-green
    if: needs.preflight-green.outputs.path == 'build'
    # 60, not 30: the three agent rows run their apt-get/npm/installer steps
    # twice, one of those passes under arm64 emulation. A timeout kill here
    # would read as a build break — the one failure a release must not fake.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (Fulcio/Rekor OIDC exchange)
      # attest-build-provenance writes to the repo's attestations API, which is a
      # SEPARATE scope from id-token — without it the action gets far enough to
      # generate the statement and then fails with "Resource not accessible by
      # integration", after the image has already been pushed and signed.
      attestations: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wardynd
            dockerfile: deploy/compose/Dockerfile.wardynd
            # RELEASE_BUILD=true stamps version.releaseBuild (internal/version)
            # via the Dockerfile's own -ldflags -X, so the wardynd baked into this
            # image reports the bare release, not `<version>+<commit>` — this job
            # only runs from a `v*` tag push or a manual dispatch (see this
            # workflow's `on:`), never from publish-image.yml's per-commit build.
            build-args: |
              GO_BUILD_TAGS=docker,k8s
              RELEASE_BUILD=true
          # wardynd with the Go Cryptographic Module pinned to the frozen
          # snapshot CMVP certificate #5247 covers (docs/operations/secrets-and-keys.md).
          # Same recipe, so same build-args as nightly.yml's staged row
          # (test-repo-guards.sh guard 16); the pin lives only in these two rows.
          - name: wardynd-fips
            dockerfile: deploy/compose/Dockerfile.wardynd
            build-args: |
              GO_BUILD_TAGS=docker,k8s
              RELEASE_BUILD=true
              GOFIPS140=v1.0.0-c2097c7c
          - name: wardyn-proxy
            dockerfile: deploy/compose/Dockerfile.proxy
            build-args: ""
          # float-latest: "true" on the three agent-* rows below (W30-S1-2).
          # internal/api/runs_policy.go's agentImage() fallback — what a
          # freshly-installed daemon with no WARDYN_AGENT_IMAGES override
          # actually pulls — is ghcr.io/cjohnstoniv/agent-<key>:<version>, the
          # daemon's OWN version.Version (D19), which the semver `:${RELEASE_TAG}`
          # tag every matrix row pushes below satisfies. The extra `:latest`
          # here is the fallback for a build with no version string (agentImageTag
          # returns "latest" only then); pushing it keeps that last-resort tag
          # pullable too. wardynd/wardyn-proxy don't need it: the Helm chart pins
          # their tag to .Chart.AppVersion (the release semver).
          # agent-claude-code is NOT published, deliberately. It bundles Anthropic's
          # Claude Code CLI, which is not open-source: the package declares
          # "SEE LICENSE IN README.md" and neither that file nor a LICENSE ships in
          # the image, so a puller cannot read the terms they would be bound by.
          # Wardyn publishes no image containing a proprietary vendor CLI. The
          # Dockerfile stays as a LOCAL build recipe (`make agent-images`), which is
          # also the honest arrangement: the operator installs that CLI under their
          # own agreement with its vendor. agent-base below is what ships instead.
          #
          # 0.5.0 and 0.6.0 of agent-claude-code were published and later removed
          # from GHCR (2026-08-30) — 0.6.1 was NEVER published, and this comment
          # once claimed it was. The corresponding-source offer for copies pulled
          # before removal is retained in deploy/images/THIRD-PARTY-GPL.md, and
          # the vendor terms stay documented in deploy/images/THIRD-PARTY-TERMS.md.
          - name: agent-base
            dockerfile: deploy/images/base/Dockerfile
            build-args: ""
            float-latest: "true"
          # build-args stays empty on purpose: the @openai/codex version this
          # published image ships is pinned by the Dockerfile's own
          # CODEX_VERSION ARG default (like CLAUDE_CODE_VERSION and
          # AWS_CLI_VERSION in the sibling images), so the pin lives with the
          # recipe and a release build cannot silently float past it. Bumping
          # it here instead would leave every LOCAL `make agent-images-core`
          # build on a different agent version than the released image.
          - name: agent-codex-cli
            dockerfile: deploy/images/codex-cli/Dockerfile
            build-args: ""
            float-latest: "true"
          # W5-S1-3: the guided AWS SSO container login (agentHarnessLogin's
          # awsSSOAgent="aws-sso" row, harnesscred.go) resolves its sandbox
          # image through the SAME agentImage() ghcr.io/cjohnstoniv/agent-<id>
          # convention as claude-code/codex-cli above — without this row that
          # image was never published, so a by-the-book Helm install or
          # run-host.sh deployment 404'd on ImagePullBackOff / pull failure
          # the moment an operator clicked "Log in with AWS SSO".
          - name: agent-aws-sso
            dockerfile: deploy/images/aws-sso/Dockerfile
            build-args: ""
            float-latest: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # binfmt_misc handlers so the agent images' target-arch RUN steps
      # (apt-get / npm / the AWS CLI installer) execute under emulation. The Go
      # compile stages do NOT use this — they cross-compile (see the header).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub (skipped when the secret is absent, e.g. a fork)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.4"
      # Bare semver (v-prefix stripped), matching Chart.yaml's appVersion —
      # same convention publish-image.yml uses for its own tag-triggered
      # publish. Via env, not `${{ }}` inside the script body (this repo's own
      # precedent — publish-image.yml's "Compute image tags" step).
      - name: Compute the release tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # W30-S1-2: docker/build-push-action's `tags:` accepts a newline-
      # separated list — push the semver tag always, plus `:latest` on the
      # float-latest rows (see the matrix comment above for why). cosign
      # still signs by DIGEST (build.outputs.digest), so floating `:latest`
      # doesn't change what gets signed.
      - name: Compute the image tags
        id: tags
        env:
          IMAGE_NAME: ghcr.io/cjohnstoniv/${{ matrix.name }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          FLOAT_LATEST: ${{ matrix.float-latest }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${RELEASE_TAG}"
            if [ "$FLOAT_LATEST" = "true" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # A dry run builds BOTH platforms and exports nothing. `load: true`
          # cannot work here: the docker exporter refuses a manifest list, which
          # is exactly what a multi-arch build produces. Building without an
          # exporter still validates every Dockerfile and every RUN step, which is
          # what this rehearsal is for.
          push: ${{ inputs.dry_run != true }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.tags.outputs.tags }}
      # What a -fips tag claims is checked on the pushed digest, before it is
      # signed: its binary must be built against the pinned module snapshot, on
      # both platforms. The Dockerfile checks the same line at build time, which
      # is all a dry run (nothing pushed) can reach. Gated on the exit code.
      - name: Assert the pushed digest carries the pinned GOFIPS140 snapshot
        if: inputs.dry_run != true && contains(matrix.build-args, 'GOFIPS140=')
        env:
          BUILD_ARGS: ${{ matrix.build-args }}
          IMAGE_REF: ghcr.io/cjohnstoniv/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^GOFIPS140=//p' <<<"$BUILD_ARGS")"
          test -n "$pin"
          ./scripts/check-fips-image.sh "$IMAGE_REF" "$pin"
      - name: Sign the pushed image (keyless, by digest)
        if: inputs.dry_run != true
        env:
          IMAGE_REF: ghcr.io/cjohnstoniv/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"
      # A signature proves WHO built the image and says nothing about what is
      # inside it — yet a green cosign verify is routinely read as "supply chain
      # verified". The attestation below is what makes the signature say anything
      # about contents, and it is what an enterprise scanner can actually consume.
      #
      # syft is pointed at the PUSHED DIGEST, not at the source tree. `syft .`
      # (a source-tree scan) describes something nobody can pull: it omits every
      # apt package in the base image and every globally-installed npm CLI, which
      # is exactly where the non-permissive components live.
      - name: SBOM for the pushed digest
        env:
          IMAGE_REF: ghcr.io/cjohnstoniv/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          SYFT_VERSION: v1.46.0
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            # Nothing was pushed, so there is no digest to scan. The UI-lockfile
            # half needs no image and is the half that shipped broken, so a dry
            # run still exercises it and its assertion.
            if [[ "${{ matrix.name }}" == wardynd* ]]; then
              syft dir:ui -o cyclonedx-json > ui-sbom.json
              n=$(jq '[.components[]|select(.purl//""|startswith("pkg:npm"))]|length' ui-sbom.json)
              test "$n" -gt 0 || { echo "dry run: syft dir:ui found zero npm packages"; exit 1; }
              echo "dry run: ui lockfile scan found $n npm packages"
            fi
            echo '{"components":[]}' > "sbom-${{ matrix.name }}.cdx.json"
            exit 0
          fi
          syft "registry:${IMAGE_REF}" -o cyclonedx-json > "sbom-${{ matrix.name }}.cdx.json"
          # wardynd embeds the console as a Vite bundle, which strips every
          # package.json — so scanning the IMAGE finds zero npm packages however
          # you point it, and the whole frontend dependency tree is invisible.
          # Scanning the image instead of the source tree fixed the OS-package
          # blindness; it did nothing for this. The lockfile is the only place
          # those versions still exist, so merge a lockfile-derived scan in.
          if [[ "${{ matrix.name }}" == wardynd* ]]; then
            syft dir:ui -o cyclonedx-json > ui-sbom.json
            jq -s '.[0].components += [.[1].components[] | select(.purl // "" | startswith("pkg:npm"))] | .[0]' \
              "sbom-${{ matrix.name }}.cdx.json" ui-sbom.json > merged.json
            mv merged.json "sbom-${{ matrix.name }}.cdx.json"
            test "$(jq '[.components[]|select(.purl//""|startswith("pkg:npm"))]|length' "sbom-${{ matrix.name }}.cdx.json")" -gt 0 \
              || { echo "wardynd SBOM still reports zero npm packages after the merge"; exit 1; }
          fi
          # A scan that finds nothing is a scan that ran against the wrong thing.
          test "$(jq '.components | length' "sbom-${{ matrix.name }}.cdx.json")" -gt 0 \
            || { echo "SBOM for ${IMAGE_REF} has zero components — refusing to attest it"; exit 1; }
      - name: Attest the SBOM to the digest
        if: inputs.dry_run != true
        env:
          IMAGE_REF: ghcr.io/cjohnstoniv/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate "sbom-${{ matrix.name }}.cdx.json" "${IMAGE_REF}"
      # Build provenance: how it was built, not merely who signed it. Separate
      # from cosign because this is the format GitHub's own verification consumes.
      - name: Attest build provenance
        if: inputs.dry_run != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/cjohnstoniv/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Upload the SBOM for the release-assets job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json
          if-no-files-found: error

  # The vscode/novnc UI-sandbox images (agent-vscode, agent-novnc, #141). Not
  # two more rows on `images` above: both build-args need the agent-base ref
  # THAT job just pushed, and a matrix row cannot `needs:` a sibling row in the
  # same job — GitHub Actions has no per-row ordering, only per-job. So this
  # job carries `needs: images` and waits for the whole matrix above (there is
  # no way to wait on agent-base alone; wardynd/wardyn-proxy/agent-codex-cli/
  # agent-aws-sso finish alongside it).
  #
  # BASE_IMAGE, on a real tag push, is the JUST-PUSHED ghcr ref at the SAME
  # release tag — not `:local` (nothing `images` built is loaded into this
  # job's runner; separate jobs are separate VMs with no shared docker
  # daemon), and not agent-base's own `:latest` float there, because pinning
  # the exact tag means a real vscode/novnc pull can never silently resolve
  # an OLDER agent-base than the one this release actually cut.
  #
  # Under `workflow_dispatch -f dry_run=true`, though, `images` above pushes
  # nothing (`push: false`), so the exact-tag ref never exists to pull — a
  # dispatch off a branch has no `agent-base:<branch-name>` and a dispatch off
  # an existing release tag still has no ref for a tag this job predates. The
  # "Compute the base-image ref" step below switches to agent-base's real,
  # always-pullable `:latest` float ONLY under dry_run, so the rehearsal
  # actually builds these two images end to end instead of failing at the
  # FROM pull; it does not thereby prove the exact-tag pin itself, which only
  # a real tag push exercises.
  images-ui-sandbox:
    name: build, push, sign (${{ matrix.name }})
    needs: [preflight-green, images]
    if: needs.preflight-green.outputs.path == 'build'
    runs-on: ubuntu-latest
    # Same 60-minute floor as `images`, for the same reason (novnc alone is
    # 1.22 GB across two platforms, one pass under arm64 emulation).
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (Fulcio/Rekor OIDC exchange)
      attestations: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-vscode
            dockerfile: deploy/images/vscode/Dockerfile
          - name: agent-novnc
            dockerfile: deploy/images/novnc/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # binfmt_misc handlers — see the `images` job's identical step for why.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub (skipped when the secret is absent, e.g. a fork)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.4"
      # Recomputed independently of the `images` job's own "Compute the release
      # tag" step: jobs run on separate VMs with no shared state except explicit
      # `needs:` outputs, and this value is pure function of github.ref_name, so
      # recomputing it here is simpler than wiring a cross-job output for it.
      - name: Compute the release tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Compute the image tags
        id: tags
        env:
          IMAGE_NAME: ghcr.io/cjohnstoniv/${{ matrix.name }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: echo "tags=${IMAGE_NAME}:${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      # See the job comment above: the exact release tag only exists to pull
      # once `images` has actually pushed it, which a dry run never does.
      - name: Compute the base-image ref
        id: base
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "ref=ghcr.io/cjohnstoniv/agent-base:latest" >> "$GITHUB_OUTPUT"
          else
            echo "ref=ghcr.io/cjohnstoniv/agent-base:${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ inputs.dry_run != true }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
          tags: ${{ steps.tags.outputs.tags }}
      - name: Sign the pushed image (keyless, by digest)
        if: inputs.dry_run != true
        env:
          IMAGE_REF: ghcr.io/cjohnstoniv/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"
      - name: SBOM for the pushed digest
        env:
          IMAGE_REF: ghcr.io/cjohnstoniv/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          SYFT_VERSION: v1.46.0
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            # Nothing was pushed, so there is no digest to scan — see the job
            # comment above for why a dry run off a branch cannot get further
            # than this stub for these two rows.
            echo '{"components":[]}' > "sbom-${{ matrix.name }}.cdx.json"
            exit 0
          fi
          syft "registry:${IMAGE_REF}" -o cyclonedx-json > "sbom-${{ matrix.name }}.cdx.json"
          # A scan that finds nothing is a scan that ran against the wrong thing.
          test "$(jq '.components | length' "sbom-${{ matrix.name }}.cdx.json")" -gt 0 \
            || { echo "SBOM for ${IMAGE_REF} has zero components — refusing to attest it"; exit 1; }
      - name: Attest the SBOM to the digest
        if: inputs.dry_run != true
        env:
          IMAGE_REF: ghcr.io/cjohnstoniv/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate "sbom-${{ matrix.name }}.cdx.json" "${IMAGE_REF}"
      - name: Attest build provenance
        if: inputs.dry_run != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/cjohnstoniv/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Upload the SBOM for the release-assets job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json
          if-no-files-found: error

  # The promote path: no build. preflight-green resolved and verified the digests
  # the candidate's nightly staged (see "build once, promote" in the header), and
  # this job copies each one to the release tags, then signs, scans and attests
  # that same digest under this workflow's own identity, so verify-release.sh and
  # docs/VERIFY.md see no difference from the build path.
  promote:
    name: promote, sign (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: preflight-green
    if: needs.preflight-green.outputs.path == 'promote'
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (Fulcio/Rekor OIDC exchange)
      attestations: write
    env:
      DIGEST: ${{ fromJSON(needs.preflight-green.outputs.digests)[matrix.name] }}
    strategy:
      fail-fast: false
      matrix:
        # The same eight rows as `images` and `images-ui-sandbox`. `dockerfile` is
        # the recipe nightly built, read by check-image-pins.sh,
        # gpl-source-offer.sh and guard 16; this job never builds it. The
        # wardynd-fips digest was checked for its GOFIPS140 snapshot in nightly's
        # staging job, and preflight-green proves that run built it.
        include:
          - name: wardynd
            dockerfile: deploy/compose/Dockerfile.wardynd
          - name: wardynd-fips
            dockerfile: deploy/compose/Dockerfile.wardynd
          - name: wardyn-proxy
            dockerfile: deploy/compose/Dockerfile.proxy
          - name: agent-base
            dockerfile: deploy/images/base/Dockerfile
            float-latest: "true"
          - name: agent-codex-cli
            dockerfile: deploy/images/codex-cli/Dockerfile
            float-latest: "true"
          - name: agent-aws-sso
            dockerfile: deploy/images/aws-sso/Dockerfile
            float-latest: "true"
          - name: agent-vscode
            dockerfile: deploy/images/vscode/Dockerfile
          - name: agent-novnc
            dockerfile: deploy/images/novnc/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # An empty or malformed DIGEST would make every later step fail on a ref
      # that no longer names a digest; fail here, by name, instead.
      - name: Check the staged digest
        env:
          NAME: ${{ matrix.name }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "preflight-green passed no valid staged digest for ${NAME} (got '${DIGEST}')"
            exit 1
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.4"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute the release tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # `:latest` moves only for a final release on a float-latest row: a
      # prerelease (a tag holding `-`) never takes it.
      - name: Compute the image tags
        id: tags
        env:
          IMAGE_NAME: ghcr.io/cjohnstoniv/${{ matrix.name }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          FLOAT_LATEST: ${{ matrix.float-latest }}
        run: |
          latest=0
          if [ "$FLOAT_LATEST" = "true" ]; then
            case "$RELEASE_TAG" in *-*) ;; *) latest=1 ;; esac
          fi
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${RELEASE_TAG}"
            if [ "$latest" = 1 ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # A copy moves the manifest bytes as they are, so the digest cannot change;
      # the check after each copy is what proves it did not. --force is needed
      # because cosign copy refuses to move a tag that already holds a different
      # digest, and :latest already exists on the three float-latest rows. It is
      # safe: staging is unsigned (nightly.yml signs nothing there), so there is
      # no release signature on the source for it to overwrite, and the equality
      # check below proves the tag ended up on $DIGEST.
      - name: Copy the verified digest to the release tags (no rebuild)
        if: inputs.dry_run != true
        env:
          NAME: ${{ matrix.name }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            cosign copy --force "ghcr.io/cjohnstoniv/staging/${NAME}@${DIGEST}" "$tag"
            got="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            test "$got" = "$DIGEST" || { echo "$tag is $got after the copy, expected $DIGEST"; exit 1; }
            echo "copied $tag -> $DIGEST"
          done <<<"$TAGS"
      - name: Sign the promoted image (keyless, by digest)
        if: inputs.dry_run != true
        env:
          IMAGE_REF: ghcr.io/cjohnstoniv/${{ matrix.name }}@${{ env.DIGEST }}
        run: cosign sign --yes "${IMAGE_REF}"
      # Scans the staged copy of the digest being promoted: the same bytes as the
      # release tags, and readable in a dry run, where nothing is copied.
      - name: SBOM for the promoted digest
        env:
          IMAGE_REF: registry:ghcr.io/cjohnstoniv/staging/${{ matrix.name }}@${{ env.DIGEST }}
          SYFT_VERSION: v1.46.0
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          syft "${IMAGE_REF}" -o cyclonedx-json > "sbom-${{ matrix.name }}.cdx.json"
          # wardynd embeds the console as a Vite bundle, which strips every
          # package.json, so the lockfile scan is merged in (see the `images` job).
          if [[ "${{ matrix.name }}" == wardynd* ]]; then
            syft dir:ui -o cyclonedx-json > ui-sbom.json
            jq -s '.[0].components += [.[1].components[] | select(.purl // "" | startswith("pkg:npm"))] | .[0]' \
              "sbom-${{ matrix.name }}.cdx.json" ui-sbom.json > merged.json
            mv merged.json "sbom-${{ matrix.name }}.cdx.json"
            test "$(jq '[.components[]|select(.purl//""|startswith("pkg:npm"))]|length' "sbom-${{ matrix.name }}.cdx.json")" -gt 0 \
              || { echo "wardynd SBOM still reports zero npm packages after the merge"; exit 1; }
          fi
          # A scan that finds nothing is a scan that ran against the wrong thing.
          test "$(jq '.components | length' "sbom-${{ matrix.name }}.cdx.json")" -gt 0 \
            || { echo "SBOM for ${IMAGE_REF} has zero components — refusing to attest it"; exit 1; }
      - name: Attest the SBOM to the digest
        if: inputs.dry_run != true
        env:
          IMAGE_REF: ghcr.io/cjohnstoniv/${{ matrix.name }}@${{ env.DIGEST }}
        run: cosign attest --yes --type cyclonedx --predicate "sbom-${{ matrix.name }}.cdx.json" "${IMAGE_REF}"
      - name: Attest build provenance
        if: inputs.dry_run != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/cjohnstoniv/${{ matrix.name }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Upload the SBOM for the release-assets job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json
          if-no-files-found: error

  # Standalone CLI binaries. The images and the chart cover the two install paths,
  # but neither gives you just `wardyn` — for CI, for an air-gapped host, or for
  # anyone who wants the client without the stack. Static (CGO_ENABLED=0) so they
  # run anywhere, and covered by the same signed SHA256SUMS as everything else.
  binaries:
    name: CLI binaries
    runs-on: ubuntu-latest
    needs: preflight-green
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          out="wardyn-${GOOS}-${GOARCH}"
          # -X stamps releaseBuild=true so this binary's version.String() reports
          # the bare release (no +<commit> suffix) — this job only runs from a
          # `v*` tag push or a manual dispatch, never from a plain commit build.
          go build -trimpath -ldflags "-X github.com/cjohnstoniv/wardyn/internal/version.releaseBuild=true" -o "$out" ./cmd/wardyn
          # A cross-built binary that cannot report its own version is a binary
          # nobody can support. Only checkable natively.
          if [ "$GOOS" = linux ] && [ "$GOARCH" = amd64 ]; then
            "./$out" --version || "./$out" version
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wardyn-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  # The chart, published as an OCI artifact so installing does not require cloning.
  #
  # Until 0.6.2 the images were published and the CHART was not, which made the
  # documented install `git clone && helm install ./deploy/helm/wardyn`. That is a
  # strange asymmetry to hand an operator: the artifacts they run are pullable, but
  # the thing that installs them is not. Helm speaks OCI natively and GHCR hosts
  # charts, so this is a package + push.
  chart:
    name: Publish the Helm chart (OCI)
    runs-on: ubuntu-latest
    needs: preflight-green
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3
        with:
          # Pinned for the same reason the image job pins it (see :197): the
          # action's own default floats, and one release must not be signed by
          # two different cosign majors.
          cosign-release: "v2.6.4"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push
        id: push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          # workflow_dispatch runs off a branch, so there is no tag to match; use
          # the chart's own version and let the tag check apply only to real tags.
          if [ "${{ github.ref_type }}" != "tag" ]; then
            ver="$(grep -E '^version:' deploy/helm/wardyn/Chart.yaml | awk '{print $2}')"
          fi
          # The chart's own version must match the tag, or `helm install --version`
          # silently resolves to something other than the release being cut.
          chart_ver="$(grep -E '^version:' deploy/helm/wardyn/Chart.yaml | awk '{print $2}')"
          test "$chart_ver" = "$ver" \
            || { echo "Chart.yaml version=$chart_ver but the tag is $ver — bump it (RELEASING.md step 1b)"; exit 1; }
          helm package deploy/helm/wardyn -d dist/
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry run: packaged dist/wardyn-${ver}.tgz, not pushing"
            exit 0
          fi
          helm push "dist/wardyn-${ver}.tgz" oci://ghcr.io/cjohnstoniv/charts 2>&1 | tee push.log
          echo "digest=$(grep -oE 'sha256:[a-f0-9]{64}' push.log | head -1)" >> "$GITHUB_OUTPUT"
      - name: Sign the chart (keyless, by digest)
        if: inputs.dry_run != true
        run: cosign sign --yes "ghcr.io/cjohnstoniv/charts/wardyn@${{ steps.push.outputs.digest }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error

  # Everything a consumer needs, ON the Release object rather than in a workflow
  # artifact that expires and needs a GitHub login to reach. Before this job,
  # v0.6.1's release assets were empty and v0.6.0's were 13 demo .mp4 files — an
  # enterprise that cannot pull from a public registry had no ingestion path at
  # all, and nobody could verify what they did pull without reading RELEASING.md.
  release-assets:
    name: Release assets (SBOMs, checksums, notices)
    # !failure() lets this run when `images` or `promote` was skipped by the path
    # choice; any job that FAILED still stops it.
    if: ${{ !cancelled() && !failure() && inputs.dry_run != true }}
    needs: [preflight-green, images, images-ui-sandbox, promote, chart, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # gh release upload
      id-token: write   # cosign sign-blob (keyless)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3
        with:
          # LOAD-BEARING, not tidiness: `Sign the checksums` below uses
          # --output-signature/--output-certificate, which cosign v3 refuses
          # ("must specify --bundle with --new-bundle-format", exit 1). The
          # action's default cosign is whatever its pinned commit shipped with,
          # so leaving it unset made a green release depend on that default
          # never crossing a major — and docs/VERIFY.md's `cosign verify-blob
          # --signature/--certificate` recipe depends on the same v2 shape.
          # Migrating to `--bundle SHA256SUMS.sigstore.json` means changing that
          # documented verify recipe in the same edit; until then, pin.
          cosign-release: "v2.6.4"
      - name: Collect the per-image SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{sbom-*,chart,cli-*}"
          merge-multiple: true
          path: assets
      - name: Assemble the asset set
        env:
          RELEASE_PATH: ${{ needs.preflight-green.outputs.path }}
        run: |
          set -euo pipefail
          cp THIRD-PARTY-NOTICES.md LICENSE NOTICE install.sh assets/
          chmod +x assets/wardyn-* 2>/dev/null || true
          cd assets
          # One SBOM per published image, counted from the matrix of the path
          # that ran. If the matrix grows and this does not, the count assertion
          # below is what says so.
          if [ "$RELEASE_PATH" = promote ]; then
            want=$(yq '.jobs.promote.strategy.matrix.include | length' ../.github/workflows/release.yml)
          else
            want=$(yq '[.jobs.images.strategy.matrix.include[], .jobs["images-ui-sandbox"].strategy.matrix.include[]] | length' ../.github/workflows/release.yml)
          fi
          have=$(ls -1 sbom-*.cdx.json | wc -l)
          test "$have" -eq "$want" || { echo "expected $want image SBOMs, found $have"; ls -1; exit 1; }
          sha256sum ./* > SHA256SUMS
      - name: Sign the checksums (keyless)
        working-directory: assets
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS
      - name: Upload to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # RELEASING.md cuts the Release by hand; create a draft if the tag ran
          # ahead of that so the assets are never homeless.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --prerelease --notes-from-tag
          gh release upload "$TAG" assets/* --clobber
      - name: Assert every required asset actually landed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          have=$(gh release view "$TAG" --json assets -q '.assets[].name' | sort)
          for want in SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem THIRD-PARTY-NOTICES.md LICENSE NOTICE \
                      install.sh wardyn-linux-amd64 wardyn-linux-arm64 wardyn-darwin-amd64 wardyn-darwin-arm64; do
            grep -qx "$want" <<<"$have" || { echo "MISSING RELEASE ASSET: $want"; exit 1; }
          done
          echo "$have"
