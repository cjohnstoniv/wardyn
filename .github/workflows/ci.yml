name: CI

on:
  push:
    branches: [main, master, 'release/**', 'feature/**']
  pull_request:
    branches: [main, master, 'release/**', 'feature/**']
  # The merge queue tests each queued PR against the queue's head before it
  # lands; the required checks must run on that event or the queue never moves.
  merge_group:
    types: [checks_requested]

# Least-privilege default: CI only needs to read the repo — nothing here writes
# back. Mirrors nightly.yml, which already sets this.
permissions:
  contents: read

# A new push to a pull request cancels that PR's older run: its result gates
# nothing once the head moves, but it holds runner slots, which are what this
# repository's CI queues on (docs/CI.md, "This repository's own CI"). A push
# keys on its run_id and so shares a group with nothing: a run on main is never
# cancelled, never queued behind another, and never replaced while pending. A
# per-branch key would do all three, because GitHub keeps one running and one
# pending run per group and cancels the older pending one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job sets timeout-minutes. Unset, GitHub allows 360, so one hung job holds
# a runner for six hours. Each value is at least twice the job's measured
# maximum, with a ten-minute floor (docs/CI.md); raise it with the measurement.
jobs:
  # ── which jobs a change can affect (#932) ─────────────────────────────────
  # Classifies the changed paths once. Two outputs, each 'true' or 'false':
  #   code    — something outside the docs changed (docs/**, threatmodel/**, *.md)
  #   backend — something outside the docs AND outside ui/** changed
  # Push, merge_group and train/* pull requests are always 'true': they run
  # everything. The rules fail closed: a path in no class counts as backend, so
  # a new directory runs every job until someone decides otherwise. The Go
  # suites never skip: dozens of guard tests read the docs, the CHANGELOG,
  # ui/src and the workflows. A docs-only change narrows them to those guard
  # packages instead (see the go job; docs/CI.md, "Incremental CI").
  #
  # A job that consumes these outputs must also run when this job FAILED
  # (`!cancelled()`) and compare with != 'false', so a missing output runs the
  # work instead of skipping it. REQUIRED jobs never skip at the job level:
  # they run and skip their steps, so their check still reports success.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.classify.outputs.code }}
      backend: ${{ steps.classify.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # On a pull_request HEAD is GitHub's merge commit and HEAD^1 the base
          # tip, so HEAD^1..HEAD is exactly what this PR changes in the tree CI tests.
          fetch-depth: 2
      - name: Classify the changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ] || [[ "$HEAD_REF" == train/* ]]; then
            echo "$EVENT${HEAD_REF:+ from $HEAD_REF}: running everything"
            printf 'code=true\nbackend=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An assignment, not `< <(git diff …)`: set -e ignores a failing
          # process substitution, which would read an unreadable diff as
          # "nothing changed" and skip everything.
          changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          code=false backend=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/*|threatmodel/*|*.md) class=docs ;;
              ui/*) class=ui; code=true ;;
              *) class=backend; code=true; backend=true ;;
            esac
            echo "$class  $f"
          done <<< "$changed"
          echo "code=$code backend=$backend"
          printf 'code=%s\nbackend=%s\n' "$code" "$backend" >> "$GITHUB_OUTPUT"

  # ── Go: build, lint and the three tag-set suites, in parallel (#932) ──────
  # One leg per tag set, plus one for build + tidy + lint, each on its own
  # runner. `build` below is the required check: it waits for every leg and
  # enforces the coverage floor on the union of the three profiles.
  #
  # Each suite runs under the race detector and writes a coverage profile: one
  # pass per tag set covers both, where a separate `make build-docker` +
  # `make test-race` used to repeat the same three tag sets a second and third
  # time (#467). The tagless build alone cannot compile the container-hardening
  # driver, internal/envbuild, or the k8s confinement substrate, so a
  # tagless-only floor scored code that is not what ships. The kill/dispatch
  # FSM's concurrent tests (kill_dispatch_race_test.go) are only meaningful
  # under -race.
  #
  # These are the PR-time docker-tagged AND k8s-tagged suites (fakeDocker /
  # fake clientset; WARDYN_TEST_DOCKER and WARDYN_TEST_K8S deliberately unset,
  # so the real-daemon/real-cluster cases skip cleanly). nightly.yml's
  # docker-tagged-live sets WARDYN_TEST_DOCKER=1 against a live daemon;
  # conformance-k8s below is the k8s equivalent (WARDYN_TEST_K8S=1 against a
  # live kind cluster).
  #
  # A docs-only change (changes.outputs.code == 'false') cannot change compiled
  # code, race behaviour or coverage, only what the doc-reading guard tests
  # read. The three test legs then run just those guard packages, found from
  # the test sources at run time, with plain `go test`; `build` skips the union.
  # Any other value, including a missing one, runs the full suites.
  go:
    name: go (${{ matrix.suite }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # `make lint` = go vet (all three tag sets) + the golangci-lint
          # function-size/complexity gate (.golangci.yml) + the file-size gate
          # and the other static gates + the console's ESLint — single-sourced
          # in the Makefile.
          # tidy-check: go.mod/go.sum must stay tidy (go mod tidy -diff).
          - suite: lint
            target: build tidy-check lint
          - suite: unit
            target: test-report
            tags: ''
          - suite: docker
            target: test-report-docker
            tags: docker
          - suite: k8s
            target: test-report-k8s
            tags: k8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history with tags: the CHANGELOG freeze guard
          # (cmd/wardynd/changelog_frozen_test.go) compares each released
          # section against its tag or correcting commit, and skips any it
          # cannot resolve.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Go build cache key date (one cache generation per job per day)
        id: cache-date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      # setup-go's own cache uses one key with no job component, so only the
      # first job to finish ever saves it and every other job restores a
      # near-empty cache (issue #470). Keying per job here — and saving only
      # on push to main, so there is one entry per job per day — fixes that.
      # The save needs a green run: a run that failed early would otherwise pin
      # a near-empty cache under the day's key until the next day. The unhashed
      # restore-key keeps a go.sum/Makefile change warm (both caches are
      # content-addressed, so an older entry is safe to restore).
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ matrix.suite }}-${{ hashFiles('go.sum', 'Makefile') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-${{ matrix.suite }}-${{ hashFiles('go.sum', 'Makefile') }}-
            go-${{ matrix.suite }}-
      # The lint leg's `make lint` also runs the console's ESLint
      # (ui/eslint.config.js), so that leg sets up pnpm and node.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.suite == 'lint'
        with:
          version: 9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.suite == 'lint'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # ESLint needs no browser; PUPPETEER_SKIP_DOWNLOAD skips the mermaid-cli
      # chromium download.
      - name: make ${{ matrix.target }}
        if: matrix.suite == 'lint' || needs.changes.outputs.code != 'false'
        run: make ${{ matrix.target }}
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      # The guard packages: the directories of every test file that names a docs
      # path, threatmodel/, ui/, .github/ or a .md file. A tag leg keeps only the
      # files built under its tag (their packages run with -tags; the rest ran in
      # the tagless leg), so it may legitimately find none. The tagless leg
      # finding none means the pattern broke, and fails rather than pass empty.
      - name: Docs-only change — the doc-reading guard packages only (no race, no coverage)
        if: matrix.suite != 'lint' && needs.changes.outputs.code == 'false'
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          set -euo pipefail
          rc=0
          files="$(git grep -l -E '"(\.\./)*(docs|threatmodel|ui|\.github)[/"]|CHANGELOG\.md|RELEASING\.md|AGENTS\.md|\.md["`]' -- '*_test.go')" || rc=$?
          [ "$rc" -le 1 ] || exit "$rc"
          if [ -n "$TAGS" ]; then
            # The tag as a positive term: `//go:build !docker` is not a docker file.
            files="$(for f in $files; do grep -l -E "^//go:build (.*[^!a-z0-9_])?${TAGS}\b" "$f" || true; done)"
          fi
          pkgs="$(for f in $files; do dirname "$f"; done | sort -u | sed 's|^|./|')"
          if [ -z "$pkgs" ]; then
            [ -n "$TAGS" ] || { echo "::error::no doc-reading guard test found; the discovery pattern regressed"; exit 1; }
            echo "no -tags $TAGS guard test file; nothing to run"
            exit 0
          fi
          echo "$pkgs"
          # shellcheck disable=SC2086 # one word per package, and -tags only when set
          WARDYN_TEST_PG='' go test -count=1 ${TAGS:+-tags "$TAGS"} $pkgs
      # No continue-on-error, unlike the other report uploads: `build` unions
      # these profiles, so a leg whose profile did not upload has not done its job.
      # overwrite: a "Re-run failed jobs" attempt re-uploads under the same name.
      # if-no-files-found: error, so a leg that wrote no reports goes red itself
      # rather than leaving `build` to fail later on a missing directory.
      - name: Upload the suite's reports and coverage profile
        if: always() && matrix.suite != 'lint' && needs.changes.outputs.code != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-test-reports-${{ matrix.suite }}
          path: test/reports/go/${{ matrix.suite }}/**
          overwrite: true
          if-no-files-found: error
      - name: Save Go build cache (push to main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ matrix.suite }}-${{ hashFiles('go.sum', 'Makefile') }}-${{ steps.cache-date.outputs.date }}

  # The required check. Branch protection requires a context named `build`, and
  # this is it: green only when every `go` leg passed AND the union of the three
  # coverage profiles clears the floor. `!cancelled()` so a failed leg still
  # runs this job, which then fails on the first step; with the default
  # `success()` it would be SKIPPED, and a skipped required check can read as
  # passing. On a docs-only change (changes.outputs.code == 'false') the legs
  # ran only the guard packages and wrote no profiles, so the union steps skip;
  # any other value, including a missing one, requires the union.
  build:
    needs: [changes, go]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every go leg passed
        env:
          LEGS: ${{ needs.go.result }}
        run: |
          [ "$LEGS" = success ] || { echo "::error::a go leg did not pass (result: $LEGS); see the go (…) checks"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code != 'false'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: needs.changes.outputs.code != 'false'
        with:
          go-version-file: go.mod
          cache: false
      - name: Download the three suites' profiles
        if: needs.changes.outputs.code != 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: go-test-reports-*
          path: test/reports/go
      # download-artifact puts each artifact in a directory named after it; the
      # union reads test/reports/go/<suite>/, where `make cover-check` writes it.
      - name: Put each profile where the union reads it
        if: needs.changes.outputs.code != 'false'
        run: for s in unit docker k8s; do mv "test/reports/go/go-test-reports-$s" "test/reports/go/$s"; done
      # The same floor and union `make cover-check` enforces locally, over the
      # profiles the legs produced (scripts/cover-union.sh documents what counts).
      - name: Enforce the union coverage floor
        id: union
        if: needs.changes.outputs.code != 'false'
        run: make cover-union
      - name: Upload the union coverage report
        id: upload_go_union_report
        if: always() && steps.union.outcome != 'skipped'
        # A storage-side error must not fail a job whose tests passed: a 403 from
        # the artifact service reddened a REQUIRED check with all 175 UI test files
        # green, and only a manual re-run cleared it (#372). The step below says so
        # loudly, because a run that is green with no reports attached is the one
        # case where you need them.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-test-reports-union
          path: test/reports/go/union/**
      - name: Say so if go-test-reports-union did not upload
        if: always() && steps.upload_go_union_report.outcome == 'failure'
        run: echo "::warning title=Reports missing::go-test-reports-union did not upload; this job's result stands on its tests, but the reports are not attached to this run."

  # ── docs: mermaid diagram gate ────────────────────────────────────────────
  # Validate every fenced mermaid diagram in the public docs (syntax + label-
  # truth). Needs the ui node_modules (mermaid-cli), so it installs UI deps first.
  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install deps (puppeteer chromium download skipped; the runner's chrome is used)
        working-directory: ui
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: Diagram gate (mermaid syntax + label-truth)
        run: make diagrams
      # docs/img holds the README/TRY-IT console shots and nothing regenerates
      # them automatically. A path-pair check, never a pixel diff (pixel gates
      # flake; ui/e2e/screenshots/docs.spec.ts rejects them), over the whole
      # rendered UI tree, because both shots photograph the shell, the nav rail,
      # the tokens and the shared components. ADVISORY: a warning annotation,
      # never a failure, and no job of its own. Many console changes rightly
      # leave both shots alone, and a job of its own costs a runner per PR.
      # On a pull_request HEAD is GitHub's merge commit and HEAD^1 the base tip,
      # which is why the checkout above fetches depth 2.
      - name: Screenshot freshness (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          changed="$(git diff --name-only HEAD^1 HEAD)"
          screens="$(printf '%s\n' "$changed" | grep -E '^ui/src/(app|styles)/' | grep -v '\.test\.' || true)"
          if [ -n "$screens" ] && ! printf '%s\n' "$changed" | grep -q '^docs/img/'; then
            printf '%s\n' "$screens"
            echo "::warning title=docs/img may be stale::The console changed (ui/src/app or ui/src/styles) and no docs/img shot did. Run make screenshots if either shot shows the change."
          fi

  # ── web UI: typecheck + unit/component tests + build ──────────────────────
  # The React admin UI previously had ZERO CI coverage (a HIGH finding). This
  # job typechecks (tsc was entirely broken before), runs vitest with coverage,
  # and builds the embedded bundle.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install deps
        working-directory: ui
        run: pnpm install --frozen-lockfile
      # Fail closed on a copyleft license in a SHIPPED (prod) dependency. The
      # known MPL/EPL hits (lightningcss, elkjs, dompurify) are devDependencies
      # and are excluded by --prod, so they do not trip this gate.
      - name: Check UI production dependency licenses (no copyleft)
        run: make npm-license
      # The npm half of the `gates` matrix below (which is Go-only): fail closed
      # on a high/critical advisory in a SHIPPED dependency. Lives here, not in
      # that matrix, because it needs pnpm/node and the matrix is uniform setup-go.
      - name: Audit UI production dependencies (advisories)
        run: make npm-audit
      # F065/R4-E2E-B3: npm-audit above is deliberately blind to dev-only
      # advisories, and a pnpm.overrides pin (an EXACT version, not a floor)
      # is exactly the kind of thing that rots silently once a newer GHSA
      # lands below it — which is precisely how F065 went undetected for as
      # long as it did. This step is the watcher: it runs the full (dev+prod)
      # scan on every push/PR so a rotted pin surfaces here, in the log,
      # without gating the merge (continue-on-error) — dev-dep noise still
      # never blocks anyone.
      - name: Audit ALL UI dependencies, including dev (non-blocking watcher)
        continue-on-error: true
        run: make npm-audit-dev
      # Routed through make so the gate is single-sourced (make = CI reality).
      # The ui-* targets bundle an idempotent `pnpm install --frozen-lockfile`;
      # against the already-installed tree above it is a no-op, so behavior is
      # identical to the raw `pnpm` steps this replaced. The targets `cd ui`
      # themselves, so no working-directory here.
      - name: Typecheck
        run: make ui-typecheck
      - name: Unit/component tests (vitest + coverage)
        run: make ui-test
      - name: Build UI bundle
        run: make ui
      - name: Upload UI test reports
        id: upload_ui_test_reports
        if: always()
        # A storage-side error must not fail a job whose tests passed: a 403 from
        # the artifact service reddened a REQUIRED check with all 175 UI test files
        # green, and only a manual re-run cleared it (#372). The step below says so
        # loudly, because a run that is green with no reports attached is the one
        # case where you need them.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-test-reports
          path: test/reports/ui/**
      - name: Say so if ui-test-reports did not upload
        if: always() && steps.upload_ui_test_reports.outcome == 'failure'
        run: echo "::warning title=Reports missing::ui-test-reports did not upload; this job's result stands on its tests, but the reports are not attached to this run."

  # ── web UI: Playwright e2e against a seeded none-runner backend ────────────
  # Real wardynd + Postgres + the `none` runner serving the built UI, seeded with
  # deterministic fixtures. Each spec runs against a freshly-seeded backend
  # (scripts/run-ui-e2e.sh) so mutating specs never contaminate each other. The
  # full live compose stack is exercised by the nightly workflow instead.
  # One job, not shards: it is not the critical path (`build` is), a shard adds
  # a check and repeats the setup, and the per-spec reseed costs about a second
  # (docs/CI.md has the measurements).
  ui-e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Go build cache key date (one cache generation per job per day)
        id: cache-date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-ui-e2e-${{ hashFiles('go.sum', 'Makefile') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-ui-e2e-${{ hashFiles('go.sum', 'Makefile') }}-
            go-ui-e2e-
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # Routed through make so the dev loop and CI stand up the SAME Postgres:
      # the inline `docker run` this replaced had drifted a major version away
      # from scripts/up.sh (17 here, 16 there) for a month. `make dev-pg` only
      # gives us the named "wardyn-test-pg" container (#210); run-ui-e2e.sh
      # picks its own per-run database name and e2e-backend.sh's cmd_up
      # creates and drops it.
      - name: Start Postgres (named container so the seeder can psql into it)
        run: make dev-pg
      - name: Install UI deps
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright UI e2e (fresh seed per spec)
        run: make test-e2e-ui
      - name: Upload Playwright report
        id: upload_playwright_report
        if: always()
        # A storage-side error must not fail a job whose tests passed: a 403 from
        # the artifact service reddened a REQUIRED check with all 175 UI test files
        # green, and only a manual re-run cleared it (#372). The step below says so
        # loudly, because a run that is green with no reports attached is the one
        # case where you need them.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            ui/playwright-report/**
            ui/test-results/**
      - name: Say so if playwright-report did not upload
        if: always() && steps.upload_playwright_report.outcome == 'failure'
        run: echo "::warning title=Reports missing::playwright-report did not upload; this job's result stands on its tests, but the reports are not attached to this run."
      - name: Save Go build cache (push to main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-ui-e2e-${{ hashFiles('go.sum', 'Makefile') }}-${{ steps.cache-date.outputs.date }}

  # ── deploy: Helm chart lint + render ──────────────────────────────────────
  # The Helm chart is one of the two blessed deploy paths; lint + template-render
  # it so it can never regress to "renders nothing" again (was a CRITICAL gap).
  helm:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.backend != 'false'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        if: needs.changes.outputs.backend != 'false'
        with:
          version: latest
      - name: helm lint + template (must render load-bearing objects)
        if: needs.changes.outputs.backend != 'false'
        run: make helm-lint

  # ── deploy: kind Helm install-test (proves the chart actually boots) ──────
  # `helm` above only proves the chart RENDERS (`helm template`); it has
  # never proven an install actually CONVERGES to a running, healthy control
  # plane. Builds the image locally (no registry — ghcr publishing is
  # publish-image.yml, a separate workflow that runs after this one passes
  # on main and never for a PR), loads it straight into a throwaway kind
  # cluster (`kind load docker-image` — no pull), then `make helm-install-test` does the
  # in-cluster kubectl/helm work: a plain-manifest Postgres, `helm install`
  # against the loaded image, a bounded rollout wait, and a real /healthz
  # assertion through the Service via `kubectl port-forward` (see the
  # Makefile target for two install-time overrides real validation forced,
  # and why — neither is a chart DEFAULTS change). The kind cluster's
  # create + automatic post-job delete (helm/kind-action) is the only piece
  # that stays in the workflow — repo convention keeps the actual gate logic
  # single-sourced in `make`.
  helm-install-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: latest
      # Layer cache in the GitHub Actions cache, one scope per image (#932),
      # written only from a push to main like the Go caches (#470): a PR reads
      # main's layers and adds no entries of its own. use: false keeps any plain
      # `docker build` later in this job on the default builder, loading into
      # the daemon as before.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        id: buildx
        with:
          use: false
      - name: Build wardynd image (local only — publishing is publish-image.yml)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: deploy/compose/Dockerfile.wardynd
          tags: wardyn/wardynd:kind-test
          load: true
          cache-from: type=gha,scope=wardynd
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=wardynd' || '' }}
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: wardyn-test
          wait: 90s
      - name: Load the image into kind (no registry pull)
        run: kind load docker-image wardyn/wardynd:kind-test --name wardyn-test
      - name: helm install + boot proof (make target — postgres, install, rollout wait, /healthz)
        run: make helm-install-test

  # ── deploy: kind Kubernetes conformance (k8s runner substrate) ────────────
  # EXTENDS helm-install-test's pattern just above (same pinned helm/kind-action
  # SHA, same "build the image locally, kind load it, no registry" shape) but
  # proves a DIFFERENT thing: not that the Helm chart installs, but that the
  # k8s runner substrate (internal/runner/k8s, `-tags k8s`) actually confines a
  # sandbox on a real cluster — driven DIRECTLY against the kubeconfig context
  # (test/conformance/conformance_k8s_test.go), no helm, no Postgres.
  #
  # disableDefaultCNI (deploy/kind/conformance-kind-config.yaml) + a pinned
  # Calico manifest: the substrate's boot-time egress canary
  # (internal/runner/k8s/canary.go) REFUSES to construct unless this cluster's
  # CNI actually enforces NetworkPolicy — kind's default kindnet CNI does not,
  # so this job would vacuously fail construction (not a real conformance
  # result) without Calico. The negative direction — a kindnet-only cluster
  # correctly REFUSING — is proven by internal/runner/k8s/canary_test.go's
  # fake-clientset unit tests plus a one-off live-cluster check (see the A3
  # lane's report); standing up a SECOND kind cluster per CI run just to
  # re-prove it isn't worth doubling this job's runtime.
  #
  # KUBECONFIG points at the node's INTERNAL IP, not kind's default
  # 127.0.0.1:<host-port> — this is NOT a Docker-Desktop-only quirk, it is
  # true on every platform including this runner: the canary pod dials
  # apiserverHostPort (computed ONCE from THIS process's own rest.Config.Host)
  # from INSIDE the cluster, and a pod's loopback is its own network
  # namespace, never the host's — 127.0.0.1 from a pod can never reach back to
  # a host-side port-forward no matter what dockerd is doing. The node's real
  # container IP (reachable directly from this native-dockerd runner, and
  # trivially from a pod on its own node) is the one address both sides can
  # dial identically; kind's own apiserver cert already SANs it.
  #
  # A PSS-restricted namespace: the substrate's agent/proxy/canary pods already
  # carry the full restricted securityContext (internal/runner/k8s's
  # baseSecurityContext/agentSecurityContext/restrictedSecurityContext) —
  # labeling the namespace enforced-restricted is a live admission-time proof
  # of that, not a relaxation to make the job pass.
  #
  # RBAC (templates/rbac.yaml) is asserted by RENDER ONLY, in the `helm` job
  # above — this job's kind-action ServiceAccount is cluster-admin, so the
  # chart's actual RBAC verbs are never runtime-constrained here (review
  # round 2, M8: the step name below used to imply otherwise).
  conformance-k8s:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # 35, not 25: the Makefile recipe's own `-timeout` is 25m since the eviction case
    # gained its second fill target AND a margin for the rest of the suite
    # (TestEphemeralCaseBudgetFitsTheMakefileTimeout), and a job timeout at or below it
    # would kill the suite mid-verdict instead of letting go test report which case ran
    # long. The extra 10m is the image builds and the kind/Calico bring-up in front of it.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.backend != 'false'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: needs.changes.outputs.backend != 'false'
        with:
          go-version-file: go.mod
          cache: false
      - name: Go build cache key date (one cache generation per job per day)
        if: needs.changes.outputs.backend != 'false'
        id: cache-date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        if: needs.changes.outputs.backend != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-conformance-k8s-${{ hashFiles('go.sum', 'Makefile') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-conformance-k8s-${{ hashFiles('go.sum', 'Makefile') }}-
            go-conformance-k8s-
      # Cached image build: see helm-install-test's build step.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        id: buildx
        if: needs.changes.outputs.backend != 'false'
        with:
          use: false
      - name: Build wardyn-proxy image (local only — publishing is publish-image.yml)
        if: needs.changes.outputs.backend != 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: deploy/compose/Dockerfile.proxy
          tags: wardyn/wardyn-proxy:kind-test
          load: true
          cache-from: type=gha,scope=wardyn-proxy
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=wardyn-proxy' || '' }}
      # H1 (review round 2): the conformance agent image MUST carry
      # wardyn-rec (k8s's SessionRecording is unconditionally true, no
      # docker-style opt-out) — a bare busybox took the never-records path
      # and the gate never proved recording works. See the Makefile target's
      # own doc and deploy/kind/Dockerfile.conformance-agent.
      - name: Build the conformance agent image (busybox:1.36 + wardyn-rec)
        if: needs.changes.outputs.backend != 'false'
        run: make build-conformance-agent-image CONFORMANCE_AGENT_IMAGE=wardyn/conformance-agent:kind-test
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        if: needs.changes.outputs.backend != 'false'
        with:
          cluster_name: wardyn-conformance-k8s
          config: deploy/kind/conformance-kind-config.yaml
          wait: 90s
      - name: Load images into kind (no registry pull)
        if: needs.changes.outputs.backend != 'false'
        run: |
          kind load docker-image wardyn/wardyn-proxy:kind-test --name wardyn-conformance-k8s
          kind load docker-image wardyn/conformance-agent:kind-test --name wardyn-conformance-k8s
      - name: Install Calico (single-file, version-pinned manifest — NetworkPolicy enforcement)
        if: needs.changes.outputs.backend != 'false'
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=180s
          kubectl -n kube-system rollout status deployment/calico-kube-controllers --timeout=180s
      - name: Label a PSS-restricted namespace for runs
        if: needs.changes.outputs.backend != 'false'
        run: |
          kubectl create namespace wardyn-conformance
          kubectl label namespace wardyn-conformance \
            pod-security.kubernetes.io/enforce=restricted \
            pod-security.kubernetes.io/enforce-version=v1.30
          # v1.30: pinned to match the kindest/node image this cluster boots
          # (kind-action's default at the time this job was written) — bump
          # together if that ever changes (review round 2, L5).
      - name: Repoint KUBECONFIG at the node's internal IP (see the job comment above)
        if: needs.changes.outputs.backend != 'false'
        run: |
          NODE_IP=$(kubectl get nodes wardyn-conformance-k8s-control-plane -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')
          kind get kubeconfig --name wardyn-conformance-k8s --internal \
            | sed "s/wardyn-conformance-k8s-control-plane:6443/${NODE_IP}:6443/" \
            > "$RUNNER_TEMP/kubeconfig-internal.yaml"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig-internal.yaml" >> "$GITHUB_ENV"
      - name: Run k8s conformance (make target — WARDYN_TEST_K8S=1; canary + exec + recording live, RBAC render-asserted elsewhere)
        if: needs.changes.outputs.backend != 'false'
        env:
          WARDYN_TEST_K8S: "1"
          WARDYN_K8S_NAMESPACE: wardyn-conformance
          WARDYN_PROXY_IMAGE: wardyn/wardyn-proxy:kind-test
          WARDYN_TEST_K8S_AGENT_IMAGE: wardyn/conformance-agent:kind-test
        run: make test-conformance-k8s
        # No continue-on-error: a real conformance failure must block the build.
      - name: Save Go build cache (push to main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-conformance-k8s-${{ hashFiles('go.sum', 'Makefile') }}-${{ steps.cache-date.outputs.date }}

  # ── deploy: docker-compose config validation ──────────────────────────────
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: docker compose config (validate)
        run: make compose-config
      # Daemon-free shell regression suite (scripts/test-*.sh, incl.
      # test-desktop-profile.sh) — was genuinely absent from every workflow;
      # this job is the natural home, already daemon-free and already named
      # for exactly this kind of static/config check.
      - name: Shell regression tests (scripts/test-*.sh)
        run: make test-scripts

  # ── desktop tier: envelope boots, and the ceiling actually holds ───────────
  # Boots the SAME compose stack every other single-host deployment uses
  # (deploy/desktop/docker-compose.yaml `include:`s
  # deploy/compose/docker-compose.yaml unmodified, adding only the
  # MDM-managed-directory mount) with this commit's
  # deploy/desktop/wardyn.env.example as the envelope, then proves three
  # things docs/DESKTOP.md claims: the control plane actually serves the
  # managed policy as its default, a run that names no policy resolves to
  # that ceiling (not something wider), and Recording Mode's synthesized
  # profile is clamped to it too (composer.Clamp's the same call whichever
  # caller reaches it — see internal/api/profile.go). CI-side only: nothing
  # here runs against a real device, and nothing in the install lane
  # (install.sh, the plist) executes — those are macOS/launchd-only and stay
  # covered by scripts/test-desktop-profile.sh's static checks above.
  desktop-envelope:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build wardynd (this commit)
        run: docker compose -f deploy/compose/docker-compose.yaml build wardynd
      - name: Build wardyn-proxy (every launched run's sidecar; driver.go assumes it locally present, never pulls it)
        run: docker compose -f deploy/compose/docker-compose.yaml --profile build-only build proxy-image
      - name: Lay down a CI-local managed envelope at /etc/wardyn
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/wardyn
          KEY="$(docker run --rm wardyn/wardynd:local -gen-age-key | grep -E '^AGE-SECRET-KEY-' | head -1)"
          [ -n "${KEY}" ] || { echo "::error::-gen-age-key produced no key"; exit 1; }
          printf '%s\n' "${KEY}" | sudo tee /etc/wardyn/age.key >/dev/null
          sudo chmod 0600 /etc/wardyn/age.key
          # examples/policies/demo.json is the SAME ceiling the base compose
          # file falls back to on its own (CC1, works with no gVisor) — using
          # it here means "managed ceiling" and "what a plain runner enforces"
          # are the same file, so a real difference is a real bug, not a
          # CI-environment artifact.
          sudo cp examples/policies/demo.json /etc/wardyn/policy.json
          # The envelope ships BOTH image pins uncommented, as a real fleet must
          # (an unset WARDYN_PROXY_IMAGE makes every run's egress sidecar
          # unresolvable on a laptop). Their @sha256:REPLACE_ME placeholders are
          # unresolvable here, and the env file WINS over the compose default —
          # so rewrite both to the images the steps above just built, or this
          # job dies on an image pull before any assertion runs, looking like a
          # registry problem rather than an envelope edit.
          sed -e 's/\$UPN/ci-operator@example.com/' -e 's/\$SERIALNUMBER/CI0000/' \
              -e 's|^WARDYN_WARDYND_IMAGE=.*|WARDYN_WARDYND_IMAGE=wardyn/wardynd:local|' \
              -e 's|^WARDYN_PROXY_IMAGE=.*|WARDYN_PROXY_IMAGE=wardyn/wardyn-proxy:local|' \
            deploy/desktop/wardyn.env.example | sudo tee /etc/wardyn/wardyn.env >/dev/null
      - name: Assert boot refuses an org URL with member mode unset (issue #105)
        # validateHybridPosture (cmd/wardynd/boot_posture.go) runs after
        # connectAndMigrate AND after claimSingleInstance's Postgres advisory
        # lock, so this runs BEFORE the real daemon boots: with it up, this
        # process would die on the lock, never reaching the refusal.
        # `docker compose run` brings up postgres/registry itself (depends_on)
        # and publishes no ports. The WARDYN_MANAGED_DIR env matches the Boot
        # step's, or /etc/wardyn is empty in the container and LoadPolicySpec
        # fails first. `timeout` turns "the refusal was removed and the daemon
        # now serves forever" into exit 124 within two minutes instead of the
        # job timeout. `down -v` at the end: this boot persisted a signing key
        # under an ephemeral age identity (the envelope leaves WARDYN_AGE_KEY
        # to the launcher), which the real daemon's own ephemeral identity
        # cannot decrypt — so the Boot step starts from an empty database.
        env:
          WARDYN_MANAGED_DIR: /etc/wardyn
        run: |
          set +e
          out=$(timeout 120 docker compose --env-file /etc/wardyn/wardyn.env \
            -f deploy/desktop/docker-compose.yaml -p wardyn-desk-ci \
            run --rm -T --name wardyn-desk-ci-hybrid-refusal \
            -e WARDYN_ORG_URL=https://org-controlplane.example.com -e WARDYN_USER_DESKTOP=false \
            wardynd 2>&1)
          code=$?
          set -e
          echo "${out}"
          [ "${code}" -ne 0 ] \
            || { echo "::error::wardynd booted (exit 0) with WARDYN_ORG_URL set and WARDYN_USER_DESKTOP unset — validateHybridPosture's refusal did not fire"; exit 1; }
          echo "${out}" | grep -qF 'WARDYN_ORG_URL is set but WARDYN_USER_DESKTOP is not' \
            || { echo "::error::wardynd exited ${code}, but not with the expected refusal (124 = still running after 120s, i.e. it booted): ${out}"; exit 1; }
          docker compose --env-file /etc/wardyn/wardyn.env \
            -f deploy/desktop/docker-compose.yaml -p wardyn-desk-ci down -v
      - name: Boot the desktop compose profile
        # WARDYN_MANAGED_DIR is what wardyn-desktop.sh exports on a real laptop;
        # the included stack mounts it read-only at /etc/wardyn in the container.
        env:
          WARDYN_MANAGED_DIR: /etc/wardyn
        run: |
          docker compose --env-file /etc/wardyn/wardyn.env \
            -f deploy/desktop/docker-compose.yaml \
            -p wardyn-desk-ci up -d --no-build postgres registry wardynd
      - name: Wait for healthz
        run: |
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && exit 0; sleep 2; done
          docker compose -p wardyn-desk-ci logs wardynd
          echo "::error::wardynd did not become healthy"; exit 1
      - name: Assert /policies/default equals the managed file
        run: |
          # handleGetDefaultPolicy re-marshals types.RunPolicySpec, whose
          # `omitempty` tags drop denied_domains/allowed_methods when [] and
          # auto_stop_after_sec when 0 even though demo.json spells them out —
          # so a byte-for-byte diff is red on a healthy stack. Strip those three
          # keys from BOTH sides when they carry their zero value before
          # comparing; a real content difference (including a non-empty value
          # for any of the three) still fails the diff.
          NORMALIZE='del(.denied_domains | select(. == [])) | del(.allowed_methods | select(. == [])) | del(.auto_stop_after_sec | select(. == 0))'
          diff <(jq -S "${NORMALIZE}" /etc/wardyn/policy.json) <(curl -fsS http://127.0.0.1:8080/api/v1/policies/default | jq -S "${NORMALIZE}")
      - name: Assert a no-policy run resolves to the ceiling (dry-run preflight)
        run: |
          out=$(docker compose -p wardyn-desk-ci exec -T -e WARDYN_URL=http://localhost:8080 wardynd \
            /usr/local/bin/wardyn run --agent byoa --image ubuntu:24.04 --task "echo desktop-envelope-ci" \
            --task-mode exec --dry-run --json)
          echo "${out}" | jq -e '.enforced_confinement_class == "CC1"' >/dev/null \
            || { echo "::error::preflight enforced_confinement_class != the managed ceiling's CC1: ${out}"; exit 1; }
      - name: Launch a run and assert its synthesized profile is clamped (warnings non-empty)
        run: |
          run_json=$(docker compose -p wardyn-desk-ci exec -T -e WARDYN_URL=http://localhost:8080 wardynd \
            /usr/local/bin/wardyn run --agent byoa --image ubuntu:24.04 --task "echo desktop-envelope-ci" \
            --task-mode exec --wait --timeout 3m --json)
          run_id=$(echo "${run_json}" | jq -r .id)
          [ -n "${run_id}" ] && [ "${run_id}" != "null" ] || { echo "::error::no run id in: ${run_json}"; exit 1; }
          prof=$(docker compose -p wardyn-desk-ci exec -T -e WARDYN_URL=http://localhost:8080 wardynd \
            /usr/local/bin/wardyn record synthesize "${run_id}" --json)
          echo "${prof}" | jq -e '(.warnings // []) | length > 0' >/dev/null \
            || { echo "::error::synthesized profile carried no clamp/coverage warnings: ${prof}"; exit 1; }
      - name: Teardown
        if: always()
        run: |
          docker compose -p wardyn-desk-ci -f deploy/desktop/docker-compose.yaml down -v || true

  # Docker conformance against the live daemon (WARDYN_TEST_DOCKER=1). The
  # driver-agnostic honesty stub (`make test-conformance-stub` → the untagged
  # test/conformance/none_test.go) is NOT a separate leg here: that file carries
  # no build tag, so the `go` job's three suites already run it under all
  # three tag sets (coverage + race, see the go job above) — a separate
  # CI run here would be a pure duplicate. The stub target stays in the
  # Makefile for local use.
  #
  # THE TWO :local IMAGES BELOW ARE NOT OPTIONAL. 0.7.5's boot-egress
  # measurement (test/conformance/boot_egress_docker_test.go) boots the REAL
  # claude-code image behind the REAL wardyn-proxy sidecar — unlike the sibling
  # runner-contract suite, which only ever needed busybox:latest. Neither tag is
  # published anywhere (agent-claude-code has not been published since 0.6.2),
  # and CreateSandbox fails closed on an image it cannot pull, so without these
  # two builds the job t.Fatalf's on GitHub while every local gate is green
  # (`make ci` deliberately excludes this target). A skip-if-the-image-is-absent
  # knob would be worse: the one measurement that proves a stock boot parks no
  # first-use approval would silently never run.
  conformance:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Two image builds (one of them a bookworm + node + `npm install -g` layer)
    # in front of a suite whose own `go test -timeout` is 20m.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.backend != 'false'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: needs.changes.outputs.backend != 'false'
        with:
          go-version-file: go.mod
          cache: false
      - name: Go build cache key date (one cache generation per job per day)
        if: needs.changes.outputs.backend != 'false'
        id: cache-date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        if: needs.changes.outputs.backend != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-conformance-docker-${{ hashFiles('go.sum', 'Makefile') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-conformance-docker-${{ hashFiles('go.sum', 'Makefile') }}-
            go-conformance-docker-
      - name: Docker smoke check
        if: needs.changes.outputs.backend != 'false'
        run: docker run --rm hello-world
      # Cached image build: see helm-install-test's build step.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        id: buildx
        if: needs.changes.outputs.backend != 'false'
        with:
          use: false
      - name: Build wardyn-proxy image (local only — the boot-egress sidecar)
        if: needs.changes.outputs.backend != 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: deploy/compose/Dockerfile.proxy
          tags: wardyn/wardyn-proxy:local
          load: true
          cache-from: type=gha,scope=wardyn-proxy
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=wardyn-proxy' || '' }}
      - name: Build agent-claude-code image (local only — the boot under measurement)
        if: needs.changes.outputs.backend != 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: deploy/images/claude-code/Dockerfile
          tags: wardyn/agent-claude-code:local
          load: true
          cache-from: type=gha,scope=agent-claude-code
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=agent-claude-code' || '' }}
      - name: Run conformance tests (docker)
        if: needs.changes.outputs.backend != 'false'
        env:
          WARDYN_TEST_DOCKER: "1"
        run: make test-conformance-docker
        # No continue-on-error: a real conformance failure must block the build.
      - name: Save Go build cache (push to main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-conformance-docker-${{ hashFiles('go.sum', 'Makefile') }}-${{ steps.cache-date.outputs.date }}

  # ── real-daemon envbuild integration ───────────────────────────────
  # Exercises the envbuilder push -> finalize-FROM-pushed -> pull cycle against
  # a live daemon (validates the pushedBaseRef assumption in builder.go). The
  # target provisions its own throwaway registry + runner-tools dir. The build
  # container reaches the test's host-loopback git daemon + published registry
  # only via HOST networking, and only because ubuntu-latest runs a host-native
  # dockerd that shares the host network namespace. The test already defaults to
  # "host"; the env below is set explicitly to document the requirement. This job
  # requires a host-native dockerd — it cannot pass against a VM-based daemon like
  # Docker Desktop, where the container cannot reach the host loopback in any mode.
  envbuild-integration:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Go build cache key date (one cache generation per job per day)
        id: cache-date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-envbuild-integration-${{ hashFiles('go.sum', 'Makefile') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-envbuild-integration-${{ hashFiles('go.sum', 'Makefile') }}-
            go-envbuild-integration-
      - name: Docker smoke check
        run: docker run --rm hello-world
      - name: Run envbuild integration test (docker)
        env:
          WARDYN_ENVBUILD_TEST_NETWORK: host
        run: make test-envbuild-integration
        # No continue-on-error: a real regression in the push/finalize/pull
        # cycle must block the build.
      - name: Save Go build cache (push to main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-envbuild-integration-${{ hashFiles('go.sum', 'Makefile') }}-${{ steps.cache-date.outputs.date }}

  # ── Postgres-backed invariant proofs (approval-mint + audit invariants) ───
  # Runs the WARDYN_TEST_PG-gated suite (store/db/secretstore/broker/api +
  # test/apie2e) against a real Postgres. This ran in NO per-PR workflow
  # before (a HIGH finding) — only the nightly `integration-pg` job exercised
  # it. Mirrors that job's postgres service (postgres:17, matching compose/prod).
  test-pg:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: wardyn
          POSTGRES_DB: wardyn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.backend != 'false'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: needs.changes.outputs.backend != 'false'
        with:
          go-version-file: go.mod
          cache: false
      - name: Go build cache key date (one cache generation per job per day)
        if: needs.changes.outputs.backend != 'false'
        id: cache-date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        if: needs.changes.outputs.backend != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-test-pg-${{ hashFiles('go.sum', 'Makefile') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-test-pg-${{ hashFiles('go.sum', 'Makefile') }}-
            go-test-pg-
      # WARDYN_TEST_PG_SUPERUSER asserts what this lane already is: `postgres`,
      # over a URL-form DSN, which can satisfy every precondition the append-only
      # probes guard on. With it set, a probe that would have SKIPPED (and so
      # reported `ok` and exit 0 while proving nothing) FAILS instead — and
      # test-report.sh's skip floor catches the same class from the other side,
      # over the JSON event stream, in case a guard is ever added that does not
      # consult the marker.
      - name: Postgres-gated integration suite (with reports)
        if: needs.changes.outputs.backend != 'false'
        env:
          WARDYN_TEST_PG: postgres://postgres:wardyn@localhost:5432/wardyn?sslmode=disable
          WARDYN_TEST_PG_SUPERUSER: "1"
        run: make test-report-pg
      # The `race` job above strips the DSN (Makefile: `WARDYN_TEST_PG= go test
      # -race ./...`), so the WARDYN_TEST_PG-gated tests are SKIPPED there — and
      # the step above, the only one that sets the DSN, runs without -race. The
      # broker's exactly-once concurrency proofs are therefore the tests most in
      # need of the detector and the ones no gate was pointing it at. This step
      # is that gate (F137).
      - name: PG concurrency proofs (race detector)
        if: needs.changes.outputs.backend != 'false'
        env:
          WARDYN_TEST_PG: postgres://postgres:wardyn@localhost:5432/wardyn?sslmode=disable
        run: make test-race-pg
      - name: Upload PG test reports
        id: upload_pg_test_reports
        if: always() && needs.changes.outputs.backend != 'false'
        # A storage-side error must not fail a job whose tests passed: a 403 from
        # the artifact service reddened a REQUIRED check with all 175 UI test files
        # green, and only a manual re-run cleared it (#372). The step below says so
        # loudly, because a run that is green with no reports attached is the one
        # case where you need them.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pg-test-reports
          path: test/reports/go/pg/**
      - name: Say so if pg-test-reports did not upload
        if: always() && steps.upload_pg_test_reports.outcome == 'failure'
        run: echo "::warning title=Reports missing::pg-test-reports did not upload; this job's result stands on its tests, but the reports are not attached to this run."
      - name: Save Go build cache (push to main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-test-pg-${{ hashFiles('go.sum', 'Makefile') }}-${{ steps.cache-date.outputs.date }}

  # ── supply-chain: trivy image scan (OS + language packages) ───────────────
  # D3. Covers a surface no existing gate does: `govulncheck` reads Go modules,
  # `make npm-audit` reads the UI's production dependencies — NEITHER sees the
  # Debian packages, the node runtime or the globally-installed agent CLI that
  # the agent image actually ships. agent-claude-code is the scan target
  # because it is by far the fattest image we publish (bookworm + node + npm +
  # git/ssh/tmux/socat); wardynd and wardyn-proxy are distroless-static, which
  # carries essentially no OS package surface to scan.
  #
  # --severity CRITICAL --exit-code 1: only CRITICAL fails the build. Anything
  # broader on a Debian base is a gate that is red every week for findings
  # nobody can act on, and a gate people learn to ignore is worse than none.
  # --ignore-unfixed for the same reason: a CRITICAL with no upstream fix
  # available is not something a rebuild can clear, so failing on it just
  # blocks every PR until Debian ships a patch. Accepted-with-a-reason CVEs go
  # in .trivyignore (trivy's own allowlist format — one id per line, each with
  # a comment saying who accepted it and why).
  #
  # Native amd64 build (no QEMU, no platforms list): a CVE in a Debian package
  # is not arch-specific, so scanning one arch finds the same advisories.
  #
  # Scans EVERY image the release publishes, not one of them. Previously only
  # agent-claude-code was scanned — which, after 0.6.2, is the one image we no
  # longer publish. wardynd, wardyn-proxy, agent-codex-cli and agent-aws-sso were
  # shipped to a public registry having never been scanned at all, and the stated
  # rationale (distroless, no OS package surface) was true of two of them.
  trivy:
    name: trivy (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wardynd
            dockerfile: deploy/compose/Dockerfile.wardynd
          - name: wardyn-proxy
            dockerfile: deploy/compose/Dockerfile.proxy
          - name: agent-base
            dockerfile: deploy/images/base/Dockerfile
          - name: agent-codex-cli
            dockerfile: deploy/images/codex-cli/Dockerfile
          - name: agent-aws-sso
            dockerfile: deploy/images/aws-sso/Dockerfile
          - name: agent-vscode
            dockerfile: deploy/images/vscode/Dockerfile
          - name: agent-novnc
            dockerfile: deploy/images/novnc/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the image locally (scan target — never pushed)
        run: |
          # agent-vscode/agent-novnc default FROM wardyn/agent-base:local (never
          # a registry pull) — build that first when this row needs it. Every
          # other row's Dockerfile stands alone.
          case "${{ matrix.name }}" in
            agent-vscode|agent-novnc)
              docker build -f deploy/images/base/Dockerfile -t wardyn/agent-base:local . ;;
          esac
          docker build -f ${{ matrix.dockerfile }} -t wardyn/${{ matrix.name }}:trivy-scan .
      # The aws-sso image's --selftest, against the image that was actually
      # BUILT. Everything it checks (tmux present; both coding-agent shims
      # present AND refusing) is otherwise exercised only by source-level Go
      # tests with fake binaries on a test host's PATH — so a build that COPYs
      # cleanly but drops tmux, or resolves a shim to something that runs,
      # shipped green. tmux is load-bearing here: without it nothing starts the
      # sign-in and every attach falls through to the bare shell the 0.7.5 fix
      # exists to remove. This job already builds the image, so the check is one
      # `docker run` and no extra build. --entrypoint: the image deliberately has
      # none (the runner contract), so the binary is named explicitly.
      - name: agent-run --selftest against the built image
        # codex-cli too: 0.7.5 restructured its PUBLISHED agent-run around the shared
        # boot-session functions in agent-run-lib.sh, and a syntax break in that lib
        # would otherwise ship in an image CI built and never ran.
        if: matrix.name == 'agent-aws-sso' || matrix.name == 'agent-codex-cli'
        run: docker run --rm --entrypoint agent-run wardyn/${{ matrix.name }}:trivy-scan --selftest
      # trivy-action's built-in cache (on by default) restores AND saves the
      # vulnerability DB on every event, so each PR run wrote seven PR-scoped
      # entries (issue #470). It is off here; the DB is restored below and saved
      # only from a green push to main. TRIVY_CACHE_DIR is always this path.
      - name: Trivy DB cache key date
        id: cache-date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore trivy DB cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            cache-trivy-
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wardyn/${{ matrix.name }}:trivy-scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          cache: false
      - name: Save trivy DB cache (push to main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.cache-date.outputs.date }}

  # ── supply-chain gates ────────────────────────────────────────────────────
  # One matrix job in place of five near-identical checkout + setup-go + one-
  # `make` jobs. Each gate still gets its own entry in the checks UI (`gates
  # (staticcheck)` …) and its own runner, and the tool + version + flags stay
  # single-sourced in the Makefile.
  #
  #   govulncheck / staticcheck / licenses — run ALL THREE tag sets, so the
  #     ACTUAL shipped builds (-tags docker: runner/docker + envbuild; -tags
  #     k8s: the k8s confinement substrate) are covered, not just the tagless
  #     subset that a default build sees.
  #   gitleaks — scans this branch's own FULL git history (hence fetch-depth: 0,
  #     which the other gates simply ignore). `make gitleaks` runs the gitleaks
  #     CLI, NOT gitleaks-action: the action's default scan range is only the
  #     triggering push/PR diff even with fetch-depth: 0, which silently made
  #     the "full history" claim false. Do not swap back without fixing its
  #     scan range. `--log-opts="HEAD --full-history --diff-filter=tuxdb"`
  #     (Makefile:gitleaks) keeps the scan to commits reachable from THIS
  #     branch, with gitleaks' own diff filter restated — gitleaks' unscoped
  #     default also walks every other fetched branch, so one branch's finding
  #     used to red every unrelated PR and main alike (#372/G6).
  #     Accepted test/dev-fixture secrets are allowlisted by commit fingerprint
  #     in .gitleaksignore (gitleaks' native mechanism); a fixture whose value
  #     changes every commit (and so churns a fresh fingerprint each time) is
  #     path-scoped in .gitleaks.toml's [allowlist] instead — see that file.
  #   licenses — asciinema is a subprocess tool, not a Go dep, so it is not
  #     checked here.
  # THIRD-PARTY-NOTICES.md + licenses/texts/ must match what regeneration produces.
  # Needs BOTH toolchains (go-licenses for the Go half, pnpm for the UI half), so it
  # cannot ride the setup-go-only `gates` matrix below. It is also the gate that stops
  # an unreviewed dependency landing: a new dep produces new UNTRACKED licence text,
  # this goes red, and the licence lands in the PR diff for CODEOWNERS to read.
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Go build cache key date (one cache generation per job per day)
        id: cache-date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-notices-${{ hashFiles('go.sum', 'Makefile') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-notices-${{ hashFiles('go.sum', 'Makefile') }}-
            go-notices-
      - run: go mod download
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # Frozen lockfile: the notices must describe the pinned tree, not a resolved one.
      - run: pnpm -C ui install --frozen-lockfile
      - run: make notices
      - name: Save Go build cache (push to main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-notices-${{ hashFiles('go.sum', 'Makefile') }}-${{ steps.cache-date.outputs.date }}

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        gate: [govulncheck, staticcheck, licenses, license-headers, gitleaks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Go build cache key date (one cache generation per job per day)
        id: cache-date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/.cache/staticcheck
          key: go-gates-${{ matrix.gate }}-${{ hashFiles('go.sum', 'Makefile') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-gates-${{ matrix.gate }}-${{ hashFiles('go.sum', 'Makefile') }}-
            go-gates-${{ matrix.gate }}-
      - name: make ${{ matrix.gate }}
        run: make ${{ matrix.gate }}
      - name: Save Go build cache (push to main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/.cache/staticcheck
          key: go-gates-${{ matrix.gate }}-${{ hashFiles('go.sum', 'Makefile') }}-${{ steps.cache-date.outputs.date }}

  # ── supply-chain: DCO sign-off ─────────────────────────────────────────────
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Fetch full history so all commits in the PR are visible.
          fetch-depth: 0
      # The commit-range selection stays here (it depends on the GH event); the
      # per-commit Signed-off-by check lives in `make dco`, single-sourced.
      - name: Check DCO sign-off (Signed-off-by on all commits)
        run: |
          BASE=${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          if [ -z "$BASE" ]; then
            # On push, check every commit the push introduced — `-1 HEAD`
            # checked only the tip, so a multi-commit direct push could land
            # unsigned commits behind one signed HEAD. github.event.before is
            # the ref's previous tip; it is all-zeros on a newly created ref,
            # and after a force-push it can name a commit this clone no longer
            # has — both fall back to the single-commit check rather than
            # erroring the job.
            BEFORE=${{ github.event.before }}
            if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' \
               && git cat-file -e "$BEFORE" 2>/dev/null; then
              make dco DCO_RANGE="$BEFORE..HEAD"
            else
              make dco DCO_RANGE="-1 HEAD"
            fi
          else
            # checkout@v4 on pull_request (and on a merge_group, the queue's own
            # merge commits) lands on an auto-generated merge commit, whose message has no Signed-off-by. `make dco` uses
            # --no-merges to exclude that synthetic commit so only real
            # contributor commits are checked (otherwise DCO fails on every PR).
            make dco DCO_RANGE="$BASE..HEAD"
          fi

