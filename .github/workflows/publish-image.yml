name: Publish wardynd image

# Publishes the wardynd control-plane image to GHCR — the lane that makes the
# Helm chart's default image ref (deploy/helm/wardyn/values.yaml:
# ghcr.io/cjohnstoniv/wardynd, tag empty => Chart.yaml's appVersion) resolve
# to a real, pullable image instead of a placeholder that ImagePullBackOffs
# forever (see RELEASING.md "Container images" and
# deploy/helm/wardyn/README.md).
#
# Runs after CI passes on a push to main: ":latest" + ":sha-<short-sha>", the
# CONTINUOUS (main-tip) half of image publishing. It used to run on the push
# itself, in parallel with CI, so a red commit still became :latest — and
# :latest is what deploy/desktop/install.sh and wardyn-desktop.sh pull. Now the
# `gate` job asks scripts/ci-green-for-sha.sh whether every CI push run on the
# commit, on that branch, passed, and `publish-image` runs only on a yes. That
# holds for a manual dispatch too: a dispatch on a red commit skips. :latest
# therefore lags main by one CI run. A vX.Y.Z release TAG push no
# longer triggers this file — that is now .github/workflows/release.yml's job
# (cosign-signed, all five images this release ships, not wardynd alone). The
# two used to both fire on the same tag push, racing to publish the identical
# wardynd:X.Y.Z ref, one signed and one not; release.yml is the single
# tag-triggered publisher now.
#
# workflow_dispatch's extra_tag backfill is still real and unrelated to that
# split: a release tag that predates EITHER workflow (v0.4.4 and older) can
# NOT be re-run at its own ref (neither workflow file exists there), so
# dispatching THIS workflow on main with extra_tag=0.4.4 publishes main's
# HEAD under that old tag (acceptable: 0.4.4 is main's lineage). Manually
# dispatching this workflow AGAINST a tag ref (github.ref_type reads "tag"
# exactly as a push would) works only for a 0.0.x to 0.4.x tag: the "Compute
# image tags" step refuses any other tag ref, because release.yml owns the
# release image tags. ci.yml has no push run on release/**
# (#1461), so a dispatch on a tag that exists only on release/X.Y finds no push
# run and skips; that fails closed.
#
# Deliberately its OWN workflow file, not a job on ci.yml: ci.yml's push
# trigger only ever matched branches (main/master), never tags, and widening
# it to tags would re-run the ENTIRE PR/push job matrix (build, ui-e2e,
# envbuild-integration, test-pg, ...) on every release-tag push for no
# reason — that matrix already ran (and had to pass) on the commit before it
# was tagged. Never runs on pull_request: a PR must never publish.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Additional bare tag to publish (e.g. 0.4.4 to backfill a pre-workflow release)"
        required: false
        default: ""

# packages: write is the only elevation over ci.yml's read-only default —
# GHCR push needs it; GITHUB_TOKEN carries it once granted here, so this
# needs no PAT secret to configure.
permissions:
  contents: read
  packages: write
  # cosign keyless needs an OIDC token. Without this, :latest was published
  # UNSIGNED on every merge to main — and :latest is what deploy/desktop/install.sh
  # pulls, so the one image a desktop install actually fetches was the one nobody
  # could verify.
  id-token: write

jobs:
  # Fails closed: publish-image needs green == 'true', so a red, pending or
  # missing CI run skips it and an API error fails this job. The `if` drops the
  # CI runs that can never publish before a runner starts: pull requests
  # (including a fork's branch named main) and anything not green.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      green: ${{ steps.ci.outputs.green }}
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require green CI on the commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Only the triggering branch's runs, so a run of the same commit on
          # another branch (feature/**, master) never decides main's :latest.
          # ci.yml no longer runs on release/** pushes (#1461): a release is
          # judged by tree in release.yml, not here. Empty on a dispatch against
          # a tag ref, which counts every branch's runs.
          BRANCH: ${{ github.event.workflow_run.head_branch || (github.ref_type == 'branch' && github.ref_name) || '' }}
        run: |
          rc=0
          scripts/ci-green-for-sha.sh "$SHA" "$BRANCH" || rc=$?
          case "$rc" in
            0) green=true ;;
            1) green=false; echo "::notice::CI is not green on $SHA; not publishing" ;;
            *) exit "$rc" ;;
          esac
          { echo "green=$green"; echo "sha=$SHA"; } >> "$GITHUB_OUTPUT"

  publish-image:
    needs: gate
    if: needs.gate.outputs.green == 'true'
    # One publisher at a time and none cancelled mid-push, so the main-tip check in
    # "Compute image tags" is made after any earlier publish has finished.
    concurrency:
      group: publish-image
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      # The commit CI passed on, not the branch tip: under workflow_run,
      # github.sha is main's tip at the time this run started.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      # Same QEMU + buildx pair release.yml uses for its two-platform index.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub (skipped when the secret is absent, e.g. a fork)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Tags: always a short-sha; "latest" added on main; the bare semver
      # (v-prefix stripped, matching Chart.yaml's appVersion) added on a
      # vX.Y.Z tag. Hand-rolled in a few lines rather than pulling in
      # docker/metadata-action for three strings. Via env, not `${{ }}`
      # inside the script body.
      - name: Compute image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EXTRA_TAG: ${{ inputs.extra_tag }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          # Release image tags (bare X.Y.Z and X.Y.Z-rc.N) are published by release.yml, signed and attested.
          # This lane writes only the pre-workflow backfill range 0.0.x to 0.4.x, whether the name comes from
          # extra_tag or from a tag ref; anything else (0.10.0, 0.10.0-rc.18, latest, sha-*, v*) is refused.
          backfill='^0\.[0-4]\.[0-9]+$'
          if [ -n "${EXTRA_TAG:-}" ] && ! [[ "$EXTRA_TAG" =~ $backfill ]]; then
            echo "::error::extra_tag must be a 0.0.x to 0.4.x backfill tag (got ${EXTRA_TAG}); release tags come from release.yml"; exit 1
          fi
          if [ "$REF_TYPE" = "tag" ] && ! [[ "${REF_NAME#v}" =~ $backfill ]]; then
            echo "::error::refusing to publish tag ref ${REF_NAME}: release.yml owns release image tags; only 0.0.x to 0.4.x backfills run here"; exit 1
          fi
          tags=("ghcr.io/cjohnstoniv/wardynd:sha-${SHA::7}")
          if [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" = "main" ]; then
            # :latest only ever moves forward: a run for a commit that is no longer main's tip (its CI finished
            # after a newer commit's) must not point :latest back at it. The newer commit's own run publishes.
            tip="$(git ls-remote origin refs/heads/main | cut -f1)"
            [ -n "$tip" ] || { echo "::error::could not read main's tip"; exit 1; }
            if [ "$tip" = "$SHA" ]; then
              tags+=("ghcr.io/cjohnstoniv/wardynd:latest")
            else
              echo "::notice::$SHA is not main's tip ($tip); not moving :latest"
            fi
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            tags+=("ghcr.io/cjohnstoniv/wardynd:${REF_NAME#v}")
          fi
          if [ -n "${EXTRA_TAG:-}" ]; then
            tags+=("ghcr.io/cjohnstoniv/wardynd:${EXTRA_TAG}")
          fi
          {
            # The build pushes only the per-commit tag. The moving and release-named tags are applied after the
            # image has been checked and signed, so a bad image never becomes :latest.
            echo "first_tag=${tags[0]}"
            echo "later_tags<<TAGEOF"
            printf '%s\n' "${tags[@]:1}"
            echo "TAGEOF"
            # The commit stamped into the binaries; empty on a tag ref, which keeps the bare version.
            if [ "$REF_TYPE" = "tag" ]; then echo "revision="; else echo "revision=${SHA}"; fi
          } >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          file: deploy/compose/Dockerfile.wardynd
          push: true
          # Both laptop architectures, so :latest and :sha-<n> are an index like the release tags.
          platforms: linux/amd64,linux/arm64
          # No attestation manifests in the index; see release.yml's `provenance: false` note.
          provenance: false
          # The build context has no .git, so the commit goes in by build arg: /healthz and `wardyn --version`
          # then report <version>+<commit>. Empty on a tag ref, which keeps the bare version.
          build-args: |
            REVISION=${{ steps.tags.outputs.revision }}
          tags: ${{ steps.tags.outputs.first_tag }}
      # The per-commit image must report the commit it was built from, in every binary a person can run: the
      # in-container CLI, the daemon (its /healthz reads the same internal/version string) and the host CLIs
      # that scripts/up.sh installs as bin/wardyn. A tag ref keeps the bare version.
      - name: Check the image reports its revision
        env:
          IMAGE_REF: ghcr.io/cjohnstoniv/wardynd@${{ steps.build.outputs.digest }}
          REVISION: ${{ steps.tags.outputs.revision }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # reports NAME VERSION: a branch build's version ends in +<9 characters of the commit>; a tag ref
          # (empty REVISION) reports exactly the release version its tag names. Empty never passes.
          reports() {
            if [ -n "$REVISION" ]; then
              case "$2" in *"+${REVISION::9}") ;; *) echo "::error::$1 printed '$2', want it to end in +${REVISION::9}"; exit 1;; esac
            elif [ "$2" != "${REF_NAME#v}" ]; then
              echo "::error::$1 printed '$2', want the release version ${REF_NAME#v}"; exit 1
            fi
          }
          # Every binary is run inside the image it came from, pulled by digest, with no network, no host
          # mount and no credentials: this job is logged in to the registry and holds the packages and signing
          # permissions, so nothing taken from the unsigned image may run on the runner itself.
          run_in_image() {
            docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --entrypoint "$1" "$IMAGE_REF" version
          }
          # Each command is captured on its own, so its exit status stops the step.
          cli="$(run_in_image /usr/local/bin/wardyn)" || { echo "::error::wardyn version failed in the image"; exit 1; }
          got="$(run_in_image /host/wardyn-linux-amd64)" || { echo "::error::the host CLI's version command failed in the image"; exit 1; }
          reports "wardyn in the image" "$cli"
          reports "the linux/amd64 host CLI in the image" "$got"
          if [ -n "$REVISION" ]; then
            # The files are copied out and read as data only, never executed here. The host CLIs are built
            # with -trimpath, which leaves the linker flags out of the build info, so look for the stamped
            # commit itself: nothing but the stamp puts those 40 characters in a binary.
            cid="$(docker create --platform linux/amd64 "$IMAGE_REF")"
            mkdir "$RUNNER_TEMP/host"
            docker cp "$cid:/host/." "$RUNNER_TEMP/host"
            docker cp "$cid:/wardynd" "$RUNNER_TEMP/wardynd"
            docker rm "$cid" >/dev/null
            # Every file the image is built to carry is checked, so one that is missing fails here rather than
            # dropping out of a glob: the daemon, the generic host CLI that `make setup` falls back to, and one
            # host CLI for each of the four supported platforms (deploy/compose/Dockerfile.wardynd). A symbolic
            # link is not a copied-out file, so only regular files are read.
            expected=("$RUNNER_TEMP/wardynd" "$RUNNER_TEMP/host/wardyn")
            for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
              expected+=("$RUNNER_TEMP/host/wardyn-$platform")
            done
            for f in "${expected[@]}"; do
              if [ -L "$f" ] || [ ! -f "$f" ]; then
                echo "::error::$(basename "$f") is missing from the image or is not a regular file"; exit 1
              fi
              grep -aqF "$REVISION" "$f" \
                || { echo "::error::$(basename "$f") was not stamped with revision ${REVISION}"; exit 1; }
            done
          fi
          echo "image reports: $got"
      # Sign by DIGEST, the same way release.yml does, so :latest and :sha-<n>
      # carry a verifiable signature rather than being the one publishing lane
      # that produced unsigned artifacts.
      - name: Sign the pushed image (keyless, by digest)
        env:
          IMAGE_REF: ghcr.io/cjohnstoniv/wardynd@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"
      # Only now do :latest and the other names move, each pointing at the digest that was checked and signed.
      # Copying an index by digest keeps its digest, which is asserted so the signature covers every name.
      - name: Point the remaining tags at the signed image
        env:
          IMAGE_REF: ghcr.io/cjohnstoniv/wardynd@${{ steps.build.outputs.digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
          LATER_TAGS: ${{ steps.tags.outputs.later_tags }}
        run: |
          set -euo pipefail
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker buildx imagetools create --tag "$t" "$IMAGE_REF"
            now="$(docker buildx imagetools inspect "$t" --format '{{.Manifest.Digest}}')"
            [ "$now" = "$DIGEST" ] || { echo "::error::$t points at $now, want the signed $DIGEST"; exit 1; }
          done <<< "$LATER_TAGS"
