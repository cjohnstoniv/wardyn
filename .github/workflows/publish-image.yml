name: Publish wardynd image

# Publishes the wardynd control-plane image to GHCR — the lane that makes the
# Helm chart's default image ref (deploy/helm/wardyn/values.yaml:
# ghcr.io/cjohnstoniv/wardynd, tag empty => Chart.yaml's appVersion) resolve
# to a real, pullable image instead of a placeholder that ImagePullBackOffs
# forever (see RELEASING.md "Container images" and
# deploy/helm/wardyn/README.md).
#
# Runs on push to main only: ":latest" + ":sha-<short-sha>", the CONTINUOUS
# (unsigned, main-tip) half of image publishing. A vX.Y.Z release TAG push no
# longer triggers this file — that is now .github/workflows/release.yml's job
# (cosign-signed, all five images this release ships, not wardynd alone). The
# two used to both fire on the same tag push, racing to publish the identical
# wardynd:X.Y.Z ref, one signed and one not; release.yml is the single
# tag-triggered publisher now.
#
# workflow_dispatch's extra_tag backfill is still real and unrelated to that
# split: a release tag that predates EITHER workflow (v0.4.4 and older) can
# NOT be re-run at its own ref (neither workflow file exists there), so
# dispatching THIS workflow on main with extra_tag=0.4.4 publishes main's
# HEAD under that old tag (acceptable: 0.4.4 is main's lineage). Manually
# dispatching this workflow AGAINST a v0.4.5+ tag ref still works too
# (github.ref_type reads "tag" exactly as a push would) — it is simply no
# longer the AUTOMATIC path for one.
#
# Deliberately its OWN workflow file, not a job on ci.yml: ci.yml's push
# trigger only ever matched branches (main/master), never tags, and widening
# it to tags would re-run the ENTIRE PR/push job matrix (build, ui-e2e,
# envbuild-integration, test-pg, ...) on every release-tag push for no
# reason — that matrix already ran (and had to pass) on the commit before it
# was tagged. Never runs on pull_request: a PR must never publish.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Additional bare tag to publish (e.g. 0.4.4 to backfill a pre-workflow release)"
        required: false
        default: ""

# packages: write is the only elevation over ci.yml's read-only default —
# GHCR push needs it; GITHUB_TOKEN carries it once granted here, so this
# needs no PAT secret to configure.
permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: always a short-sha; "latest" added on main; the bare semver
      # (v-prefix stripped, matching Chart.yaml's appVersion) added on a
      # vX.Y.Z tag. Hand-rolled in a few lines rather than pulling in
      # docker/metadata-action for three strings. Via env, not `${{ }}`
      # inside the script body (ci.yml's screenshots-fresh job sets this
      # precedent).
      - name: Compute image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EXTRA_TAG: ${{ inputs.extra_tag }}
        run: |
          tags=("ghcr.io/cjohnstoniv/wardynd:sha-${GITHUB_SHA::7}")
          if [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" = "main" ]; then
            tags+=("ghcr.io/cjohnstoniv/wardynd:latest")
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            tags+=("ghcr.io/cjohnstoniv/wardynd:${REF_NAME#v}")
          fi
          if [ -n "${EXTRA_TAG:-}" ]; then
            tags+=("ghcr.io/cjohnstoniv/wardynd:${EXTRA_TAG}")
          fi
          {
            echo "tags<<TAGEOF"
            printf '%s\n' "${tags[@]}"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/compose/Dockerfile.wardynd
          push: true
          tags: ${{ steps.tags.outputs.tags }}
