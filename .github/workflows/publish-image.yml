name: Publish wardynd image

# Publishes the wardynd control-plane image to GHCR — the lane that makes the
# Helm chart's default image ref (deploy/helm/wardyn/values.yaml:
# ghcr.io/cjohnstoniv/wardynd, tag empty => Chart.yaml's appVersion) resolve
# to a real, pullable image instead of a placeholder that ImagePullBackOffs
# forever (see RELEASING.md "Container images" and
# deploy/helm/wardyn/README.md).
#
# Runs after CI passes on a push to main: ":latest" + ":sha-<short-sha>", the
# CONTINUOUS (main-tip) half of image publishing. It used to run on the push
# itself, in parallel with CI, so a red commit still became :latest — and
# :latest is what deploy/desktop/install.sh and wardyn-desktop.sh pull. Now the
# `gate` job asks scripts/ci-green-for-sha.sh whether every CI push run on the
# commit, on that branch, passed, and `publish-image` runs only on a yes. That
# holds for a manual dispatch too: a dispatch on a red commit skips. :latest
# therefore lags main by one CI run. A vX.Y.Z release TAG push no
# longer triggers this file — that is now .github/workflows/release.yml's job
# (cosign-signed, all five images this release ships, not wardynd alone). The
# two used to both fire on the same tag push, racing to publish the identical
# wardynd:X.Y.Z ref, one signed and one not; release.yml is the single
# tag-triggered publisher now.
#
# workflow_dispatch's extra_tag backfill is still real and unrelated to that
# split: a release tag that predates EITHER workflow (v0.4.4 and older) can
# NOT be re-run at its own ref (neither workflow file exists there), so
# dispatching THIS workflow on main with extra_tag=0.4.4 publishes main's
# HEAD under that old tag (acceptable: 0.4.4 is main's lineage). Manually
# dispatching this workflow AGAINST a v0.4.5+ tag ref still works too
# (github.ref_type reads "tag" exactly as a push would) — it is simply no
# longer the AUTOMATIC path for one.
#
# Deliberately its OWN workflow file, not a job on ci.yml: ci.yml's push
# trigger only ever matched branches (main/master), never tags, and widening
# it to tags would re-run the ENTIRE PR/push job matrix (build, ui-e2e,
# envbuild-integration, test-pg, ...) on every release-tag push for no
# reason — that matrix already ran (and had to pass) on the commit before it
# was tagged. Never runs on pull_request: a PR must never publish.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Additional bare tag to publish (e.g. 0.4.4 to backfill a pre-workflow release)"
        required: false
        default: ""

# packages: write is the only elevation over ci.yml's read-only default —
# GHCR push needs it; GITHUB_TOKEN carries it once granted here, so this
# needs no PAT secret to configure.
permissions:
  contents: read
  packages: write
  # cosign keyless needs an OIDC token. Without this, :latest was published
  # UNSIGNED on every merge to main — and :latest is what deploy/desktop/install.sh
  # pulls, so the one image a desktop install actually fetches was the one nobody
  # could verify.
  id-token: write

jobs:
  # Fails closed: publish-image needs green == 'true', so a red, pending or
  # missing CI run skips it and an API error fails this job. The `if` drops the
  # CI runs that can never publish before a runner starts: pull requests
  # (including a fork's branch named main) and anything not green.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      green: ${{ steps.ci.outputs.green }}
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require green CI on the commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Only the triggering branch's runs: a release fast-forwards the same
          # commit onto release/X.Y, whose run may still be going. Empty on a
          # dispatch against a tag ref, which counts every branch's runs.
          BRANCH: ${{ github.event.workflow_run.head_branch || (github.ref_type == 'branch' && github.ref_name) || '' }}
        run: |
          rc=0
          scripts/ci-green-for-sha.sh "$SHA" "$BRANCH" || rc=$?
          case "$rc" in
            0) green=true ;;
            1) green=false; echo "::notice::CI is not green on $SHA; not publishing" ;;
            *) exit "$rc" ;;
          esac
          { echo "green=$green"; echo "sha=$SHA"; } >> "$GITHUB_OUTPUT"

  publish-image:
    needs: gate
    if: needs.gate.outputs.green == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The commit CI passed on, not the branch tip: under workflow_run,
      # github.sha is main's tip at the time this run started.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: always a short-sha; "latest" added on main; the bare semver
      # (v-prefix stripped, matching Chart.yaml's appVersion) added on a
      # vX.Y.Z tag. Hand-rolled in a few lines rather than pulling in
      # docker/metadata-action for three strings. Via env, not `${{ }}`
      # inside the script body.
      - name: Compute image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EXTRA_TAG: ${{ inputs.extra_tag }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          tags=("ghcr.io/cjohnstoniv/wardynd:sha-${SHA::7}")
          if [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" = "main" ]; then
            tags+=("ghcr.io/cjohnstoniv/wardynd:latest")
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            tags+=("ghcr.io/cjohnstoniv/wardynd:${REF_NAME#v}")
          fi
          if [ -n "${EXTRA_TAG:-}" ]; then
            tags+=("ghcr.io/cjohnstoniv/wardynd:${EXTRA_TAG}")
          fi
          {
            echo "tags<<TAGEOF"
            printf '%s\n' "${tags[@]}"
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          file: deploy/compose/Dockerfile.wardynd
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      # Sign by DIGEST, the same way release.yml does, so :latest and :sha-<n>
      # carry a verifiable signature rather than being the one publishing lane
      # that produced unsigned artifacts.
      - name: Sign the pushed image (keyless, by digest)
        env:
          IMAGE_REF: ghcr.io/cjohnstoniv/wardynd@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"
