name: Nightly Go build cache
description: >-
  Restores the Go module and build caches that ci.yml's `go-<suite>-` entry
  last saved on main, and never saves one. The repository's Actions cache is
  at its size limit, so a nightly job borrows the entry of the ci.yml suite
  whose build tags it shares and adds nothing of its own. The exact key never
  exists, so the restore-keys prefix does the work and takes the newest entry
  of that suite, whatever key scheme ci.yml saves it under. Go's test-result
  cache is cleared after the restore, so no test is replayed from ci.yml. Place it after
  setup-go. The path list is ci.yml's, byte for byte: a cache entry is found
  only by a restore that names the same paths as its save.
inputs:
  suite:
    description: The ci.yml Go suite whose cache to borrow (unit, docker, k8s, conformance-docker).
    required: true
runs:
  using: composite
  steps:
    - name: Restore the Go module cache saved by ci.yml
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: gomod-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: gomod-${{ runner.os }}-
    - name: Restore the Go caches saved by ci.yml
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/.cache/golangci-lint
        key: go-${{ inputs.suite }}-nightly-restore-only
        restore-keys: |
          go-${{ inputs.suite }}-
    # The go-build cache also holds Go's test-result cache, which would replay ci.yml's results
    # instead of running the nightly's suites. Keep the compiled objects, drop the results.
    - name: Drop the restored test-result cache
      shell: bash
      run: go clean -testcache
