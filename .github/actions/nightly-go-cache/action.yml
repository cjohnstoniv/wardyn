name: Nightly Go build cache
description: >-
  Restores the Go module and build caches for one nightly job, and saves them
  when the run is a scheduled or dispatched one on main (a train PR's called
  run only restores, so it never writes a cache entry no other ref can read).
  The key is the one ci.yml uses: per job and OS, the go.mod/go.sum hash, then
  the run id, so every main run writes a fresh entry and restore-keys fall back
  to the newest entry of the same job, then of the same job on any dependency
  set. Place it after setup-go.
inputs:
  job:
    description: The nightly job's id, the first part of the cache key.
    required: true
  save:
    description: >-
      "true" saves at the end of a successful job. The caller passes the
      main-only expression, because `github.event_name` inside a called
      workflow is the caller's event.
    default: "false"
runs:
  using: composite
  steps:
    - name: Restore and save the Go caches (main scheduled or dispatched run)
      if: inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ inputs.job }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}
        restore-keys: |
          go-${{ inputs.job }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
          go-${{ inputs.job }}-${{ runner.os }}-
    - name: Restore the Go caches
      if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ inputs.job }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}
        restore-keys: |
          go-${{ inputs.job }}-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
          go-${{ inputs.job }}-${{ runner.os }}-
