name: Nightly Go build cache
description: >-
  Restores the Go module and build caches that ci.yml's `go-<suite>-` entry
  last saved on main, and never saves one. The repository's Actions cache is
  at its size limit, so a nightly job borrows the entry of the ci.yml suite
  whose build tags it shares and adds nothing of its own. The exact key never
  exists, so the restore-keys prefix does the work and takes the newest entry
  of that suite, whatever key scheme ci.yml saves it under. Place it after
  setup-go.
inputs:
  suite:
    description: The ci.yml Go suite whose cache to borrow (unit, docker, k8s, conformance-docker).
    required: true
runs:
  using: composite
  steps:
    - name: Restore the Go caches saved by ci.yml
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ inputs.suite }}-nightly-restore-only
        restore-keys: |
          go-${{ inputs.suite }}-
