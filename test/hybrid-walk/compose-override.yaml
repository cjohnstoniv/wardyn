#
# scripts/hybrid-walk.sh's laptop leg needs WARDYN_ORG_URL to be a genuinely
# loopback address (cmd/wardynd/boot_posture.go's validateHybridPosture
# refuses a plaintext org URL whose host is not loopback), while the relay it
# names has to reach the kind cluster's loopback-only NodePort on the HOST
# (deploy/kind/quickstart-kind-config.yaml's `listenAddress: "127.0.0.1"`
# means nothing but a HOST process can reach it).
#
# Both are true at once because the relay is a SIDECAR CONTAINER that joins
# wardynd's OWN network namespace (`docker run --network container:<wardynd
# container>`, started by the script itself once wardynd is up — see that
# file's "THE PARTITION MECHANISM"): binding 127.0.0.1 there is wardynd's own
# loopback, reachable from nothing else, and the relay reaches the host's
# NodePort via host-gateway on its OWN `--add-host` flag (the same documented
# mechanism scripts/run-host.sh's WARDYN_CONTROL_PLANE_URL and the proxy
# sidecar's own ExtraHosts already rely on, and scripts/test-podman.sh's own
# probe pins that it resolves — NOT the host.docker.internal hop
# scripts/survival-walk.sh's header found unreliable, which was a bare
# outbound curl from wardynd itself, a different hop). Nothing needs
# declaring here for wardynd any more: it never reaches outside its own
# network namespace, so this file has no `extra_hosts` entry to add.
services: {}
