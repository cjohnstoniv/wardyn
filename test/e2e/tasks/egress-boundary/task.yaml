# Wardyn e2e task — egress-boundary
# The oracle IS the task: solution.sh runs as the agent process and probes the
# governed egress boundary through the proxy, writing evidence files into the
# workspace. No coding model is involved.
name: egress-boundary
agent: oracle
needs_model: false
interactive: false
launch: manual
tiers: [CC1, CC2, CC3]
grader_image: alpine:3.20
prompt: |
  (oracle task) Probe the egress boundary from inside the sandbox and record the
  results as files in the workspace: allowed_code.txt, denied_probe.txt,
  metadata_rc.txt, metadata_connects.txt. See solution.sh.
# NOTE: the grader below only checks the in-workspace EVIDENCE files, and that is the
# only assertion on allow/block. The Go orchestrator (live/live_test.go) reads the
# run's egress.allow / egress.deny / egress.hold audit events and LOGS their counts as
# best-effort corroboration (the proxy-to-control-plane callback may not route on a
# VM-based docker); it asserts nothing on them.
