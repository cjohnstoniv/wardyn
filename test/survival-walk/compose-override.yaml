# Compose OVERRIDE for scripts/survival-walk.sh only (T-40, #700's compose
# leg). Never referenced by deploy/compose/docker-compose.yaml itself and
# never applied to an operator's own stack — survival-walk.sh is the only
# caller, and it always passes this file alongside the base one with a
# dedicated `-p` project name.
#
# Lives under test/, not deploy/compose, on purpose: this file's own
# WARDYN_AWS_SSO_ENDPOINT_OVERRIDE/WARDYN_ALLOW_TEST_ENDPOINTS lines are the
# AWS SSO TEST-endpoint hatch (THREAT-MODEL residual #45), and
# scripts/test-repo-guards.sh's guard 6 refuses either name in any file under
# deploy/helm or deploy/compose — a SHIPPED deployment artifact must never be
# one edit away from trusting an arbitrary server as AWS. test/sso-roles/
# compose-override.yaml is the same precedent (a compose override that lives
# beside the test fixture it serves, not beside the shipped compose file).
#
# It exists because the base docker-compose.yaml's `wardynd` service does NOT
# reference WARDYN_ALLOW_TEST_ENDPOINTS, WARDYN_AWS_SSO_ENDPOINT_OVERRIDE,
# WARDYN_BEDROCK_BASE_URL or WARDYN_CREDENTIAL_REAUTH_TIMEOUT anywhere in its
# own `environment:` block — setting them as shell env vars before
# `docker compose up` does nothing on its own (compose only interpolates
# `${VAR}` references a file's own YAML already contains; it is not a blanket
# host-env passthrough). This file's `environment:` block below declares them
# directly, merged into the base service's own map.
#
# WARDYN_SURVIVAL_FAKE_URL points at the fake (test/awsssofake/cmd) by
# CONTAINER NAME on wardynd's own control-plane network
# (survival-walk.sh starts it there, alongside wardynd) — not
# host.docker.internal. An earlier version of this file used
# host.docker.internal (with an ExtraHosts entry here to match) for BOTH this
# and the sandbox-facing capture flow; both were abandoned for real,
# live-observed reasons documented in survival-walk.sh's own header (an SSRF-
# guard refusal for the sandbox path, then a Docker Desktop/WSL2
# host-gateway reachability failure for wardynd's own refresh calls).
services:
  wardynd:
    environment:
      WARDYN_ALLOW_TEST_ENDPOINTS: "true"
      WARDYN_AWS_SSO_ENDPOINT_OVERRIDE: "${WARDYN_SURVIVAL_FAKE_URL}"
      WARDYN_BEDROCK_BASE_URL: "${WARDYN_SURVIVAL_FAKE_URL}"
      WARDYN_CREDENTIAL_REAUTH_TIMEOUT: "${WARDYN_CREDENTIAL_REAUTH_TIMEOUT:-30s}"
