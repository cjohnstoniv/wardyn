    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Desktop</title>
  </head>
  <body>
    <div id="desktop-root"></div>
    <script type="module" src="/src/desktop/main.tsx"></script>
  </body>
</html>
