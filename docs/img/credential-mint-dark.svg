<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1060" width="1260" height="1060" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Minting a credential an approval covers</title>
  <desc id="desc">The approver's decision is recorded first. The run's proxy or git helper later asks the token broker to mint; the broker snapshots the approved grant, mints, and returns the credential only from the transaction that re-reads the approval unchanged and, for a once-only grant (not a run lease), writes minted_jti.</desc>
  <style>
    .bg { fill: #0d1117; stroke: #3d444d; }
    .zone { fill: #161b22; stroke: #3d444d; stroke-width: 1.5; }
    .card { fill: #0d1117; stroke: #9198a1; stroke-width: 1.5; }
    .sand { fill: #0d2b28; stroke: #3cc6b6; stroke-width: 2; stroke-dasharray: 8 5; }
    .ok { fill: #0d2b28; stroke: #3cc6b6; stroke-width: 2; }
    .held { fill: #2e2410; stroke: #d29922; stroke-width: 2; }
    .deny { fill: #0d1117; stroke: #ff7b72; stroke-width: 1.5; }
    .outline { fill: none; stroke: #9198a1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .frame { fill: none; stroke: #9198a1; stroke-width: 1.5; }
    .tab { fill: #161b22; stroke: #9198a1; stroke-width: 1.5; }
    .halo { paint-order: stroke; stroke: #0d1117; stroke-width: 5px; stroke-linejoin: round; }
    .dot { fill: #9198a1; }
    .pill { fill: #3cc6b6; stroke: none; }
    .pt { fill: #0d1117; }
    .t { fill: #e6edf3; }
    .m { fill: #9198a1; }
    .a { fill: #3cc6b6; }
    .r { fill: #ff7b72; }
    .h { fill: #d29922; }
    .ln { fill: none; stroke: #9198a1; stroke-width: 2; }
    .lt { fill: none; stroke: #3cc6b6; stroke-width: 2.5; }
    .lr { fill: none; stroke: #ff7b72; stroke-width: 2; }
    .lh { fill: none; stroke: #d29922; stroke-width: 2; }
    .life { fill: none; stroke: #3d444d; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .edge { fill: none; stroke: #9198a1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .dash { stroke-dasharray: 6 4; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>
  <defs><marker id="h-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9198a1"/></marker><marker id="h-lt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3cc6b6"/></marker><marker id="h-lr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff7b72"/></marker><marker id="h-lh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d29922"/></marker></defs>
  <rect class="bg" x="0.5" y="0.5" width="1259" height="1059" rx="10"/>
  <path class="life" d="M110 68 L110 1040"/>
  <path class="life" d="M318 68 L318 1040"/>
  <path class="life" d="M526 68 L526 1040"/>
  <path class="life" d="M734 68 L734 1040"/>
  <path class="life" d="M942 68 L942 1040"/>
  <path class="life" d="M1150 68 L1150 1040"/>
  <rect class="zone" x="18.0" y="24" width="184" height="44" rx="8"/>
  <text class="t" x="110" y="52" font-size="15" text-anchor="middle" font-weight="600">Approver</text>
  <rect class="zone" x="226.0" y="24" width="184" height="44" rx="8"/>
  <text class="t" x="318" y="52" font-size="15" text-anchor="middle" font-weight="600">wardynd API</text>
  <rect class="zone" x="434.0" y="24" width="184" height="44" rx="8"/>
  <text class="t" x="526" y="43" font-size="14" text-anchor="middle" font-weight="600">Sandbox</text>
  <text class="m" x="526" y="60" font-size="12" text-anchor="middle">proxy or git helper</text>
  <rect class="zone" x="642.0" y="24" width="184" height="44" rx="8"/>
  <text class="t" x="734" y="52" font-size="15" text-anchor="middle" font-weight="600">Token broker</text>
  <rect class="zone" x="850.0" y="24" width="184" height="44" rx="8"/>
  <text class="t" x="942" y="52" font-size="15" text-anchor="middle" font-weight="600">Postgres</text>
  <rect class="zone" x="1058.0" y="24" width="184" height="44" rx="8"/>
  <text class="t" x="1150" y="43" font-size="14" text-anchor="middle" font-weight="600">Credential issuer</text>
  <text class="m" x="1150" y="60" font-size="12" text-anchor="middle">for example a GitHub App</text>
  <text class="t halo mono" x="214.0" y="88" font-size="13" text-anchor="middle">POST /approvals/{id}/approve</text>
  <path class="ln" d="M112 96 L316 96" marker-end="url(#h-ln)"/>
  <text class="t halo" x="630.0" y="132" font-size="13" text-anchor="middle">approval PENDING to APPROVED</text>
  <text class="m halo" x="630.0" y="149" font-size="13" text-anchor="middle">the decision only; nothing is minted</text>
  <path class="ln" d="M320 157 L940 157" marker-end="url(#h-ln)"/>
  <text class="t halo mono" x="630.0" y="193" font-size="13" text-anchor="middle">MintForGrant(run identity, grant)</text>
  <path class="ln" d="M528 201 L732 201" marker-end="url(#h-ln)"/>
  <rect class="zone" x="456" y="225" width="764" height="46" rx="4"/>
  <text class="t" x="838.0" y="241" font-size="13" text-anchor="middle">A grant without requires_approval skips the approval and mints directly</text>
  <text class="m" x="838.0" y="259" font-size="13" text-anchor="middle">auto-mint, audited per mint</text>
  <text class="t halo" x="838.0" y="301" font-size="13" text-anchor="middle">snapshot grant and approval</text>
  <text class="m halo" x="838.0" y="318" font-size="13" text-anchor="middle">APPROVED, minted_jti empty or a run lease</text>
  <path class="ln" d="M736 326 L940 326" marker-end="url(#h-ln)"/>
  <text class="t halo" x="838.0" y="396" font-size="13" text-anchor="middle">no eligible row</text>
  <path class="ln dash" d="M940 404 L736 404" marker-end="url(#h-ln)"/>
  <text class="t halo" x="630.0" y="440" font-size="13" text-anchor="middle">refused: no widening, no re-mint without a run lease</text>
  <path class="lr dash" d="M732 448 L528 448" marker-end="url(#h-lr)"/>
  <path class="edge" d="M30 480 L1230 480"/>
  <text class="t halo" x="838.0" y="518" font-size="13" text-anchor="middle">the exact approved scope</text>
  <path class="ln dash" d="M940 526 L736 526" marker-end="url(#h-ln)"/>
  <text class="t halo" x="942.0" y="562" font-size="13" text-anchor="middle">mint the credential</text>
  <text class="m halo" x="942.0" y="579" font-size="13" text-anchor="middle">approved scope; a new GitHub token lasts at most 1 h</text>
  <path class="ln" d="M736 587 L1148 587" marker-end="url(#h-ln)"/>
  <text class="t halo" x="942.0" y="623" font-size="13" text-anchor="middle">token</text>
  <path class="ln dash" d="M1148 631 L736 631" marker-end="url(#h-ln)"/>
  <text class="t halo" x="838.0" y="667" font-size="13" text-anchor="middle">BEGIN; re-read grant and approval</text>
  <text class="m halo" x="838.0" y="684" font-size="13" text-anchor="middle">must equal the snapshot</text>
  <path class="ln" d="M736 692 L940 692" marker-end="url(#h-ln)"/>
  <text class="t halo" x="942.0" y="762" font-size="13" text-anchor="middle">try to revoke the token</text>
  <text class="m halo" x="942.0" y="779" font-size="13" text-anchor="middle">discarded, never returned</text>
  <path class="lr" d="M736 787 L1148 787" marker-end="url(#h-lr)"/>
  <path class="edge" d="M60 819 L1200 819"/>
  <text class="t halo" x="838.0" y="857" font-size="13" text-anchor="middle">SET minted_jti</text>
  <text class="m halo" x="838.0" y="874" font-size="13" text-anchor="middle">only while it is still empty (not under a run lease)</text>
  <path class="ln" d="M736 882 L940 882" marker-end="url(#h-ln)"/>
  <text class="t halo" x="838.0" y="918" font-size="13" text-anchor="middle">COMMIT</text>
  <path class="ln" d="M736 926 L940 926" marker-end="url(#h-ln)"/>
  <text class="t halo" x="630.0" y="962" font-size="13" text-anchor="middle">minted: the scope the approver saw</text>
  <path class="lt dash" d="M732 970 L528 970" marker-end="url(#h-lt)"/>
  <rect class="frame" x="60" y="724" width="1140" height="278" rx="4"/>
  <rect class="tab" x="60" y="724" width="46" height="22" rx="3"/>
  <text class="t" x="83" y="740" font-size="12" text-anchor="middle" font-weight="600">alt</text>
  <text class="t" x="116" y="740" font-size="13" font-weight="600">changed since the snapshot</text>
  <rect class="tab" x="60" y="819" width="46" height="22" rx="3"/>
  <text class="t" x="83" y="835" font-size="12" text-anchor="middle" font-weight="600">else</text>
  <text class="t" x="116" y="835" font-size="13" font-weight="600">unchanged</text>
  <rect class="frame" x="30" y="358" width="1200" height="658" rx="4"/>
  <rect class="tab" x="30" y="358" width="46" height="22" rx="3"/>
  <text class="t" x="53" y="374" font-size="12" text-anchor="middle" font-weight="600">alt</text>
  <text class="t" x="86" y="374" font-size="13" font-weight="600">not approved, or a once-only grant already minted</text>
  <rect class="tab" x="30" y="480" width="46" height="22" rx="3"/>
  <text class="t" x="53" y="496" font-size="12" text-anchor="middle" font-weight="600">else</text>
  <text class="t" x="86" y="496" font-size="13" font-weight="600">approved and not yet minted</text>
</svg>
