<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" width="1200" height="564" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Four shapes a credential takes</title>
  <desc id="desc">Added at the proxy, and minted and added at the proxy, keep the value outside the sandbox; delivered inside and made inside put it inside, where the workload can read it.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .zone { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .sand { fill: #e6f5f2; stroke: #0f8a7e; stroke-width: 2; stroke-dasharray: 8 5; }
    .ok { fill: #e6f5f2; stroke: #0f8a7e; stroke-width: 2; }
    .held { fill: #fff8c5; stroke: #9a6700; stroke-width: 2; }
    .deny { fill: #ffffff; stroke: #cf222e; stroke-width: 1.5; }
    .outline { fill: none; stroke: #59636e; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .frame { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .tab { fill: #f6f8fa; stroke: #59636e; stroke-width: 1.5; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    .dot { fill: #59636e; }
    .pill { fill: #0b766b; stroke: none; }
    .pt { fill: #ffffff; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .a { fill: #0b766b; }
    .r { fill: #cf222e; }
    .h { fill: #9a6700; }
    .ln { fill: none; stroke: #59636e; stroke-width: 2; }
    .lt { fill: none; stroke: #0f8a7e; stroke-width: 2.5; }
    .lr { fill: none; stroke: #cf222e; stroke-width: 2; }
    .lh { fill: none; stroke: #9a6700; stroke-width: 2; }
    .life { fill: none; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .edge { fill: none; stroke: #59636e; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .dash { stroke-dasharray: 6 4; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>
  <defs><marker id="h-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker><marker id="h-lt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f8a7e"/></marker><marker id="h-lr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker><marker id="h-lh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a6700"/></marker></defs>
  <rect class="bg" x="0.5" y="0.5" width="1199" height="563" rx="10"/>
  <rect class="sand" x="236" y="60" width="358" height="454" rx="10"/>
  <text class="t" x="250" y="48" font-size="15" font-weight="600">Inside the sandbox: the workload can read it</text>
  <text class="t" x="644" y="48" font-size="15" font-weight="600">The run's egress proxy</text>
  <text class="t" x="1010" y="48" font-size="15" font-weight="600">Destination</text>
  <path class="edge" d="M612 58 L612 516"/>
  <text class="t" x="30" y="122.0" font-size="16" font-weight="600">Added at the proxy</text>
  <rect class="card" x="250" y="70" width="330" height="92" rx="8"/>
  <rect class="card" x="644" y="70" width="330" height="92" rx="8"/>
  <rect class="card" x="1010" y="70" width="160" height="92" rx="8"/>
  <text class="t" x="264" y="100" font-size="14">No copy, or an inert placeholder</text>
  <rect class="pill" x="658" y="84" width="52.400000000000006" height="22" rx="11"/>
  <text class="pt" x="684.2" y="100" font-size="13" text-anchor="middle" font-weight="600">value</text>
  <text class="t" x="720.4" y="100" font-size="14">From the secret store,</text>
  <text class="t" x="658" y="128" font-size="14">added to the request</text>
  <text class="m" x="1024" y="104" font-size="14">Checks the</text>
  <text class="m" x="1024" y="126" font-size="14">credential on</text>
  <text class="m" x="1024" y="148" font-size="14">the request</text>
  <path class="lt" d="M580 140 L642 140" marker-end="url(#h-lt)"/>
  <path class="lt" d="M974 140 L1008 140" marker-end="url(#h-lt)"/>
  <text class="t" x="30" y="226.0" font-size="16" font-weight="600">Minted and</text>
  <text class="t" x="30" y="246.0" font-size="16" font-weight="600">added at the proxy</text>
  <rect class="card" x="250" y="184" width="330" height="92" rx="8"/>
  <rect class="card" x="644" y="184" width="330" height="92" rx="8"/>
  <rect class="card" x="1010" y="184" width="160" height="92" rx="8"/>
  <text class="t" x="264" y="214" font-size="14">No copy</text>
  <rect class="pill" x="658" y="198" width="52.400000000000006" height="22" rx="11"/>
  <text class="pt" x="684.2" y="214" font-size="13" text-anchor="middle" font-weight="600">value</text>
  <text class="t" x="720.4" y="214" font-size="14">Short-lived, made for this run,</text>
  <text class="t" x="658" y="242" font-size="14">added to the request</text>
  <text class="m" x="1024" y="218" font-size="14">Checks the</text>
  <text class="m" x="1024" y="240" font-size="14">credential on</text>
  <text class="m" x="1024" y="262" font-size="14">the request</text>
  <path class="lt" d="M580 254 L642 254" marker-end="url(#h-lt)"/>
  <path class="lt" d="M974 254 L1008 254" marker-end="url(#h-lt)"/>
  <text class="t" x="30" y="350.0" font-size="16" font-weight="600">Delivered inside</text>
  <rect class="card" x="250" y="298" width="330" height="92" rx="8"/>
  <rect class="card" x="644" y="298" width="330" height="92" rx="8"/>
  <rect class="card" x="1010" y="298" width="160" height="92" rx="8"/>
  <rect class="pill" x="264" y="312" width="52.400000000000006" height="22" rx="11"/>
  <text class="pt" x="290.2" y="328" font-size="13" text-anchor="middle" font-weight="600">value</text>
  <text class="t" x="326.4" y="328" font-size="14">A variable or a file</text>
  <text class="m mono" x="264" y="356" font-size="14">env_secret, file_secret</text>
  <text class="t" x="658" y="328" font-size="14">Checks the host,</text>
  <text class="t" x="658" y="356" font-size="14">adds nothing</text>
  <text class="m" x="1024" y="332" font-size="14">Checks the</text>
  <text class="m" x="1024" y="354" font-size="14">credential on</text>
  <text class="m" x="1024" y="376" font-size="14">the request</text>
  <path class="lt" d="M580 368 L642 368" marker-end="url(#h-lt)"/>
  <path class="lt" d="M974 368 L1008 368" marker-end="url(#h-lt)"/>
  <text class="t" x="30" y="464.0" font-size="16" font-weight="600">Made inside</text>
  <rect class="card" x="250" y="412" width="330" height="92" rx="8"/>
  <rect class="card" x="644" y="412" width="330" height="92" rx="8"/>
  <rect class="card" x="1010" y="412" width="160" height="92" rx="8"/>
  <rect class="pill" x="264" y="426" width="52.400000000000006" height="22" rx="11"/>
  <text class="pt" x="290.2" y="442" font-size="13" text-anchor="middle" font-weight="600">value</text>
  <text class="t" x="326.4" y="442" font-size="14">Derived by the workload:</text>
  <text class="t" x="264" y="470" font-size="14">AWS role credentials from</text>
  <text class="t" x="264" y="492" font-size="14">a bedrock_sso sign-in</text>
  <text class="t" x="658" y="442" font-size="14">Checks the host; the workload</text>
  <text class="t" x="658" y="470" font-size="14">signed the request itself</text>
  <text class="m" x="1024" y="446" font-size="14">Checks the</text>
  <text class="m" x="1024" y="468" font-size="14">credential on</text>
  <text class="m" x="1024" y="490" font-size="14">the request</text>
  <path class="lt" d="M580 482 L642 482" marker-end="url(#h-lt)"/>
  <path class="lt" d="M974 482 L1008 482" marker-end="url(#h-lt)"/>
  <text class="m" x="30" y="540" font-size="14">Made inside, with WARDYN_AWS_SIGV4_AT_PROXY=on: for a sign-in whose AWS hosts the proxy can all re-sign, the proxy signs and the role credentials stay out.</text>
</svg>
