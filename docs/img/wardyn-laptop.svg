<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">On a laptop runner: one laptop, two paths</title>
  <desc id="desc">On a laptop runner, everyday work takes the normal path while each sandbox leaves only through its egress proxy, nothing connects in, and one outbound link brings runs from the organisation and carries audit back.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .zone { fill: #f6f8fa; stroke: #d0d7de; }
    .card { fill: #ffffff; stroke: #d0d7de; }
    .lane { fill: #e6f5f2; stroke: #0a7f73; }
    .sbox { fill: #ffffff; stroke: #0a7f73; stroke-width: 2; }
    .wall { fill: #d8dee4; stroke: #afb8c1; }
    .tag { fill: #0a7f73; }
    .tagt { fill: #ffffff; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .a { fill: #0a7f73; }
    .r { fill: #cf222e; }
    .fa { fill: #0a7f73; }
    .fo { fill: #6e7781; }
    .ft { fill: #1f2328; }
    .cube-top { fill: #9fe3d9; }
    .cube-l { fill: #0a7f73; }
    .cube-r { fill: #075e55; }
    .proxy { fill: #57606a; }
    .sb { fill: none; stroke: #0a7f73; stroke-width: 3; }
    .ord { fill: none; stroke: #6e7781; stroke-width: 2.5; }
    .link { fill: none; stroke: #1f2328; stroke-width: 2.5; stroke-dasharray: 1 7; stroke-linecap: round; }
    .blk { fill: none; stroke: #cf222e; stroke-width: 2.5; stroke-dasharray: 9 7; }
    .sha { stroke: #0a7f73; }
    .shw { stroke: #ffffff; }
    .blkbar { fill: none; stroke: #cf222e; stroke-width: 5; stroke-linecap: round; }
    .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 3px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; stroke: #3d444d; }
        .zone { fill: #161b22; stroke: #3d444d; }
        .card { fill: #0d1117; stroke: #3d444d; }
        .lane { fill: #0d2b28; stroke: #2dd4bf; }
        .sbox { fill: #0d1117; stroke: #2dd4bf; stroke-width: 2; }
        .wall { fill: #262c36; stroke: #4d5561; }
        .tag { fill: #2dd4bf; }
        .tagt { fill: #0d1117; }
        .t { fill: #f0f6fc; }
        .m { fill: #9198a1; }
        .a { fill: #2dd4bf; }
        .r { fill: #ff7b72; }
        .fa { fill: #2dd4bf; }
        .fo { fill: #8b949e; }
        .ft { fill: #f0f6fc; }
        .cube-top { fill: #99f6e4; }
        .cube-l { fill: #2dd4bf; }
        .cube-r { fill: #14958a; }
        .proxy { fill: #545d68; }
        .sb { fill: none; stroke: #2dd4bf; stroke-width: 3; }
        .ord { fill: none; stroke: #8b949e; stroke-width: 2.5; }
        .link { fill: none; stroke: #f0f6fc; stroke-width: 2.5; stroke-dasharray: 1 7; stroke-linecap: round; }
        .blk { fill: none; stroke: #ff7b72; stroke-width: 2.5; stroke-dasharray: 9 7; }
        .sha { stroke: #2dd4bf; }
        .shw { stroke: #0d1117; }
        .blkbar { fill: none; stroke: #ff7b72; stroke-width: 5; stroke-linecap: round; }
    }
  </style>
  <defs>
    <marker id="ah-sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="fa" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ah-ord" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="fo" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ft" d="M0 0 10 5 0 10z"/></marker>
    <g id="shield"><path d="M0 -11 9 -7.5 V0.5 C9 6 4.5 9.5 0 11 C-4.5 9.5 -9 6 -9 0.5 V-7.5Z" fill="none" stroke-width="2" stroke-linejoin="round"/><path d="M-4 0 -1 3 4.5 -3" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="cube"><path class="cube-top" d="M0 -26 26 -13 0 0 -26 -13Z"/><path class="cube-l" d="M-26 -13 0 0 0 30 -26 17Z"/><path class="cube-r" d="M0 0 26 -13 26 17 0 30Z"/></g>
    <g id="proxy"><rect class="proxy" x="-9" y="-24" width="18" height="48" rx="3"/><rect class="fa" x="-2" y="-16" width="4" height="32" rx="2"/></g>
  </defs>

  <rect class="bg" x="1" y="1" width="1598" height="1198" rx="28"/>

  <!-- Outer wall, drawn first so the paths cross it -->
  <rect class="wall" x="1100" y="300" width="50" height="660" rx="10"/>

  <!-- Header -->
  <text class="a eyebrow" x="64" y="92">ON A LAPTOP RUNNER</text>
  <use class="sha" href="#shield" x="1432" y="82"/>
  <text class="t" x="1452" y="90" font-size="24" font-weight="700">Wardyn</text>
  <text class="t" x="64" y="152" font-size="48" font-weight="700">One laptop, two paths</text>
  <text class="m" x="64" y="196" font-size="24">Only sandboxes take the Wardyn lane, and their wall works both ways. Everything else leaves the way it always has.</text>

  <!-- Laptop -->
  <rect class="zone" x="64" y="262" width="930" height="626" rx="24"/>
  <rect class="card" x="96" y="240" width="574" height="44" rx="22"/>
  <text class="t" x="124" y="268" font-size="16" font-weight="700" letter-spacing="3">LAPTOP</text>
  <text class="m" x="228" y="268" font-size="19">runs wardyn-runnerd, claimed by its owner</text>

  <!-- The normal path -->
  <rect class="card" x="88" y="304" width="882" height="132" rx="16"/>
  <rect class="card" x="762" y="286" width="188" height="34" rx="17"/>
  <text class="t" x="856" y="309" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">THE NORMAL PATH</text>
  <text class="t" x="116" y="346" font-size="24" font-weight="700">Everyday work</text>
  <text class="m" x="116" y="372" font-size="19">leaves the way it always has</text>
  <rect class="card" x="116" y="386" width="100" height="36" rx="10"/>
  <text class="t" x="166" y="410" font-size="18" text-anchor="middle">Browser</text>
  <rect class="card" x="228" y="386" width="90" height="36" rx="10"/>
  <text class="t" x="273" y="410" font-size="18" text-anchor="middle">Editor</text>
  <rect class="card" x="330" y="386" width="76" height="36" rx="10"/>
  <text class="t" x="368" y="410" font-size="18" text-anchor="middle">Mail</text>
  <text class="m" x="720" y="390" font-size="18" text-anchor="middle">Wardyn is not in this path</text>
  <path class="ord" d="M414 404 H1186" marker-end="url(#ah-ord)"/>

  <!-- The Wardyn lane -->
  <rect class="lane" x="88" y="460" width="882" height="350" rx="16"/>
  <rect class="tag" x="762" y="442" width="188" height="36" rx="18"/>
  <text class="tagt" x="856" y="466" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">THE WARDYN LANE</text>
  <text class="t" x="112" y="502" font-size="24" font-weight="700">Sandboxes</text>
  <text class="a" x="112" y="530" font-size="19" font-weight="600">an agent, or a plain command</text>

  <rect class="sbox" x="114" y="560" width="324" height="90" rx="16"/>
  <rect class="tag" x="208" y="544" width="156" height="30" rx="15"/>
  <use class="shw" href="#shield" x="228" y="559"/>
  <text class="tagt" x="244" y="565" font-size="14" font-weight="700" letter-spacing="2">INNER WALL</text>
  <use href="#cube" x="166" y="602"/>
  <text class="t" x="216" y="614" font-size="24" font-weight="700">Agent</text>
  <use href="#proxy" x="452" y="605"/>

  <rect class="sbox" x="114" y="692" width="324" height="90" rx="16"/>
  <rect class="tag" x="208" y="676" width="156" height="30" rx="15"/>
  <use class="shw" href="#shield" x="228" y="691"/>
  <text class="tagt" x="244" y="697" font-size="14" font-weight="700" letter-spacing="2">INNER WALL</text>
  <use href="#cube" x="166" y="734"/>
  <text class="t" x="216" y="732" font-size="24" font-weight="700">Build or test</text>
  <text class="m mono" x="216" y="760" font-size="17">task_mode=exec</text>
  <use href="#proxy" x="452" y="737"/>

  <text class="a" x="262" y="801" font-size="18" font-weight="700">Egress proxy, one per sandbox</text>

  <path class="sb" d="M462 737 H530 V605"/>
  <path class="sb" d="M462 605 H1186" marker-end="url(#ah-sb)"/>

  <text class="m" x="606" y="520" font-size="15" font-weight="700" letter-spacing="2">GOING OUT</text>
  <circle class="fa" cx="614" cy="545" r="4"/>
  <text class="t" x="630" y="551" font-size="19">Checked against its policy</text>
  <circle class="fa" cx="614" cy="577" r="4"/>
  <text class="t" x="630" y="583" font-size="19">Decisions logged</text>
  <text class="m" x="606" y="644" font-size="15" font-weight="700" letter-spacing="2">COMING IN</text>
  <circle class="fa" cx="614" cy="669" r="4"/>
  <text class="t" x="630" y="675" font-size="19">No open ports to your network</text>
  <circle class="fa" cx="614" cy="701" r="4"/>
  <text class="t" x="630" y="707" font-size="19">Files: only the folders the run</text>
  <text class="t" x="630" y="731" font-size="19">was given</text>
  <circle class="fa" cx="614" cy="757" r="4"/>
  <text class="t" x="630" y="763" font-size="19">Most keys are added at the proxy,</text>
  <text class="t" x="630" y="787" font-size="19">not placed in the sandbox</text>

  <!-- The runner -->
  <rect class="card" x="270" y="826" width="700" height="46" rx="12"/>
  <text x="292" y="856" font-size="19"><tspan class="t mono" font-weight="700">wardyn-runnerd</tspan><tspan class="m" dx="12">starts each sandbox and its proxy; decides nothing</tspan></text>

  <!-- Laptop base -->
  <rect class="wall" x="40" y="888" width="978" height="20" rx="10"/>

  <!-- Outer wall -->
  <rect class="card" x="1030" y="240" width="506" height="44" rx="22"/>
  <text class="t" x="1060" y="268" font-size="16" font-weight="700" letter-spacing="3">OUTER WALL</text>
  <text class="m" x="1202" y="268" font-size="19">Your organisation's own controls</text>
  <rect class="zone" x="1196" y="304" width="340" height="506" rx="16"/>
  <text class="t" x="1226" y="398" font-size="22" font-weight="700">Everyday traffic</text>
  <text class="m" x="1226" y="426" font-size="18">what your organisation allows</text>
  <text class="t" x="1226" y="518" font-size="22" font-weight="700">Internet</text>
  <text class="t" x="1226" y="598" font-size="22" font-weight="700">Sandbox traffic</text>
  <text class="a" x="1226" y="626" font-size="18" font-weight="600">only destinations its policy allows</text>
  <text class="m" x="1226" y="652" font-size="18">replies come back through its proxy</text>

  <!-- Below the laptop -->
  <path class="blk" d="M242 782 V990"/>
  <path class="blkbar" d="M228 784 H256"/>
  <text class="r" x="256" y="952" font-size="19" font-weight="600">can't connect in</text>
  <rect class="card" x="112" y="990" width="260" height="84" rx="14"/>
  <text class="t" x="136" y="1026" font-size="22" font-weight="700">Your network</text>
  <text class="m" x="136" y="1054" font-size="18">other machines on it</text>

  <path class="ord" d="M552 990 V914" marker-end="url(#ah-ord)"/>
  <text class="t" x="538" y="952" font-size="19" font-weight="600" text-anchor="end">installs it</text>
  <rect class="card" x="404" y="990" width="316" height="108" rx="14"/>
  <text class="t" x="428" y="1026" font-size="22" font-weight="700">Your MDM, if you use one</text>
  <text class="m" x="428" y="1054" font-size="18">installs the runner and</text>
  <text class="m" x="428" y="1078" font-size="18">reports posture</text>

  <path class="link" d="M962 878 V984" marker-start="url(#ah-link)" marker-end="url(#ah-link)"/>
  <text class="t" x="948" y="952" font-size="19" font-weight="600" text-anchor="end">one outbound link: runs in, audit out</text>
  <rect class="card" x="744" y="990" width="332" height="84" rx="14"/>
  <text class="t" x="768" y="1026" font-size="22" font-weight="700">Org control plane</text>
  <text class="m" x="768" y="1054" font-size="18">the only scheduler and audit writer</text>

  <!-- Footer and legend -->
  <text x="64" y="1132" font-size="18"><tspan class="m">The organisation decides and records every run; </tspan><tspan class="t mono">wardyn-runnerd</tspan><tspan class="m"> only starts it. The person at the laptop is root on it: Wardyn governs the sandboxes, not them.</tspan></text>
  <path class="sb" d="M64 1166 H104"/>
  <text class="m" x="116" y="1172" font-size="17">Sandbox traffic</text>
  <path class="ord" d="M300 1166 H340"/>
  <text class="m" x="352" y="1172" font-size="17">Ordinary traffic</text>
  <path class="link" d="M540 1166 H580"/>
  <text class="m" x="592" y="1172" font-size="17">The runner's link to the organisation</text>
  <path class="blk" d="M940 1166 H980"/>
  <text class="m" x="992" y="1172" font-size="17">Blocked at the inner wall</text>
</svg>
