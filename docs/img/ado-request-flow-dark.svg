<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1410" width="1260" height="1410" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Azure DevOps request flow</title>
  <desc id="desc">A run's Azure DevOps request goes from the sandbox to the run's proxy, which asks wardynd for the capability: held, it is forwarded with the credential; under wait_for_review it is held for a person; under deny_with_review or always_deny, or above the ceiling, it is refused.</desc>
  <style>
    .bg { fill: #0d1117; stroke: #3d444d; }
    .zone { fill: #161b22; stroke: #3d444d; stroke-width: 1.5; }
    .card { fill: #0d1117; stroke: #9198a1; stroke-width: 1.5; }
    .sand { fill: #0d2b28; stroke: #3cc6b6; stroke-width: 2; stroke-dasharray: 8 5; }
    .ok { fill: #0d2b28; stroke: #3cc6b6; stroke-width: 2; }
    .held { fill: #2e2410; stroke: #d29922; stroke-width: 2; }
    .deny { fill: #0d1117; stroke: #ff7b72; stroke-width: 1.5; }
    .outline { fill: none; stroke: #9198a1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .frame { fill: none; stroke: #9198a1; stroke-width: 1.5; }
    .tab { fill: #161b22; stroke: #9198a1; stroke-width: 1.5; }
    .halo { paint-order: stroke; stroke: #0d1117; stroke-width: 5px; stroke-linejoin: round; }
    .dot { fill: #9198a1; }
    .pill { fill: #3cc6b6; stroke: none; }
    .pt { fill: #0d1117; }
    .t { fill: #e6edf3; }
    .m { fill: #9198a1; }
    .a { fill: #3cc6b6; }
    .r { fill: #ff7b72; }
    .h { fill: #d29922; }
    .ln { fill: none; stroke: #9198a1; stroke-width: 2; }
    .lt { fill: none; stroke: #3cc6b6; stroke-width: 2.5; }
    .lr { fill: none; stroke: #ff7b72; stroke-width: 2; }
    .lh { fill: none; stroke: #d29922; stroke-width: 2; }
    .life { fill: none; stroke: #3d444d; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .edge { fill: none; stroke: #9198a1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .dash { stroke-dasharray: 6 4; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>
  <defs><marker id="h-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9198a1"/></marker><marker id="h-lt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3cc6b6"/></marker><marker id="h-lr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff7b72"/></marker><marker id="h-lh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d29922"/></marker></defs>
  <rect class="bg" x="0.5" y="0.5" width="1259" height="1409" rx="10"/>
  <path class="life" d="M110 68 L110 1390"/>
  <path class="life" d="M318 68 L318 1390"/>
  <path class="life" d="M526 68 L526 1390"/>
  <path class="life" d="M734 68 L734 1390"/>
  <path class="life" d="M942 68 L942 1390"/>
  <path class="life" d="M1150 68 L1150 1390"/>
  <rect class="zone" x="18.0" y="24" width="184" height="44" rx="8"/>
  <text class="t" x="110" y="52" font-size="15" text-anchor="middle" font-weight="600">Person</text>
  <rect class="zone" x="226.0" y="24" width="184" height="44" rx="8"/>
  <text class="t" x="318" y="52" font-size="15" text-anchor="middle" font-weight="600">wardynd</text>
  <rect class="zone" x="434.0" y="24" width="184" height="44" rx="8"/>
  <text class="t" x="526" y="52" font-size="15" text-anchor="middle" font-weight="600">Entra ID</text>
  <rect class="zone" x="642.0" y="24" width="184" height="44" rx="8"/>
  <text class="t" x="734" y="52" font-size="15" text-anchor="middle" font-weight="600">Sandbox</text>
  <rect class="zone" x="850.0" y="24" width="184" height="44" rx="8"/>
  <text class="t" x="942" y="52" font-size="15" text-anchor="middle" font-weight="600">wardyn-proxy</text>
  <rect class="zone" x="1058.0" y="24" width="184" height="44" rx="8"/>
  <text class="t" x="1150" y="52" font-size="15" text-anchor="middle" font-weight="600">Azure DevOps</text>
  <text class="t halo" x="214.0" y="88" font-size="13" text-anchor="middle">sign in</text>
  <path class="ln" d="M112 96 L316 96" marker-end="url(#h-ln)"/>
  <text class="t halo" x="422.0" y="132" font-size="13" text-anchor="middle">browser redirect</text>
  <path class="ln" d="M320 140 L524 140" marker-end="url(#h-ln)"/>
  <text class="t halo" x="422.0" y="176" font-size="13" text-anchor="middle">per-user grant, captured</text>
  <path class="ln dash" d="M524 184 L320 184" marker-end="url(#h-ln)"/>
  <rect class="zone" x="248" y="208" width="556" height="46" rx="4"/>
  <text class="t" x="526.0" y="224" font-size="13" text-anchor="middle">The run dispatches as that person</text>
  <text class="m" x="526.0" y="242" font-size="13" text-anchor="middle">minted_pat: Wardyn creates the run's PAT here</text>
  <text class="t halo" x="838.0" y="284" font-size="13" text-anchor="middle">Azure DevOps request, no token</text>
  <path class="lt" d="M736 292 L940 292" marker-end="url(#h-lt)"/>
  <text class="t halo" x="630.0" y="328" font-size="13" text-anchor="middle">resolve capability C for this grant</text>
  <path class="ln" d="M940 336 L320 336" marker-end="url(#h-ln)"/>
  <text class="t halo" x="630.0" y="406" font-size="13" text-anchor="middle">200, the run's credential</text>
  <path class="ln dash" d="M320 414 L940 414" marker-end="url(#h-ln)"/>
  <text class="t halo" x="1046.0" y="450" font-size="13" text-anchor="middle">forward, credential attached</text>
  <path class="lt" d="M944 458 L1148 458" marker-end="url(#h-lt)"/>
  <text class="t halo" x="1046.0" y="494" font-size="13" text-anchor="middle">response</text>
  <path class="ln dash" d="M1148 502 L944 502" marker-end="url(#h-ln)"/>
  <text class="t halo" x="838.0" y="538" font-size="13" text-anchor="middle">response</text>
  <path class="lt dash" d="M940 546 L736 546" marker-end="url(#h-lt)"/>
  <path class="edge" d="M30 578 L1230 578"/>
  <text class="t halo" x="630.0" y="616" font-size="13" text-anchor="middle">423 capability_pending</text>
  <path class="lh dash" d="M320 624 L940 624" marker-end="url(#h-lh)"/>
  <rect class="held" x="872" y="648" width="140" height="28" rx="4"/>
  <text class="t" x="942.0" y="664" font-size="13" text-anchor="middle">the request is held</text>
  <text class="t halo" x="214.0" y="706" font-size="13" text-anchor="middle">allow once, or allow for this run</text>
  <path class="ln" d="M112 714 L316 714" marker-end="url(#h-ln)"/>
  <text class="t halo" x="630.0" y="750" font-size="13" text-anchor="middle">resolve again with the approval</text>
  <path class="ln" d="M940 758 L320 758" marker-end="url(#h-ln)"/>
  <text class="t halo" x="630.0" y="794" font-size="13" text-anchor="middle">200, the run's credential</text>
  <path class="ln dash" d="M320 802 L940 802" marker-end="url(#h-ln)"/>
  <text class="t halo" x="1046.0" y="838" font-size="13" text-anchor="middle">forward, credential attached</text>
  <path class="lt" d="M944 846 L1148 846" marker-end="url(#h-lt)"/>
  <text class="t halo" x="1046.0" y="882" font-size="13" text-anchor="middle">response</text>
  <path class="ln dash" d="M1148 890 L944 890" marker-end="url(#h-ln)"/>
  <text class="t halo" x="838.0" y="926" font-size="13" text-anchor="middle">response</text>
  <path class="lt dash" d="M940 934 L736 934" marker-end="url(#h-lt)"/>
  <path class="edge" d="M30 966 L1230 966"/>
  <text class="t halo" x="630.0" y="1004" font-size="13" text-anchor="middle">403; a request is raised</text>
  <path class="lr dash" d="M320 1012 L940 1012" marker-end="url(#h-lr)"/>
  <text class="t halo" x="838.0" y="1048" font-size="13" text-anchor="middle">refused</text>
  <text class="m halo" x="838.0" y="1065" font-size="13" text-anchor="middle">a retry passes once</text>
  <text class="m halo" x="838.0" y="1082" font-size="13" text-anchor="middle">a person approves</text>
  <path class="lr dash" d="M940 1090 L736 1090" marker-end="url(#h-lr)"/>
  <path class="edge" d="M30 1122 L1230 1122"/>
  <text class="t halo" x="630.0" y="1160" font-size="13" text-anchor="middle">403</text>
  <path class="lr dash" d="M320 1168 L940 1168" marker-end="url(#h-lr)"/>
  <text class="t halo" x="838.0" y="1204" font-size="13" text-anchor="middle">refused</text>
  <path class="lr dash" d="M940 1212 L736 1212" marker-end="url(#h-lr)"/>
  <path class="edge" d="M30 1244 L1230 1244"/>
  <text class="t halo" x="630.0" y="1282" font-size="13" text-anchor="middle">403 capability_above_ceiling</text>
  <path class="lr dash" d="M320 1290 L940 1290" marker-end="url(#h-lr)"/>
  <text class="t halo" x="838.0" y="1326" font-size="13" text-anchor="middle">refused</text>
  <path class="lr dash" d="M940 1334 L736 1334" marker-end="url(#h-lr)"/>
  <rect class="frame" x="30" y="368" width="1200" height="998" rx="4"/>
  <rect class="tab" x="30" y="368" width="46" height="22" rx="3"/>
  <text class="t" x="53" y="384" font-size="12" text-anchor="middle" font-weight="600">alt</text>
  <text class="t" x="86" y="384" font-size="13" font-weight="600">C is held by the run</text>
  <rect class="tab" x="30" y="578" width="46" height="22" rx="3"/>
  <text class="t" x="53" y="594" font-size="12" text-anchor="middle" font-weight="600">else</text>
  <text class="t" x="86" y="594" font-size="13" font-weight="600">C is inside the ceiling, not held; first-use mode wait_for_review</text>
  <rect class="tab" x="30" y="966" width="46" height="22" rx="3"/>
  <text class="t" x="53" y="982" font-size="12" text-anchor="middle" font-weight="600">else</text>
  <text class="t" x="86" y="982" font-size="13" font-weight="600">not held; first-use mode deny_with_review</text>
  <rect class="tab" x="30" y="1122" width="46" height="22" rx="3"/>
  <text class="t" x="53" y="1138" font-size="12" text-anchor="middle" font-weight="600">else</text>
  <text class="t" x="86" y="1138" font-size="13" font-weight="600">not held; first-use mode always_deny</text>
  <rect class="tab" x="30" y="1244" width="46" height="22" rx="3"/>
  <text class="t" x="53" y="1260" font-size="12" text-anchor="middle" font-weight="600">else</text>
  <text class="t" x="86" y="1260" font-size="13" font-weight="600">C is above the ceiling</text>
</svg>
