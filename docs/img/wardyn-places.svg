<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Where Wardyn sits: many inner walls, one outer wall</title>
  <desc id="desc">One outer wall surrounds the cloud zone and people's devices; each sandbox has its own inner wall and proxy, nothing connects in, and the proxy adds keys to outbound requests. A laptop or desktop runs a runner claimed by its owner, which opens one link to the org control plane for runs and audit.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .zone { fill: #f6f8fa; stroke: #d0d7de; }
    .card { fill: #ffffff; stroke: #d0d7de; }
    .dash { fill: none; stroke: #afb8c1; stroke-dasharray: 6 5; }
    .chip { fill: #ffffff; stroke: #afb8c1; stroke-dasharray: 4 4; }
    .sbox { fill: #ffffff; stroke: #0a7f73; stroke-width: 2; }
    .wall { fill: #d8dee4; stroke: #afb8c1; }
    .tag { fill: #0a7f73; }
    .tagt { fill: #ffffff; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .a { fill: #0a7f73; }
    .r { fill: #cf222e; }
    .fa { fill: #0a7f73; }
    .fo { fill: #6e7781; }
    .ft { fill: #1f2328; }
    .cube-top { fill: #9fe3d9; }
    .cube-l { fill: #0a7f73; }
    .cube-r { fill: #075e55; }
    .proxy { fill: #57606a; }
    .srv-top { fill: #afb8c1; }
    .srv-l { fill: #57606a; }
    .srv-r { fill: #424a53; }
    .sha { stroke: #0a7f73; }
    .shw { stroke: #ffffff; }
    .sb { fill: none; stroke: #0a7f73; stroke-width: 3; }
    .ord { fill: none; stroke: #6e7781; stroke-width: 2.5; }
    .link { fill: none; stroke: #1f2328; stroke-width: 2.5; stroke-dasharray: 1 7; stroke-linecap: round; }
    .blk { fill: none; stroke: #cf222e; stroke-width: 2.5; stroke-dasharray: 9 7; }
    .blkbar { fill: none; stroke: #cf222e; stroke-width: 5; stroke-linecap: round; }
    .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 3px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; stroke: #3d444d; }
        .zone { fill: #161b22; stroke: #3d444d; }
        .card { fill: #0d1117; stroke: #3d444d; }
        .dash { fill: none; stroke: #4d5561; stroke-dasharray: 6 5; }
        .chip { fill: #0d1117; stroke: #4d5561; stroke-dasharray: 4 4; }
        .sbox { fill: #0d1117; stroke: #2dd4bf; stroke-width: 2; }
        .wall { fill: #262c36; stroke: #4d5561; }
        .tag { fill: #2dd4bf; }
        .tagt { fill: #0d1117; }
        .t { fill: #f0f6fc; }
        .m { fill: #9198a1; }
        .a { fill: #2dd4bf; }
        .r { fill: #ff7b72; }
        .fa { fill: #2dd4bf; }
        .fo { fill: #8b949e; }
        .ft { fill: #f0f6fc; }
        .cube-top { fill: #99f6e4; }
        .cube-l { fill: #2dd4bf; }
        .cube-r { fill: #14958a; }
        .proxy { fill: #545d68; }
        .srv-top { fill: #545d68; }
        .srv-l { fill: #373e47; }
        .srv-r { fill: #2d333b; }
        .sha { stroke: #2dd4bf; }
        .shw { stroke: #0d1117; }
        .sb { fill: none; stroke: #2dd4bf; stroke-width: 3; }
        .ord { fill: none; stroke: #8b949e; stroke-width: 2.5; }
        .link { fill: none; stroke: #f0f6fc; stroke-width: 2.5; stroke-dasharray: 1 7; stroke-linecap: round; }
        .blk { fill: none; stroke: #ff7b72; stroke-width: 2.5; stroke-dasharray: 9 7; }
        .blkbar { fill: none; stroke: #ff7b72; stroke-width: 5; stroke-linecap: round; }
    }
  </style>
  <defs>
    <marker id="ah-sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="fa" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ah-ord" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="fo" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ft" d="M0 0 10 5 0 10z"/></marker>
    <g id="shield"><path d="M0 -11 9 -7.5 V0.5 C9 6 4.5 9.5 0 11 C-4.5 9.5 -9 6 -9 0.5 V-7.5Z" fill="none" stroke-width="2" stroke-linejoin="round"/><path d="M-4 0 -1 3 4.5 -3" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="cube"><path class="cube-top" d="M0 -22 22 -11 0 0 -22 -11Z"/><path class="cube-l" d="M-22 -11 0 0 0 25 -22 14Z"/><path class="cube-r" d="M0 0 22 -11 22 14 0 25Z"/></g>
    <g id="proxy"><rect class="proxy" x="-7" y="-14" width="14" height="28" rx="3"/><rect class="fa" x="-1.5" y="-9" width="3" height="18" rx="1.5"/></g>
    <g id="server"><path class="srv-top" d="M0 -34 34 -17 0 0 -34 -17Z"/><path class="srv-l" d="M-34 -17 0 0 0 64 -34 47Z"/><path class="srv-r" d="M0 0 34 -17 34 47 0 64Z"/><path class="fa" d="M-4 8 -1 9.5 -1 54 -4 52.5Z"/></g>
    <g id="globe"><circle r="11" fill="none" stroke-width="2"/><ellipse rx="5" ry="11" fill="none" stroke-width="2"/><path d="M-11 0 H11" fill="none" stroke-width="2"/></g>
  </defs>

  <rect class="bg" x="1" y="1" width="1598" height="1078" rx="28"/>

  <!-- Header -->
  <text class="a eyebrow" x="64" y="92">WHERE WARDYN SITS</text>
  <use class="sha" href="#shield" x="1432" y="82"/>
  <text class="t" x="1452" y="90" font-size="24" font-weight="700">Wardyn</text>
  <text class="t" x="64" y="152" font-size="48" font-weight="700">Many inner walls, one outer wall</text>
  <text class="m" x="64" y="196" font-size="24">Your outer wall surrounds every place work runs. Wardyn adds an inner wall around each sandbox, wherever it runs.</text>

  <!-- Outer wall -->
  <path class="wall" fill-rule="evenodd" d="M104 262 H1496 A40 40 0 0 1 1536 302 V830 A40 40 0 0 1 1496 870 H104 A40 40 0 0 1 64 830 V302 A40 40 0 0 1 104 262Z M114 292 A20 20 0 0 0 94 312 V820 A20 20 0 0 0 114 840 H1486 A20 20 0 0 0 1506 820 V312 A20 20 0 0 0 1486 292Z"/>
  <rect class="card" x="112" y="240" width="770" height="44" rx="22"/>
  <text class="t" x="140" y="268" font-size="16" font-weight="700" letter-spacing="3">OUTER WALL</text>
  <text class="m" x="282" y="268" font-size="19">Your organisation's firewall, proxy, VPN, device management</text>

  <!-- Cloud or datacentre -->
  <rect class="zone" x="118" y="322" width="804" height="486" rx="14"/>
  <text class="m" x="142" y="358" font-size="15" font-weight="700" letter-spacing="2">CLOUD OR DATACENTRE</text>
  <text class="m" x="390" y="358" font-size="18">a cluster, or one host</text>
  <rect class="dash" x="140" y="380" width="492" height="282" rx="12"/>
  <rect class="tag" x="158" y="394" width="456" height="38" rx="19"/>
  <use class="shw" href="#shield" x="184" y="413"/>
  <text class="tagt" x="202" y="419" font-size="15" font-weight="700" letter-spacing="2">INNER WALL</text>
  <text class="tagt" x="334" y="420" font-size="18" font-weight="700">each sandbox, both ways</text>

  <rect class="sbox" x="176" y="452" width="102" height="126" rx="12"/>
  <use href="#cube" x="227" y="498"/>
  <text class="t" x="227" y="556" font-size="16" font-weight="700" text-anchor="middle">Agent run</text>
  <rect class="sbox" x="290" y="452" width="102" height="126" rx="12"/>
  <use href="#cube" x="341" y="498"/>
  <text class="t" x="341" y="556" font-size="16" font-weight="700" text-anchor="middle">CI job</text>
  <rect class="sbox" x="404" y="452" width="102" height="126" rx="12"/>
  <use href="#cube" x="455" y="498"/>
  <text class="t" x="455" y="556" font-size="16" font-weight="700" text-anchor="middle">App server</text>
  <rect class="sbox" x="518" y="452" width="102" height="126" rx="12"/>
  <use href="#cube" x="569" y="498"/>
  <text class="t" x="569" y="546" font-size="16" font-weight="700" text-anchor="middle">Developer</text>
  <text class="t" x="569" y="566" font-size="16" font-weight="700" text-anchor="middle">sandbox</text>
  <path class="sb" d="M227 596 V696 H569 V596 M341 596 V696 M455 596 V696 M420 696 V914" marker-end="url(#ah-sb)"/>
  <use href="#proxy" x="227" y="590"/>
  <use href="#proxy" x="341" y="590"/>
  <use href="#proxy" x="455" y="590"/>
  <use href="#proxy" x="569" y="590"/>

  <path class="blk" d="M156 512 V718"/>
  <path class="blkbar" d="M146 506 H168"/>
  <rect class="chip" x="150" y="722" width="190" height="36" rx="8"/>
  <text class="m" x="245" y="746" font-size="17" text-anchor="middle">Internal services</text>
  <rect class="chip" x="150" y="766" width="190" height="36" rx="8"/>
  <text class="m" x="245" y="790" font-size="17" text-anchor="middle">Build systems</text>
  <path class="ord" d="M340 740 H360 V784 M340 784 H376 V914" marker-end="url(#ah-ord)"/>

  <rect class="card" x="688" y="392" width="184" height="232" rx="14"/>
  <use href="#server" x="780" y="446"/>
  <text class="t" x="780" y="546" font-size="20" font-weight="700" text-anchor="middle">Org control plane</text>
  <text class="t mono" x="780" y="574" font-size="17" text-anchor="middle">wardynd</text>
  <text class="m" x="780" y="602" font-size="15" text-anchor="middle">policy · approvals · audit</text>
  <path class="link" d="M684 478 H642" marker-end="url(#ah-link)"/>
  <text class="t" x="642" y="466" font-size="18" font-weight="600">policy</text>
  <path class="link" d="M638 556 H682" marker-end="url(#ah-link)"/>
  <text class="t" x="642" y="544" font-size="18" font-weight="600">audit</text>

  <text class="m" x="650" y="680" font-size="14" font-weight="700" letter-spacing="2">THE INNER WALL, BOTH WAYS</text>
  <text class="t" x="650" y="710" font-size="17">Out: only through its egress proxy</text>
  <text class="r" x="650" y="736" font-size="17">In: nothing connects in</text>
  <text class="t" x="650" y="764" font-size="17">Keys are added at the proxy,</text>
  <text class="t" x="650" y="786" font-size="17">not placed in the sandbox</text>

  <!-- People's devices -->
  <rect class="zone" x="938" y="322" width="544" height="486" rx="14"/>
  <text class="m" x="1460" y="358" font-size="15" font-weight="700" letter-spacing="2" text-anchor="end">PEOPLE'S DEVICES</text>
  <text class="m" x="1128" y="402" font-size="13" font-weight="700" letter-spacing="2">NO SANDBOX</text>
  <rect class="chip" x="1250" y="382" width="70" height="30" rx="7"/>
  <text class="m" x="1285" y="402" font-size="14" text-anchor="middle">Laptops</text>
  <rect class="chip" x="1328" y="382" width="78" height="30" rx="7"/>
  <text class="m" x="1367" y="402" font-size="14" text-anchor="middle">Desktops</text>
  <rect class="chip" x="1414" y="382" width="62" height="30" rx="7"/>
  <text class="m" x="1445" y="402" font-size="14" text-anchor="middle">Phones</text>

  <rect class="card" x="966" y="434" width="500" height="222" rx="14"/>
  <rect class="card" x="982" y="448" width="166" height="36" rx="8"/>
  <text class="t mono" x="1065" y="472" font-size="17" text-anchor="middle">wardyn-runnerd</text>
  <path class="link" d="M978 466 H878" marker-end="url(#ah-link)"/>
  <text class="t" x="882" y="452" font-size="15" font-weight="600">runs, audit</text>

  <rect class="sbox" x="980" y="498" width="80" height="102" rx="10"/>
  <use href="#cube" x="1020" y="534"/>
  <text class="t" x="1020" y="586" font-size="14" font-weight="700" text-anchor="middle">Agent run</text>
  <rect class="sbox" x="1070" y="498" width="80" height="102" rx="10"/>
  <use href="#cube" x="1110" y="534"/>
  <text class="t" x="1110" y="574" font-size="14" font-weight="700" text-anchor="middle">Developer</text>
  <text class="t" x="1110" y="590" font-size="14" font-weight="700" text-anchor="middle">sandbox</text>
  <rect class="sbox" x="1160" y="498" width="80" height="102" rx="10"/>
  <use href="#cube" x="1200" y="534"/>
  <text class="t" x="1200" y="586" font-size="14" font-weight="700" text-anchor="middle">App server</text>
  <path class="sb" d="M1020 612 V630 H1200 V612 M1110 612 V630 M1062 630 V914" marker-end="url(#ah-sb)"/>
  <use href="#proxy" x="1020" y="608"/>
  <use href="#proxy" x="1110" y="608"/>
  <use href="#proxy" x="1200" y="608"/>

  <text class="t" x="1262" y="482" font-size="18" font-weight="700">Everyday work</text>
  <rect class="chip" x="1262" y="498" width="130" height="32" rx="7"/>
  <text class="m" x="1327" y="520" font-size="15" text-anchor="middle">Browser</text>
  <rect class="chip" x="1262" y="540" width="130" height="32" rx="7"/>
  <text class="m" x="1327" y="562" font-size="15" text-anchor="middle">Editor</text>
  <rect class="chip" x="1262" y="582" width="130" height="32" rx="7"/>
  <text class="m" x="1327" y="604" font-size="15" text-anchor="middle">Mail</text>
  <path class="ord" d="M1327 614 V688 H1124 V914" marker-end="url(#ah-ord)"/>

  <rect class="wall" x="948" y="662" width="528" height="14" rx="7"/>
  <text class="t" x="1146" y="732" font-size="20" font-weight="700">Laptop or desktop with a runner</text>
  <text class="m" x="1146" y="758" font-size="17">claimed by its owner</text>

  <!-- Out through the outer wall -->
  <text class="a" x="760" y="830" font-size="17" font-weight="700" text-anchor="middle">Each place runs the sandboxes that fit it. CI jobs run in the cluster.</text>
  <text class="m" x="462" y="900" font-size="17">then your existing egress</text>
  <text class="m" x="1158" y="900" font-size="17">the same outer wall</text>
  <rect class="zone" x="64" y="924" width="1472" height="52" rx="26"/>
  <use class="sha" href="#globe" x="112" y="950"/>
  <text class="t" x="140" y="958" font-size="21" font-weight="700">Internet</text>
  <text class="m" x="1510" y="957" font-size="17" text-anchor="end">Sandboxes reach only what their policy allows</text>

  <!-- Legend -->
  <path class="sb" d="M64 1008 H104"/>
  <text class="m" x="116" y="1014" font-size="16">Sandbox traffic: inner wall, then outer wall</text>
  <path class="ord" d="M530 1008 H570"/>
  <text class="m" x="582" y="1014" font-size="16">Ordinary traffic: outer wall only</text>
  <path class="link" d="M900 1008 H940"/>
  <text class="m" x="952" y="1014" font-size="16">Policy and audit links, not traffic</text>
  <use href="#proxy" x="1300" y="1008"/>
  <text class="m" x="1318" y="1014" font-size="16">Wardyn's egress proxy</text>
  <path class="blk" d="M64 1046 H104"/>
  <text class="m" x="116" y="1052" font-size="16">Coming in: stopped at the inner wall. Nothing on the network connects to a sandbox.</text>
</svg>
