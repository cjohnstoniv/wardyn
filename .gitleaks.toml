# Gitleaks config: default rules plus path/regex allowlists for broad
# prose/doc false positives, the leaked-value detector's own test fixtures,
# and any OTHER fixture that recurs across commits (a mask test that mints a
# fresh fake token per test run, a source constant, …) — those churn a new
# per-commit fingerprint on every touching commit under the .gitleaksignore
# mechanism, where a path/regex entry here covers it regardless of commit.
# CI (gitleaks job) and any local `gitleaks git` scan pick this up
# automatically from the repo root. One-off accepted findings (exact
# commit/file/line, not expected to recur) are allowlisted by fingerprint
# instead, in the sibling .gitleaksignore file — see that file for why each
# one is safe.

[extend]
useDefault = true

[allowlist]
description = "Deliberate fake fixtures and prose false positives"
regexTarget = "match"
regexes = [
    # README prose "…: secret-output masking, eBPF/Tetragon …" trips
    # generic-api-key with "eBPF/Tetragon" parsed as the secret value.
    '''secret-output masking''',
    # The compose demo admin token placeholder used across docs/scripts curl
    # examples (curl-auth-header rule); it is the documented default, not a
    # secret.
    '''demo-admin-token''',
    # The UI-sandbox e2e's canary string: it is put in an Authorization header
    # (curl-auth-header rule) precisely so the test can assert the gateway
    # STRIPS it before the request reaches the sandbox. Its whole job is to be
    # a value that must never come back — never a credential.
    '''MUST-NOT-LEAK''',
    # internal/secretstore's on-disk envelope AAD label — a fixed string
    # constant (`secretAADLabel`), not a key, that generic-api-key parses as
    # one. It has churned a new .gitleaksignore fingerprint on every commit
    # that touches its line; the value itself never changes.
    '''wardyn/secret/v1''',
    # scripts/test-install-sh-trust.sh's install fixtures (also in
    # deploy/helm/wardyn/ci/all-on-values.yaml and cmd/wardynd/main_test.go):
    # a STUB age key — "STUB" cannot follow the separator in a real one, since
    # B is not in the bech32 alphabet — and a 0-9a-f cycle standing in for a
    # "real-shaped admin token to keep". Both recurred across five commits.
    '''AGE-SECRET-KEY-1STUB''',
    '''a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718''',
    # The k8s day-2 runbook (docs/OPERATIONS.md) quotes wardynd's
    # ephemeral-age-identity warning, which prints the PUBLIC recipient
    # (age1…) — public by construction. It also quotes the Helm chart's
    # age-key preflight fail message (deploy/helm/wardyn/templates/secret.yaml),
    # whose remediation text names the values flag
    # `secrets.allowEphemeralAgeKey=true` — a chart value name, not key
    # material.
    '''public_recipient=age1''',
    '''secrets\.allowEphemeralAgeKey=''',
]
paths = [
    # The leaked-value detector's own tests: intentionally realistic-shaped
    # FAKE tokens (glpat-…, credentials-in-URL) that the detector must match.
    '''internal/workspacescan/detect_test\.go''',
    # Same category, client side: the Add-workspace wizard warns when a custom
    # Dockerfile build step looks like it carries a credential, so its tests
    # must contain lines that look exactly like that. A detector's tests have
    # to hold the thing it detects.
    '''ui/src/app/components/screens/workspace-wizard/wizard-types\.test\.ts''',
    '''ui/src/app/components/screens/workspace-wizard/step-base-image\.test\.tsx''',
    '''ui/e2e/workspace-wizard\.spec\.ts''',
    # The PAT-masking test mints a fresh fake GitLab PAT fixture per test run
    # (so a -count=2 re-run doesn't collide in the global mask registry),
    # which changes the fingerprinted line's content on every touching
    # commit. Same category as the detector tests above: this file's whole
    # job is to hold a token-shaped fixture.
    '''internal/egress/proxy/pat_broker_mask_test\.go''',
]
